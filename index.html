/* ---------- exercise categories ----------
   Colour for an exercise's left rail. Resolution order:
     1. an explicit `category` on the exercise (tp-program-1 optional field)
     2. a keyword guess from the exercise name
     3. nothing — neutral rail (never assert a category we don't have)
   Colours are CSS variables, not hex: each theme picks rail colours from its own
   palette, so a category keeps its *slot* across themes rather than its exact hue.
   The uppercase tag chip that used to sit on every card is gone — the rail alone
   carries the category now; see CLAUDE.md. */
const CATS={
  warmup:  {label:"Warm-up",       color:"var(--cat-warm)"},
  tendon:  {label:"Tendon/prehab", color:"var(--cat-tendon)"},
  skill:   {label:"Skill",         color:"var(--cat-skill)"},
  strength:{label:"Strength",      color:"var(--cat-strength)"},
  cond:    {label:"Conditioning",  color:"var(--cat-cond)"},
  accessory:{label:"Accessory",    color:"var(--cat-accessory)"},
  cooldown:{label:"Cool-down",     color:"var(--cat-warm)"}
};
/* Aliases so a generator can say "conditioning", "metcon", "prehab" etc. */
const CAT_ALIASES={metcon:"cond",conditioning:"cond",aerobic:"cond",cardio:"cond",
  prehab:"tendon",rehab:"tendon",tendon:"tendon",isometric:"tendon",
  warmup:"warmup","warm-up":"warmup",prep:"warmup",
  cooldown:"cooldown","cool-down":"cooldown",mobility:"cooldown",
  skill:"skill",technique:"skill",olympic:"skill",
  strength:"strength",lift:"strength",main:"strength",
  accessory:"accessory",auxiliary:"accessory",core:"accessory"};
/* Ordered — skill lifts must win before the EMOM/interval rule, because
   "Hang power clean (EMOM every 90s)" is skill work, not conditioning. */
const CAT_RULES=[
  [/warm-?up|cool-?down|prep\b|mobility/i,                               "warmup"],
  [/isometric|spanish squat|nordic|copenhagen|tibialis|prehab|neck iso/i, "tendon"],
  [/clean|snatch|jerk|muscle-?up|skill|high pull/i,                       "skill"],
  [/metcon|emom|amrap|for time|interval|erg\b|bike|\bski\b|sled|couplet/i,"cond"],
  [/squat|deadlift|rdl|press|bench|\brow\b|pull-?up|\bchin|\bdip|hinge/i, "strength"]
];
/* Unknown declared categories still get a stable colour rather than falling back to
   grey, so a generator can invent its own vocabulary and the UI keeps working. Drawn
   from the active theme's rail colours so an invented category can't import a hue the
   palette doesn't contain. */
const SPARE_COLORS=["var(--cat-skill)","var(--cat-strength)","var(--cat-cond)",
  "var(--cat-accessory)","var(--cat-tendon)","var(--cat-warm)"];
function spareColor(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return SPARE_COLORS[h%SPARE_COLORS.length];}

function catOf(ex){
  const declared=(ex.category||"").toString().trim();
  if(declared){
    const k=declared.toLowerCase().replace(/[\s_]+/g,"-");
    const hit=CATS[k]||CATS[CAT_ALIASES[k]]||CATS[CAT_ALIASES[k.replace(/-/g,"")]];
    if(hit)return {...hit,source:"declared"};
    return {label:declared,color:spareColor(k),source:"declared"};
  }
  for(const[re,key]of CAT_RULES)
    if(re.test(ex.name||""))return {...CATS[key],source:"guessed"};
  return null;                                  /* no tag, neutral rail */
}

/* ---------- program loading ----------
   Two programme schemas are live at once, on purpose:
     tp-program-1  Week 1 only; later weeks described in prose in `progression`.
     tp-program-2  every week authored as its own rows.
   A phone can be mid-block on a v1 programme in localStorage, so v1 must keep
   working indefinitely — this is the one place the difference is decided, and
   everything else asks dayExercises(). See docs/data-contracts.md. */
function isV2(){return !!(PROGRAM&&PROGRAM.meta&&PROGRAM.meta.schema==="tp-program-2");}
/* The exercises on screen right now. v2 filters by day AND week; v1 by day only,
   because under v1 every row is week 1 and filtering on week would empty the list. */
function dayExercises(){
  if(!PROGRAM||!Array.isArray(PROGRAM.exercises))return [];
  return PROGRAM.exercises.filter(e=>
    e.day===STATE.day && (!isV2() || Number(e.week)===Number(STATE.week)));
}
/* A v2 row whose `week` isn't a number matches no week at all, so the exercise would
   vanish from the whole block and the athlete would simply never do it. The generator
   rejects that input, but a hand-edited programme can still arrive — count them so the
   UI can say so out loud rather than quietly dropping work. */
function orphanExercises(){
  if(!isV2())return [];
  return PROGRAM.exercises.filter(e=>e.day===STATE.day&&!Number.isFinite(Number(e.week)));
}
/* meta.athleteId names the athlete/<slug>/logs/ folder an export belongs in. v1
   programmes predate it; derive the same slug from the display name so a log file
   is still filed correctly. A label, never a selector — the app has no profiles. */
function athleteId(){
  if(!PROGRAM||!PROGRAM.meta)return "";
  return PROGRAM.meta.athleteId||slug(PROGRAM.meta.athlete)||"";
}
/* Revision of the loaded programme. A week gets revised mid-block after a review, and
   re-importing is a manual step with no prompt — so this is shown next to the block name
   and stamped on every export, to answer "is the phone on the current version?" without
   diffing prescriptions. 0 means the programme predates versioning; the UI stays silent
   rather than claiming "v1", which would be a guess. */
function progVersion(){
  const v=PROGRAM&&PROGRAM.meta?Number(PROGRAM.meta.version):NaN;
  return Number.isFinite(v)&&v>0?Math.floor(v):0;
}
/* Prescribed set count, when the generator gave a plain number or a plain range —
   the set-at-a-time editor materialises this many chips before the athlete has logged
   anything. "3-4" or "AMRAP" are legitimate prose values, so anything else just means
   "start with one set": a range takes its lower bound (the extra set is one tap of
   "Log another set"); prose collapses to a single Set 1 of 1. */
function prescribedSets(ex){
  const s=String(ex.sets??"").trim();
  const plain=/^(\d+)$/.exec(s);
  if(plain)return Math.min(Math.max(parseInt(plain[1],10),1),12);
  const range=/^(\d+)\s*[-–—]\s*(\d+)$/.exec(s);
  if(range)return Math.min(Math.max(parseInt(range[1],10),1),12);
  return 1;
}
/* How many set chips the athlete actually wants shown right now. Starts at the
   prescription but is adjustable downward — tapping away an upcoming (never-logged) chip
   in the set editor sets `e.setTarget`, so skipping a set the plan called for doesn't
   leave a dead, always-outstanding slot sitting on the card forever. It never overrides
   what's already been committed — buildSetEditor() takes the max of this and rows.length. */
function targetSets(ex,e){
  return (typeof e.setTarget==="number"&&e.setTarget>=1)?e.setTarget:prescribedSets(ex);
}

/* ---------- where the athlete is in the block ----------
   Week and day are a position, not a preference: week 5 is a fact about the block, and a
   refresh — or the service worker activating a new build mid-session — must not drop it
   back to Week 1 Day 1 and silently show the wrong prescriptions. Date is deliberately
   NOT restored: it keys the stored session, so reopening the app the next morning must
   start a new day rather than reopen yesterday's file. */
function firstDay(){return (PROGRAM&&PROGRAM.meta&&PROGRAM.meta.days&&PROGRAM.meta.days[0])||null;}
function savePos(){
  try{localStorage.setItem(LS.pos,JSON.stringify({week:STATE.week,day:STATE.day}));}catch(e){}
}
function restorePos(){
  STATE.day=firstDay();
  let p=null;
  try{p=JSON.parse(localStorage.getItem(LS.pos)||"null");}catch(e){}
  if(!p||typeof p!=="object")return;
  /* Clamp against the programme actually loaded, not against what was saved. A saved week
     can point past the end of a shorter block imported since, and a saved day can name a
     day this programme doesn't have — either would render an empty screen. */
  const w=Number(p.week), weeks=Number(PROGRAM.meta.weeks)||1;
  if(Number.isFinite(w)&&w>=1&&w<=weeks)STATE.week=Math.floor(w);
  const days=Array.isArray(PROGRAM.meta.days)?PROGRAM.meta.days:[];
  if(days.indexOf(p.day)>=0)STATE.day=p.day;
}

function loadProgram(obj){
  if(!obj||!obj.meta||!Array.isArray(obj.exercises))throw new Error("Not a valid program.json (need meta + exercises).");
  PROGRAM=obj; localStorage.setItem(LS.prog,JSON.stringify(obj));
  /* A fresh import starts at the top of the block — and that reset has to be persisted,
     or the next refresh would restore the position from the programme just replaced. */
  STATE.week=1; STATE.day=(obj.meta.days&&obj.meta.days[0])||null; STATE.date=todayISO();
  savePos();
  resetFocus();
  renderAll();
}
async function boot(){
  loadSettings();
  applyTheme();          /* head script already painted it; this keeps meta + state in sync */
  const saved=localStorage.getItem(LS.prog);
  if(saved){try{PROGRAM=JSON.parse(saved);}catch(e){}}
  if(!PROGRAM){try{const r=await fetch("./program.json",{cache:"no-store"});if(r.ok)PROGRAM=await r.json();}catch(e){}}
  if(PROGRAM){restorePos();resetFocus();}
  renderAll();
}

/* ---------- session persistence ---------- */
/* `amPainOnWaking` replaced `amPainNextDay` at tp-session-3. The old field asked for
   tomorrow's response to today's session, which meant re-opening a closed session the
   next morning — so in practice it arrived empty, and an empty tendon reading looks
   exactly like a good one. This is the same measurement taken at check-in, when the app
   is already open. It is the response to the PREVIOUS session; see docs/data-contracts.md. */
const BLANK_SESSION={bodyweightKg:"",sleep:"",readiness:"",hrvNote:"",amPainOnWaking:"",overall:""};

/* An exercise entry. `sets[]` holds only *committed* rows — a set the athlete actually
   confirmed with "Log set N". `draft` is the set currently being typed, seeded from the
   set before it; it is never in `sets[]` and never reaches an export (see exportEntry).
   `summaryAuto` says whether load/reps/rpe/painDuring are still following the sets —
   editing any of them directly in "Summary & notes" turns following off for good,
   exactly like a per-set row that stops following once it's been typed into. `setTarget`
   is the athlete's own adjusted set count (see targetSets()) — null until they remove an
   upcoming chip, so it doesn't have to be reset when a programme is re-imported. */
function blankDraft(){return {load:"",reps:"",rpe:"",painDuring:"",note:""};}
function seedDraft(row){return {load:txt(row.load),reps:txt(row.reps),rpe:txt(row.rpe),
  painDuring:txt(row.painDuring),note:""};}
function draftEmpty(d){return !(txt(d.load)||txt(d.reps)||txt(d.rpe)||txt(d.painDuring)||txt(d.note));}
function blankEntry(){return {done:false,load:"",reps:"",rpe:"",painDuring:"",notes:"",
  sets:[],draft:blankDraft(),summaryAuto:true,setTarget:null};}
function renumber(e){(e.sets||[]).forEach((r,i)=>{r.set=i+1;});return e.sets;}

/* ---------- deriving the flat summary from sets[] ----------
   Every one of these must be safe on an empty or partial set list: never fabricate an
   RPE of 0 from nothing logged, never emit "NaN" from prose ("7-8"), never assert a
   reps count sets[] doesn't support. */
function pickMode(vals){
  if(!vals.length)return "";
  const freq=new Map();
  vals.forEach(v=>freq.set(v,(freq.get(v)||0)+1));
  let best=vals[0],bestCount=freq.get(vals[0]);
  freq.forEach((c,v)=>{
    if(c>bestCount){best=v;bestCount=c;}
    else if(c===bestCount){
      /* Tie: prefer the numerically heavier value (a dropped-load top set beats its
         back-off sets), falling back to the first-seen when neither parses. */
      const pv=parseNum(v),pb=parseNum(best);
      if(pv!=null&&(pb==null||pv>pb)){best=v;bestCount=c;}
    }
  });
  return best;
}
function pickMax(vals){
  if(!vals.length)return "";
  const nums=vals.map(v=>({v,n:parseNum(v)})).filter(x=>x.n!=null);
  if(nums.length){let b=nums[0];nums.forEach(x=>{if(x.n>b.n)b=x;});return b.v;}
  return vals[vals.length-1];               /* nothing parsed ("7-8") — last raw string */
}
function deriveReps(rows){
  const vals=rows.map(r=>txt(r.reps));
  if(!vals.some(Boolean))return "";
  const allFilled=vals.every(Boolean);
  if(allFilled&&new Set(vals).size===1)return vals.length===1?vals[0]:`${vals.length}x${vals[0]}`;
  if(allFilled)return vals.join("/");
  return vals.map(v=>v||"-").join("/");      /* a hole is shown, never silently dropped */
}
function deriveSummary(rows){
  return {
    load: pickMode(rows.map(r=>txt(r.load)).filter(Boolean)),
    reps: deriveReps(rows),
    rpe: pickMax(rows.map(r=>txt(r.rpe)).filter(Boolean)),
    painDuring: pickMax(rows.map(r=>txt(r.painDuring)).filter(Boolean))
  };
}
function applyDerivedSummary(e){
  if(e.summaryAuto===false)return;
  const d=deriveSummary(e.sets);
  e.load=d.load;e.reps=d.reps;e.rpe=d.rpe;e.painDuring=d.painDuring;
}

/* ---------- migrating a stored entry ----------
   Runs inside getSession(), so every reader — renderMain, updateProgress, export — sees
   the current shape regardless of which build wrote the file on disk. Idempotent: run it
   twice and the second pass changes nothing, which matters because it runs on every read. */
function normalizeEntry(e){
  let changed=false;
  if(!Array.isArray(e.sets)){e.sets=[];changed=true;}
  /* The old "Log each set" table seeded rows the athlete hadn't actually typed into yet
     and flagged them `auto`. The set-at-a-time editor never writes that flag, so any row
     that still carries it predates this build and was never confirmed — drop it, or a
     7-set exercise where only set 1 was ever typed exports as 7 sets performed. */
  if(e.sets.some(r=>r&&"auto" in r)){
    /* Rebuild the survivors too, not just drop the auto:true rows — a row that carried
       the key at all predates this build, and leaving `auto:false` sitting on it is
       stale bookkeeping the new model never reads or writes. */
    e.sets=e.sets.filter(r=>!(r&&r.auto)).map(r=>({set:r.set,
      load:txt(r.load),reps:txt(r.reps),rpe:txt(r.rpe),painDuring:txt(r.painDuring),note:txt(r.note)}));
    renumber(e);
    changed=true;
  }
  /* Per-set logging used to be opt-in, so most existing logs are flat-only. Promote that
     into one committed set rather than let derivation below silently blank it out — but
     not for a box ticked with nothing logged at all (a warm-up needs no invented set). */
  if(!e.sets.length&&(txt(e.load)||txt(e.reps)||txt(e.rpe)||txt(e.painDuring))){
    e.sets=[{set:1,load:txt(e.load),reps:txt(e.reps),rpe:txt(e.rpe),painDuring:txt(e.painDuring),note:""}];
    changed=true;
  }
  if(!e.draft||typeof e.draft!=="object"){
    e.draft=e.sets.length?seedDraft(e.sets[e.sets.length-1]):blankDraft();
    changed=true;
  }
  if(typeof e.summaryAuto!=="boolean"){e.summaryAuto=true;changed=true;}
  if(changed)applyDerivedSummary(e);
  return changed;
}

function sessionKey(){return LS.sess(STATE.date,STATE.day);}
function getSession(){
  const raw=localStorage.getItem(sessionKey());
  let s=null;
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      if(parsed&&typeof parsed==="object"){
        parsed.session={...BLANK_SESSION,...(parsed.session||{})};
        if(!parsed.entries||typeof parsed.entries!=="object")parsed.entries={};
        s=parsed;
      }
    }catch(e){}
  }
  if(!s)s={block:PROGRAM?PROGRAM.meta.block:"",athlete:PROGRAM?PROGRAM.meta.athlete:"",
    week:STATE.week,day:STATE.day,date:STATE.date,
    session:{...BLANK_SESSION},entries:{}};
  let changed=false;
  Object.keys(s.entries).forEach(id=>{
    const e={...blankEntry(),...s.entries[id]};
    if(normalizeEntry(e))changed=true;
    s.entries[id]=e;
  });
  if(changed){try{localStorage.setItem(sessionKey(),JSON.stringify(s));}catch(e){}}
  return s;
}
function saveSession(s){
  s.week=STATE.week;s.day=STATE.day;s.date=STATE.date;
  /* localStorage can throw (quota, private mode) — never let a keystroke's autosave
     take the rest of the app down with it. */
  try{localStorage.setItem(sessionKey(),JSON.stringify(s));}catch(e){}
  updateProgress(s);
}

/* ---------- set mutation ---------- */
function commitSet(e){
  if(draftEmpty(e.draft))return false;
  const row={set:e.sets.length+1,load:txt(e.draft.load),reps:txt(e.draft.reps),
    rpe:txt(e.draft.rpe),painDuring:txt(e.draft.painDuring),note:txt(e.draft.note)};
  e.sets.push(row);
  e.draft=seedDraft(row);
  applyDerivedSummary(e);
  return true;
}
function deleteSet(e,idx){
  e.sets.splice(idx,1);renumber(e);
  applyDerivedSummary(e);
}

/* ---------- rendering ---------- */
function renderAll(){renderHeader();renderDrawer();renderMain();}

/* The header carries only what has to be true while training: which session this is,
   how far through it you are, and which date it is being logged onto. Everything else
   moved into the drawer. */
function renderHeader(){
  const name=$("#blockName"),sub=$("#blockSub");
  if(!PROGRAM){
    name.textContent="Training Tracker";
    sub.textContent="No program loaded — tap Import";
    $("#ctxLine").textContent="Training Tracker";
    $("#ctxLine").classList.remove("off");
    $("#ctxSub").textContent="Import a program to begin";
    return;
  }
  name.textContent=PROGRAM.meta.block||"Training block";
  const rev=progVersion();
  sub.textContent=`${PROGRAM.meta.athlete||""} · ${PROGRAM.meta.weeks||"?"}-week block`
    +(rev?` · v${rev}`:"");
  const today=STATE.date===todayISO();
  const ctx=$("#ctxLine");
  ctx.textContent=STATE.day
    ?`Week ${STATE.week} · ${dayParts(STATE.day).short} ${fmtDateShort(STATE.date)}`+(today?"":" · not today")
    :`Week ${STATE.week}`;
  ctx.classList.toggle("off",!today);
  $("#ctxSub").textContent=STATE.day?dayTheme(STATE.day):"No training days in this program";
}
/* "Day 1 (Mon) - Clean Skill + Front Squat" -> {num:"D1", short:"Mon"} */
function dayParts(d){
  const m=/\(([A-Za-z]{3,9})\)/.exec(d||""), n=/Day\s*(\d+)/i.exec(d||"");
  return {num:n?"D"+n[1]:"", short:m?m[1]:((d||"").split(/[\s(-]/)[0]||"Day")};
}
/* …and the part after the dash, which names what the session actually is. Falls back to
   the whole label rather than to nothing — a generator need not use the dash. */
function dayTheme(d){
  const s=(d||"").trim();
  const m=/\s[-–—]\s(.+)$/.exec(s);
  return m?m[1].trim():s;
}
/* A date that isn't today is legitimate — it is how a session gets completed after the
   fact — but it is silent, and logging onto the wrong day can't be undone. Say it. */
function fmtDate(iso){
  try{
    const d=new Date(iso+"T00:00:00");
    if(isNaN(d.getTime()))return iso;
    return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  }catch(e){return iso;}
}
/* Same, without the weekday — the header already states that via the day name. */
function fmtDateShort(iso){
  try{
    const d=new Date(iso+"T00:00:00");
    if(isNaN(d.getTime()))return iso;
    return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
  }catch(e){return iso;}
}

/* ---------- view mode ----------
   "list"  — Overview: every exercise for the day, read-only, tap one to open it.
   "focus" — Log: one exercise, with prev/next and one pip per exercise in the header.
   Internal values kept as "list"/"focus" from the previous layout; only the on-screen
   wording changed to Overview/Log. */
function viewMode(){return SETTINGS.view==="focus"?"focus":"list";}
function setView(v){
  const next=v==="focus"?"focus":"list";
  if(next===viewMode())return;
  SETTINGS.view=next;saveSettings();renderMain();scrollTop();
}
function syncView(){
  const focus=viewMode()==="focus";
  $("#viewOverview").setAttribute("aria-pressed",String(!focus));
  $("#viewLog").setAttribute("aria-pressed",String(focus));
  $("#fExport").hidden=focus;
  $("#fNav").hidden=!focus;
  $("#pbar").hidden=focus;
  $("#pips").hidden=!focus;
}
function scrollTop(){if(window.scrollTo)window.scrollTo(0,0);}
/* Where to land when the session changes: the first thing not yet ticked off. */
function firstUndone(){
  const exs=dayExercises();
  if(!exs.length)return 0;
  const s=getSession();
  const i=exs.findIndex(e=>!(s.entries[e.id]&&s.entries[e.id].done));
  return i<0?exs.length-1:i;
}
function resetFocus(){STATE.focus=firstUndone();STATE.setEdit=null;}
function clampFocus(){
  const n=dayExercises().length,i=Math.floor(Number(STATE.focus));
  STATE.focus=n?Math.max(0,Math.min(Number.isFinite(i)?i:0,n-1)):0;
}
function goFocus(i){
  const n=dayExercises().length;if(!n)return;
  const next=Math.max(0,Math.min(i,n-1));
  STATE.setEdit=null;
  if(next===STATE.focus)return;
  STATE.focus=next;renderMain();scrollTop();
}
function stepFocus(d){goFocus(STATE.focus+d);}

function renderMain(){
  const m=$("#main");m.innerHTML="";
  if(!PROGRAM){
    const b=el("div",{className:"banner"},
      "No program.json loaded. Import the program.json from your Drive folder to begin.");
    const imp=el("button",{className:"primary"},"Import program…");
    imp.onclick=()=>$("#fileInp").click();
    b.append(el("div",{},imp));
    m.append(b);renderNav();updateProgress();return;
  }
  const s=getSession();
  const exs=dayExercises();
  /* v1 only: the rows on screen are the Week-1 template, so past week 1 the athlete
     has to apply the progression rule themselves. v2 authors every week, so the
     prescription shown IS this week's and the banner would be a lie. */
  if(!isV2()){
    const authoredWeeks=PROGRAM.exercises.map(e=>Number(e.week)||1);
    if(authoredWeeks.length&&STATE.week>Math.max(...authoredWeeks))
      m.append(el("div",{className:"banner"},`Week ${STATE.week}: prescriptions below are the Week-1 template — apply each exercise's Progression Rule for this week.`));
  }
  if(!exs.length)m.append(el("div",{className:"banner"},isV2()
    ?`No exercises for week ${STATE.week} of this day in the program.`
    :"No exercises for this day in the program."));
  const orphans=orphanExercises();
  if(orphans.length)m.append(el("div",{className:"banner"},
    `${orphans.length} exercise${orphans.length>1?"s":""} on this day (${orphans.map(o=>o.name).join("; ")}) have no valid week and are not shown in any week. Re-generate program.json.`));
  clampFocus();
  if(viewMode()==="focus"){
    if(exs.length)m.append(logCard(exs[STATE.focus],s,STATE.focus));
  }else{
    exs.forEach((ex,i)=>m.append(overviewCard(ex,s,i)));
  }
  renderNav();
  updateProgress(s);
}

/* The pip strip is rebuilt only when the set of exercises on screen changes; paintNav()
   keeps done-state and position current on every keystroke without rebuilding it. */
let PIPS=[];
let NAV_AT=-1;                    /* last STATE.focus the pip strip was scrolled to */
function renderNav(){
  syncView();
  const host=$("#pips");host.innerHTML="";PIPS=[];
  NAV_AT=-1;
  if(viewMode()!=="focus"||!PROGRAM)return;
  dayExercises().forEach((ex,i)=>{
    const b=el("button",{className:"pip",attrs:{title:ex.name,
      "aria-label":`Exercise ${i+1}: ${ex.name}`}},String(i+1));
    b.onclick=()=>goFocus(i);
    PIPS.push(b);host.append(b);
  });
}
function paintNav(sess){
  const exs=PROGRAM&&STATE.day?dayExercises():[];
  const s=exs.length?(sess||getSession()):null;
  PIPS.forEach((b,i)=>{
    const ex=exs[i],e=ex&&s?s.entries[ex.id]:null;
    b.setAttribute("data-done",e&&e.done?"1":"0");
    b.setAttribute("aria-current",String(i===STATE.focus));
  });
  $("#navCount").textContent=exs.length
    ?`${Math.min(STATE.focus+1,exs.length)} / ${exs.length}`:"—";
  $("#prevBtn").disabled=STATE.focus<=0;
  $("#nextBtn").disabled=STATE.focus>=exs.length-1;
  /* Runs on every keystroke via saveSession() → updateProgress(). Scrolling the pip
     strip into view on every character (and while a soft keyboard is up) is what made
     the screen jump while typing — only actually do it when the position changes, and
     never while an input is focused. */
  if(STATE.focus!==NAV_AT){
    NAV_AT=STATE.focus;
    const active=document.activeElement,tag=active&&active.tagName;
    const typing=tag==="INPUT"||tag==="TEXTAREA";
    const cur=PIPS[STATE.focus];
    if(!typing&&cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"nearest"});
  }
}

/* Called on every autosave (saveSession → here), so it repaints state and never rebuilds
   structure. Accepts the session object already in hand so it never has to re-fetch and
   re-parse localStorage on every keystroke — see saveSession() and renderMain(). */
function updateProgress(sess){
  const fill=$("#pbar > i"),cnt=$("#progCount");
  if(!PROGRAM||!STATE.day){
    if(cnt)cnt.textContent="—";
    if(fill)fill.style.width="0";
    $("#menuBtn").classList.remove("alert");
    paintNav();return;
  }
  const s=sess||getSession();
  const exs=dayExercises();
  const done=exs.filter(e=>s.entries[e.id]&&s.entries[e.id].done).length;
  fill.style.width=(exs.length?Math.round(done/exs.length*100):0)+"%";
  cnt.textContent=`${done}/${exs.length} done`;
  /* The only nag in the app: a dot on the ≡ until the check-in has something in it.
     It lives here because this runs on every save, so it clears as soon as it's wrong. */
  $("#menuBtn").classList.toggle("alert",!checkinFilled(s));
  const stat=$("#checkinStat");
  if(stat)stat.textContent=checkinSummary(s);
  paintNav(s);
}

function field(labelText,node,unit){
  const fld=el("div",{className:"fld"+(unit?" has-unit":"")},[node]);
  if(unit)fld.append(el("span",{className:"unit"},unit));
  return el("div",{},[el("label",{className:"lbl"},labelText),fld]);
}

function sessionCard(s){
  const c=el("div",{className:"card sessioncard"});
  c.append(el("span",{className:"rail"}));
  c.dataset.readiness=SETTINGS.readiness?(s.session.readiness||""):"";
  /* No title: the accordion this sits in is already called "Session check-in", and the
     rail keeps carrying the readiness colour. */
  c.append(el("div",{className:"rx"},"Fill this before you start — it's how today began, not how it went."));
  const wrap=el("div",{className:"log"});
  const mk=(k,label,type="text",attrs={},unit)=>{
    const inp=el("input",{type,value:s.session[k]??"",attrs});
    inp.oninput=()=>{s.session[k]=inp.value;saveSession(s);};
    return field(label,inp,unit);
  };
  /* First in the grid on purpose: for a tendon block this is the highest-value number in
     the file, it is only true before training, and it used to be the one that got missed. */
  if(SETTINGS.painOnWaking)
    wrap.append(mk("amPainOnWaking",painLbl(" on waking"),"number",{min:0,max:10},"/10"));
  if(SETTINGS.readiness){
    const rd=el("select",{},["","Green","Amber","Red"].map(o=>
      el("option",{value:o,textContent:o||"Readiness…",selected:s.session.readiness===o})));
    rd.onchange=()=>{s.session.readiness=rd.value;saveSession(s);
      c.dataset.readiness=rd.value;};
    wrap.append(field("Readiness",rd));
  }
  if(SETTINGS.sleep)wrap.append(mk("sleep","Sleep","number",{min:1,max:5},"/5"));
  if(SETTINGS.bodyweight)wrap.append(mk("bodyweightKg","Bodyweight","number",{},"kg"));
  if(SETTINGS.hrvNote){
    const hrv=el("input",{type:"text",value:s.session.hrvNote||"",
      attrs:{placeholder:"e.g. HRV 62, at baseline"}});
    hrv.oninput=()=>{s.session.hrvNote=hrv.value;saveSession(s);};
    const f=field("HRV / notes",hrv);f.className="full";wrap.append(f);
  }
  if(wrap.children.length)c.append(wrap);
  const ov=el("textarea",{value:s.session.overall||"",attrs:{placeholder:"Overall session notes…"}});
  ov.oninput=()=>{s.session.overall=ov.value;saveSession(s);};
  c.append(el("div",{style:"margin-top:12px"},[el("label",{className:"lbl"},"Overall notes"),ov]));
  return c;
}

/* ---------- exercise head (shared by Overview and Log) ----------
   The one place both surfaces draw from, so they cannot drift: category rail colour
   (set by the caller), name, and the prescription folded into one or two plain lines —
   no separate hero number, no pill-chip row. Everything past this point is where the
   two views genuinely differ (read-only status line vs. the set editor), which is why
   they are two bodies rather than one branchy card builder. */
function rxLine(ex){
  const bits=[`${ex.sets||"?"} × ${ex.reps||"?"}`];
  if(ex.load)bits.push(ex.load);
  /* No "RPE " prefix here — the generator's own prescribed value already carries it
     ("RPE 5-6") or is prose that doesn't want one ("Pain <=3/10; effort 6-7/10"). */
  if(ex.rpe)bits.push(ex.rpe);
  return bits.join(" · ");
}
function metaLine(ex){
  const bits=[];
  if(ex.tempo&&ex.tempo!=="-")bits.push("Tempo "+ex.tempo);
  if(ex.rest&&ex.rest!=="-")bits.push("Rest "+ex.rest);
  return bits.join(" · ");
}
function exerciseHead(ex){
  const nodes=[el("div",{className:"ex-name"},ex.name),
               el("div",{className:"rx"},rxLine(ex))];
  const meta=metaLine(ex);
  if(meta)nodes.push(el("div",{className:"rx meta"},meta));
  return nodes;
}

function collapse(title,body){
  const d=el("details");d.append(el("summary",{},title));d.append(el("div",{className:"body"},body));return d;
}

const txtCol=(rows,k)=>rows.map(x=>txt(x[k])).filter(Boolean);
/* The one-line summary used on a done Overview card and in "Summary & notes". Prefers
   the set shape when the sets actually disagree — "100 → 80 → 80" says set 1 was wrong —
   over the flat fields, which are the headline once they agree or nothing was logged. */
function summaryText(e){
  const b=[];
  const sets=Array.isArray(e.sets)?e.sets:[];
  const loads=txtCol(sets,"load");
  if(loads.length>1&&new Set(loads).size>1)b.push(loads.join(" → "));
  else if(txt(e.load))b.push(txt(e.load));
  else if(loads.length)b.push(loads[0]+(loads.length>1?` ×${loads.length}`:""));

  if(txt(e.reps))b.push(txt(e.reps));
  else if(txtCol(sets,"reps").length)b.push(txtCol(sets,"reps").join("/"));

  const rpe=txt(e.rpe)||txtCol(sets,"rpe").slice(-1)[0];
  if(rpe)b.push("RPE "+rpe);

  if(SETTINGS.painPerExercise){
    const pain=txt(e.painDuring)||txtCol(sets,"painDuring").sort().slice(-1)[0];
    if(pain)b.push(painLbl().toLowerCase()+" "+pain+"/10");
  }
  return b.length?b.join(" · "):"nothing logged";
}

/* ---------- Overview card (read-only) ----------
   Zero inputs — the whole point of splitting this out of the old all-in-one card. Tap
   anywhere on it to open the exercise in Log view. */
function overviewCard(ex,s,idx){
  const e=s.entries[ex.id]||(s.entries[ex.id]=blankEntry());
  normalizeEntry(e);
  const cat=catOf(ex);
  const c=el("div",{className:"card ov"+(e.done?" done":""),
    attrs:{role:"button",tabindex:"0","aria-label":"Open "+ex.name+" in Log view"}});
  if(cat)c.style.setProperty("--cat",cat.color);
  c.append(el("span",{className:"rail"}));
  const body=el("div",{className:"grow"});
  body.append(...exerciseHead(ex));
  const n=e.sets.length;
  let status=null;
  if(e.done)status=el("div",{className:"ov-status done"},"✓ "+summaryText(e));
  else if(n>0)status=el("div",{className:"ov-status"},`${n} of ${prescribedSets(ex)} sets logged`);
  if(status)body.append(status);
  c.append(body);
  const open=()=>{STATE.setEdit=null;STATE.focus=idx;setView("focus");};
  c.onclick=open;
  c.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();open();}};
  return c;
}

/* ---------- the set editor (Log view) ----------
   Always exactly one set's fields on screen: the draft (the next new set) or, while
   STATE.setEdit names a committed row, that row instead. Every oninput here writes
   straight into the row/draft and autosaves — nothing here may rebuild a container an
   input lives in; only a button tap (commit / save / cancel / delete / finish) may call
   `onchange`, which redraws and — since it follows a tap, not a keystroke — is free to
   refocus the new Load field so the keyboard never has to be reopened by hand. */
function buildSetEditor(host,ex,e,s,idx,onchange,autofocus){
  const rows=e.sets;
  const target=targetSets(ex,e);
  const editIdx=(STATE.setEdit!=null&&STATE.setEdit>=0&&STATE.setEdit<rows.length)?STATE.setEdit:null;
  const draftMode=editIdx===null;
  const curPos=draftMode?rows.length:editIdx;
  const curNum=curPos+1;
  const total=Math.max(target,curNum,rows.length+(draftMode?1:0));

  const chips=el("div",{className:"setchips"});
  for(let i=0;i<total;i++){
    const state=i<rows.length?(i===editIdx?"current":"done"):(i===curPos?"current":"todo");
    const chip=el("button",{className:"setchip",attrs:{"data-state":state,
      "aria-label":state==="todo"?`Remove set ${i+1} — not planning to do it`:"Set "+(i+1)}},String(i+1));
    if(i<rows.length){
      /* A logged set: tap to edit it (Save/Cancel/Delete live in the field group below). */
      chip.onclick=()=>{STATE.setEdit=(i===editIdx)?null:i;onchange();};
    }else if(state==="todo"){
      /* An upcoming, never-logged slot: nothing to lose by tapping it away, so it needs
         no confirmation — this is what "skip a set" means when the set was never done. */
      chip.onclick=()=>{
        e.setTarget=Math.max(curPos+1,total-1);
        saveSession(s);onchange();
      };
    }else{
      chip.disabled=true;                     /* the current draft slot — already here */
    }
    chips.append(chip);
  }
  host.append(chips);
  host.append(el("div",{className:"setlabel"},`Set ${curNum} of ${total}`));

  const data=draftMode?e.draft:rows[editIdx];
  const grid=el("div",{className:"setgrid"+(SETTINGS.painPerExercise?"":" nopain")});
  const commonAttrs={autocapitalize:"off",autocorrect:"off",spellcheck:"false"};
  const onFieldInput=()=>{
    if(!draftMode)applyDerivedSummary(e);
    saveSession(s);
  };
  const loadInp=el("input",{type:"text",value:data.load??"",
    attrs:{placeholder:"kg",inputmode:"decimal","aria-label":"Load",...commonAttrs}});
  loadInp.oninput=()=>{data.load=loadInp.value;onFieldInput();};
  grid.append(field("Load",loadInp));
  const repsInp=el("input",{type:"text",value:data.reps??"",
    attrs:{placeholder:"reps",inputmode:"numeric","aria-label":"Reps"}});
  repsInp.oninput=()=>{data.reps=repsInp.value;onFieldInput();};
  grid.append(field("Reps",repsInp));
  /* text + inputmode, not type=number: a number input reports "" while the value is an
     incomplete float like "7.", so the autosaved RPE would flicker to blank mid-type.
     This is also what lets RPE hold a half point ("7.5") — see CLAUDE.md. */
  const rpeInp=el("input",{type:"text",value:data.rpe??"",
    attrs:{placeholder:"RPE",inputmode:"decimal","aria-label":"RPE",...commonAttrs}});
  rpeInp.oninput=()=>{data.rpe=rpeInp.value;onFieldInput();};
  grid.append(field("RPE",rpeInp));
  if(SETTINGS.painPerExercise){
    const painInp=el("input",{type:"number",value:data.painDuring??"",
      attrs:{min:0,max:10,placeholder:"0","aria-label":painLbl()}});
    painInp.oninput=()=>{data.painDuring=painInp.value;onFieldInput();};
    grid.append(field(painLbl(),painInp,"/10"));
  }
  host.append(grid);

  const note=el("input",{type:"text",value:data.note||"",
    attrs:{placeholder:`Set ${curNum} note…`,"aria-label":`Set ${curNum} note`}});
  note.oninput=()=>{data.note=note.value;saveSession(s);};
  host.append(el("div",{className:"setnoteinp"},note));

  const actions=el("div",{className:"setactions"});
  if(!draftMode){
    const save=el("button",{className:"primary"},`Save set ${curNum}`);
    save.onclick=()=>{STATE.setEdit=null;saveSession(s);onchange();};
    const cancel=el("button",{className:"ghost"},"Cancel");
    cancel.onclick=()=>{STATE.setEdit=null;onchange();};
    const del=el("button",{className:"ghost danger"},"Delete set");
    let armed=false;
    del.onclick=()=>{
      if(!armed){armed=true;del.textContent="Tap again to delete";del.classList.add("armed");
        setTimeout(()=>{armed=false;},4000);return;}
      deleteSet(e,editIdx);STATE.setEdit=null;saveSession(s);onchange();
    };
    actions.append(save,cancel,del);
  }else{
    const commit=el("button",{className:"primary"},
      rows.length<target?`Log set ${curNum}`:"Log another set");
    commit.onclick=()=>{if(commitSet(e)){saveSession(s);onchange();}};
    actions.append(commit);
    /* Always offered, even with zero sets logged — a warm-up needs no invented set, and
       cutting a lift short for pain is exactly the signal the coach wants, not something
       the UI should withhold until a count is met. */
    const finish=el("button",{className:"ghost"},
      rows.length>=target?"Finish exercise ›":`Finish exercise (${rows.length} logged)`);
    finish.onclick=()=>{
      e.done=true;saveSession(s);
      if(viewMode()==="focus"&&idx===STATE.focus&&idx<dayExercises().length-1){
        STATE.focus=idx+1;STATE.setEdit=null;renderMain();scrollTop();toast("Logged: "+ex.name);
      }else{onchange();}
    };
    actions.append(finish);
  }
  if(e.done){
    const undo=el("button",{className:"ghost"},"Un-finish");
    undo.onclick=()=>{e.done=false;saveSession(s);onchange();};
    actions.append(undo);
  }
  host.append(actions);

  if(autofocus){
    const first=grid.querySelector("input");
    if(first&&first.focus)first.focus();
  }
}

/* ---------- Summary & notes (collapsed, inside Log view) ----------
   The flat load/reps/RPE/pain fields, auto-filled from the sets and editable — editing
   one here is a deliberate override and stops it following future sets (summaryAuto).
   Kept collapsed: the athlete never has to open it, but it is theirs to correct. */
function buildSummaryPanel(host,ex,e,s){
  host.innerHTML="";
  const wrap=el("div",{className:"log tight"+(SETTINGS.painPerExercise?"":" nopain")});
  const mk=(k,label,type,attrs,unit)=>{
    const inp=el("input",{type,value:e[k]??"",attrs});
    inp.oninput=()=>{e[k]=inp.value;e.summaryAuto=false;saveSession(s);};
    return {inp,node:field(label,inp,unit)};
  };
  const load=mk("load","Load","text",{placeholder:"90"},"kg");
  const reps=mk("reps","Sets × reps","text",{placeholder:"4×6"});
  const rpe=mk("rpe","RPE","text",{placeholder:"7"});
  wrap.append(load.node,reps.node,rpe.node);
  let pain=null;
  if(SETTINGS.painPerExercise){
    pain=mk("painDuring",painLbl(),"number",{min:0,max:10,placeholder:"0"},"/10");
    wrap.append(pain.node);
  }
  host.append(wrap);
  const nt=el("textarea",{value:e.notes||"",attrs:{placeholder:"Notes…"}});
  nt.oninput=()=>{e.notes=nt.value;saveSession(s);};
  host.append(el("div",{className:"full"},[el("label",{className:"lbl"},"Notes"),nt]));
  host._refresh=()=>{
    load.inp.value=e.load??"";reps.inp.value=e.reps??"";rpe.inp.value=e.rpe??"";
    if(pain)pain.inp.value=e.painDuring??"";
  };
}

/* ---------- Log card ----------
   One exercise, worked one set at a time. The set editor rebuilds itself on a commit /
   edit / delete / finish tap (never on a keystroke); the summary panel is repainted in
   place afterwards rather than rebuilt, so an open "Summary & notes" section doesn't
   collapse out from under the athlete's thumb the moment a set is logged. */
function logCard(ex,s,idx){
  const e=s.entries[ex.id]||(s.entries[ex.id]=blankEntry());
  normalizeEntry(e);
  const cat=catOf(ex);
  const c=el("div",{className:"card"+(e.done?" done":"")});
  if(cat)c.style.setProperty("--cat",cat.color);
  c.append(el("span",{className:"rail"}));
  c.append(...exerciseHead(ex));
  if(ex.focus)c.append(collapse("Coach notes",ex.focus));
  if(ex.progression)c.append(collapse("Progression rule",ex.progression));
  if(ex.logHint)c.append(el("div",{className:"hint"},"Log: "+ex.logHint));

  const summaryHost=el("div");
  const refreshSummary=()=>{if(summaryHost._refresh)summaryHost._refresh();};

  const editorHost=el("div",{className:"setblock"});
  const redraw=(autofocus)=>{
    editorHost.innerHTML="";
    buildSetEditor(editorHost,ex,e,s,idx,()=>{redraw(true);refreshSummary();},!!autofocus);
  };
  redraw(false);
  c.append(editorHost);

  buildSummaryPanel(summaryHost,ex,e,s);
  c.append(collapse("Summary & notes",summaryHost));
  return c;
}

/* ---------- export ---------- */
/* Per-set rows are exported with a fixed key set and no holes, so the coach never has
   to probe for a missing field. A wholly empty row (nothing typed, nothing committed)
   is dropped as a safety net — commitSet() already refuses to create one. */
function exportSets(e){
  return (Array.isArray(e.sets)?e.sets:[])
    .map(r=>({load:txt(r.load),reps:txt(r.reps),rpe:txt(r.rpe),
              painDuring:txt(r.painDuring),note:txt(r.note)}))
    .filter(r=>r.load||r.reps||r.rpe||r.painDuring||r.note)
    .map((r,i)=>({set:i+1,...r}));
}
/* A named whitelist, not a rest-spread over the entry: `draft`, `summaryAuto` and
   `setTarget` are app-local bookkeeping that must never reach a log file, and naming
   every exported key here — rather than naming the ones to exclude — is what keeps that
   true as the entry shape grows. */
function exportEntry(e){
  return {done:!!e.done,load:txt(e.load),reps:txt(e.reps),rpe:txt(e.rpe),
          painDuring:txt(e.painDuring),notes:txt(e.notes)};
}
function buildSessionExport(){
  const s=getSession();
  const exs=dayExercises();
  /* `tracking` is additive metadata: it tells the coach whether an empty pain value means
     "no pain logged" or "this athlete doesn't track pain". Every other key keeps its shape
     so the review step never sees a missing field. See docs/data-contracts.md. */
  const tracking={painLabel:(SETTINGS.painLabel||"").trim()};
  FIELD_DEFS.forEach(f=>tracking[f.key]=!!SETTINGS[f.key]);
  /* Per-set logging is no longer a switch — it is how every exercise is logged now — but
     the key stays so a reader built against tp-session-3's contract still gets it. */
  tracking.perSetLogging=true;
  return {
    schema:"tp-session-3",
    block:PROGRAM.meta.block,athlete:PROGRAM.meta.athlete,athleteId:athleteId(),
    /* Which revision of the programme this was actually trained off. Without it the coach
       has to diff the denormalised `prescribed` values against the current program.json to
       spot an athlete who never re-imported. 0 means the programme predates versioning. */
    programVersion:progVersion(),
    week:STATE.week,day:STATE.day,date:STATE.date,
    exportedAt:new Date().toISOString(),
    tracking,
    /* Merged, like entries: a session stored before a check-in field existed must
       still export every key, or the coach has to probe for missing ones. */
    session:{...BLANK_SESSION,...(s.session||{})},
    entries:exs.map(ex=>{
      const e={...blankEntry(),...(s.entries[ex.id]||{})};
      return {exercise:ex.name,
        ...(ex.category?{category:ex.category}:{}),
        prescribed:{sets:ex.sets,reps:ex.reps,load:ex.load,rpe:ex.rpe},
        ...exportEntry(e),
        sets:exportSets(e)};
    })
  };
}
/* Both export paths are wrapped: a throw here would look like the button doing
   nothing, at the one moment the session has to leave the phone. Better to say so —
   the data is still in localStorage and Copy JSON is the fallback. */
function exportSession(){
  if(!PROGRAM){toast("Load a program first");return;}
  try{
    const data=buildSessionExport();
    const name=`session-${STATE.date}-${slug(STATE.day)||"day"}.json`;
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=el("a",{href:url,download:name});document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    const who=athleteId();
    toast("Exported "+name+" — save into athlete/"+(who||"<you>")+"/logs/");
  }catch(err){toast("Export failed: "+err.message+" — try Copy JSON");}
}
async function copyJSON(){
  if(!PROGRAM){toast("Load a program first");return;}
  let json;
  try{json=JSON.stringify(buildSessionExport(),null,2);}
  catch(err){toast("Copy failed: "+err.message);return;}
  try{await navigator.clipboard.writeText(json);toast("Session JSON copied");}
  catch(e){const ta=el("textarea",{value:json});document.body.append(ta);ta.select();
    document.execCommand("copy");ta.remove();toast("Session JSON copied");}
}

/* ---------- events ----------
   The week / date / day controls are built by renderDrawer() and wired there, because
   they only exist while the drawer has been rendered. Everything wired here is markup
   that is present for the whole life of the page. */
$("#exportBtn").onclick=exportSession;
$("#copyBtn").onclick=copyJSON;
$("#menuBtn").onclick=toggleDrawer;
$("#ctxBtn").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#drawerBg").onclick=closeDrawer;
$("#viewOverview").onclick=()=>setView("list");
$("#viewLog").onclick=()=>setView("focus");
$("#prevBtn").onclick=()=>stepFocus(-1);
$("#nextBtn").onclick=()=>stepFocus(1);
$("#fileInp").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const txt=await f.text();loadProgram(JSON.parse(txt));closeDrawer();toast("Program loaded");}
  catch(err){toast("Import failed: "+err.message);}
  e.target.value="";
};
/* Escape closes the drawer; arrow keys step through Log view. Both are desktop
   conveniences — guarded, because the headless test harness has no event target.
   Suppressed while editing a set: an arrow key while STATE.setEdit is set would jump
   exercises with a chip (not an INPUT) focused mid-edit. */
if(document.addEventListener)document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&drawerOpen()){closeDrawer();return;}
  if(drawerOpen()||viewMode()!=="focus"||STATE.setEdit!=null)return;
  const t=e.target&&e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  if(e.key==="ArrowLeft")stepFocus(-1);
  else if(e.key==="ArrowRight")stepFocus(1);
});

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
boot();
</script>
