function toggleDrawer(){drawerOpen()?closeDrawer():openDrawer();}

/* ---------- exercise categories ----------
   Colour for an exercise's left rail. Resolution order:
     1. an explicit `category` on the exercise (tp-program-1 optional field)
     2. a keyword guess from the exercise name
     3. nothing — neutral rail (never assert a category we don't have)
   Colours are CSS variables, not hex: each theme picks rail colours from its own
   palette, so a category keeps its *slot* across themes rather than its exact hue.
   The uppercase tag chip that used to sit on every card is gone — the rail alone
   carries the category now; see CLAUDE.md. */
/* `key` is carried through by catOf() so a caller can ask which slot resolved without
   string-matching the display label — painAsked() treats tendon work as pain-relevant
   even when the generator wrote no logHint. */
const CATS={
  warmup:  {key:"warmup",   label:"Warm-up",       color:"var(--cat-warm)"},
  tendon:  {key:"tendon",   label:"Tendon/prehab", color:"var(--cat-tendon)"},
  skill:   {key:"skill",    label:"Skill",         color:"var(--cat-skill)"},
  strength:{key:"strength", label:"Strength",      color:"var(--cat-strength)"},
  cond:    {key:"cond",     label:"Conditioning",  color:"var(--cat-cond)"},
  accessory:{key:"accessory",label:"Accessory",    color:"var(--cat-accessory)"},
  cooldown:{key:"cooldown", label:"Cool-down",     color:"var(--cat-warm)"}
};
/* Aliases so a generator can say "conditioning", "metcon", "prehab" etc. */
const CAT_ALIASES={metcon:"cond",conditioning:"cond",aerobic:"cond",cardio:"cond",
  prehab:"tendon",rehab:"tendon",tendon:"tendon",isometric:"tendon",
  warmup:"warmup","warm-up":"warmup",prep:"warmup",
  cooldown:"cooldown","cool-down":"cooldown",mobility:"cooldown",
  skill:"skill",technique:"skill",olympic:"skill",
  strength:"strength",lift:"strength",main:"strength",
  accessory:"accessory",auxiliary:"accessory",core:"accessory"};
/* Ordered — skill lifts must win before the EMOM/interval rule, because
   "Hang power clean (EMOM every 90s)" is skill work, not conditioning. */
const CAT_RULES=[
  [/warm-?up|cool-?down|prep\b|mobility/i,                               "warmup"],
  [/isometric|spanish squat|nordic|copenhagen|tibialis|prehab|neck iso/i, "tendon"],
  [/clean|snatch|jerk|muscle-?up|skill|high pull/i,                       "skill"],
  [/metcon|emom|amrap|for time|interval|erg\b|bike|\bski\b|sled|couplet/i,"cond"],
  [/squat|deadlift|rdl|press|bench|\brow\b|pull-?up|\bchin|\bdip|hinge/i, "strength"]
];
/* Unknown declared categories still get a stable colour rather than falling back to
   grey, so a generator can invent its own vocabulary and the UI keeps working. Drawn
   from the active theme's rail colours so an invented category can't import a hue the
   palette doesn't contain. */
const SPARE_COLORS=["var(--cat-skill)","var(--cat-strength)","var(--cat-cond)",
  "var(--cat-accessory)","var(--cat-tendon)","var(--cat-warm)"];
function spareColor(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return SPARE_COLORS[h%SPARE_COLORS.length];}

function catOf(ex){
  const declared=(ex.category||"").toString().trim();
  if(declared){
    const k=declared.toLowerCase().replace(/[\s_]+/g,"-");
    const hit=CATS[k]||CATS[CAT_ALIASES[k]]||CATS[CAT_ALIASES[k.replace(/-/g,"")]];
    if(hit)return {...hit,source:"declared"};
    return {label:declared,color:spareColor(k),source:"declared"};
  }
  for(const[re,key]of CAT_RULES)
    if(re.test(ex.name||""))return {...CATS[key],source:"guessed"};
  return null;                                  /* no tag, neutral rail */
}

/* ---------- program loading ----------
   Two programme schemas are live at once, on purpose:
     tp-program-1  Week 1 only; later weeks described in prose in `progression`.
     tp-program-2  every week authored as its own rows.
   A phone can be mid-block on a v1 programme in localStorage, so v1 must keep
   working indefinitely — this is the one place the difference is decided, and
   everything else asks dayExercises(). See docs/data-contracts.md. */
function isV2(){return !!(PROGRAM&&PROGRAM.meta&&PROGRAM.meta.schema==="tp-program-2");}
/* The exercises on screen right now. v2 filters by day AND week; v1 by day only,
   because under v1 every row is week 1 and filtering on week would empty the list. */
function dayExercises(){
  if(!PROGRAM||!Array.isArray(PROGRAM.exercises))return [];
  return PROGRAM.exercises.filter(e=>
    e.day===STATE.day && (!isV2() || Number(e.week)===Number(STATE.week)));
}
/* A v2 row whose `week` isn't a number matches no week at all, so the exercise would
   vanish from the whole block and the athlete would simply never do it. The generator
   rejects that input, but a hand-edited programme can still arrive — count them so the
   UI can say so out loud rather than quietly dropping work. */
function orphanExercises(){
  if(!isV2())return [];
  return PROGRAM.exercises.filter(e=>e.day===STATE.day&&!Number.isFinite(Number(e.week)));
}
/* meta.athleteId names the athlete/<slug>/logs/ folder an export belongs in. v1
   programmes predate it; derive the same slug from the display name so a log file
   is still filed correctly. A label, never a selector — the app has no profiles. */
function athleteId(){
  if(!PROGRAM||!PROGRAM.meta)return "";
  return PROGRAM.meta.athleteId||slug(PROGRAM.meta.athlete)||"";
}
/* Revision of the loaded programme. A week gets revised mid-block after a review, and
   re-importing is a manual step with no prompt — so this is shown next to the block name
   and stamped on every export, to answer "is the phone on the current version?" without
   diffing prescriptions. 0 means the programme predates versioning; the UI stays silent
   rather than claiming "v1", which would be a guess. */
function progVersion(){
  const v=PROGRAM&&PROGRAM.meta?Number(PROGRAM.meta.version):NaN;
  return Number.isFinite(v)&&v>0?Math.floor(v):0;
}
/* Prescribed set count, when the generator gave a plain number or a plain range —
   the set-at-a-time editor materialises this many chips before the athlete has logged
   anything. "3-4" or "AMRAP" are legitimate prose values, so anything else just means
   "start with one set": a range takes its lower bound (the extra set is one tap of
   "Log another set"); prose collapses to a single Set 1 of 1. */
function prescribedSets(ex){
  const s=String(ex.sets??"").trim();
  const clamp=n=>Math.min(Math.max(n,1),12);
  const plain=/^(\d+)$/.exec(s);
  if(plain)return clamp(parseInt(plain[1],10));
  const range=/^(\d+)\s*[-–—]\s*(\d+)$/.exec(s);
  if(range)return clamp(parseInt(range[1],10));
  /* "4 rounds" is four sets, and used to collapse to one. Deliberately tight — an
     integer, whitespace, then a *word*: "8-10 min" has no space after the 8 and
     "1 + 3" has no word after it, so both still mean "one set", which is right. */
  const counted=/^(\d+)\s+[a-z]/i.exec(s);
  if(counted)return clamp(parseInt(counted[1],10));
  return 1;
}
/* How many set chips the athlete actually wants shown right now. Starts at the
   prescription but is adjustable downward — tapping away an upcoming (never-logged) chip
   in the set editor sets `e.setTarget`, so skipping a set the plan called for doesn't
   leave a dead, always-outstanding slot sitting on the card forever. It never overrides
   what's already been committed — buildSetEditor() takes the max of this and rows.length. */
function targetSets(ex,e){
  return (typeof e.setTarget==="number"&&e.setTarget>=1)?e.setTarget:prescribedSets(ex);
}

/* Circuits need a different question from a strength set. The format already tells us
   whether a live round counter or one final result is the lower-friction default. */
function circuitOf(ex){
  const s=txt(ex&&ex.sets);let m;
  if((m=/^(\d+)\s+rounds?\b/i.exec(s)))return {kind:"rounds",target:Math.min(12,Math.max(1,+m[1])),
    defaultMode:/for\s+time/i.test(s)?"final":"quick",label:/for\s+time/i.test(s)?"Rounds for time":"Rounds"};
  if(/\bamrap\b/i.test(s)){m=/^(\d+)\s*(?:min(?:ute)?s?)?\s+amrap\b/i.exec(s)||/\bamrap\s*(\d+)?/i.exec(s);
    return {kind:"amrap",minutes:m&&m[1]?+m[1]:0,defaultMode:"final",label:"AMRAP"};}
  if(/\bemom\b/i.test(s)){m=/^(\d+)\s*(?:min(?:ute)?s?)?\s+emom\b/i.exec(s)||/\bemom\s*(\d+)?/i.exec(s);
    return {kind:"emom",minutes:m&&m[1]?+m[1]:0,defaultMode:"final",label:"EMOM"};}
  if(/\bfor\s+time\b/i.test(s))return {kind:"fortime",defaultMode:"final",label:"For time"};
  if(/^\d+(?:\s*[-–—]\s*\d+){2,}$/.test(s))return {kind:"ladder",defaultMode:"final",label:s};
  return null;
}
function circuitParts(ex){return txt(ex&&ex.reps).split(/\s*(?:\+|;|,)\s*/).map(x=>x.trim()).filter(Boolean);}
function blankCircuit(){return {mode:"",rounds:"",extra:"",time:"",result:"",minutes:"",load:"",note:"",touched:false};}
function circuitState(e,ex){
  /* Keep the object identity stable while fields are being edited. Replacing this
     object here leaves the other inputs in the same rendered form closing over a stale
     reference (typing rounds and then extra reps would silently lose the second value). */
  const fresh=!e.circuit||typeof e.circuit!=="object";
  if(fresh)e.circuit=blankCircuit();
  const c=e.circuit,defaults=blankCircuit();
  Object.keys(defaults).forEach(k=>{if(!(k in c))c[k]=defaults[k];});
  const spec=circuitOf(ex);if(!c.mode)c.mode=spec?spec.defaultMode:"final";
  if(!c.rounds&&e.sets&&e.sets.length)c.rounds=e.sets.length;
  /* A circuit logged before this UI existed has only the public flat headline. Keep it
     as a final-result fallback so opening Edit result can never blank old training data. */
  if(fresh&&c.mode==="final"&&(txt(e.reps)||txt(e.load)||txt(e.notes))){
    c.result=txt(e.reps);c.load=txt(e.load);c.note=txt(e.notes);c.touched=true;
  }
  return c;
}
function circuitHasData(e){const c=e&&e.circuit;
  return !!((e&&e.sets&&e.sets.length)||draftDirty(e)||(c&&(c.touched||c.rounds||txt(c.extra)||txt(c.time)||
    txt(c.result)||txt(c.minutes)||txt(c.load)||txt(c.note))));
}
function circuitModeName(mode){return mode==="quick"?"Quick rounds":mode==="details"?"Round details":"Final result";}

/* ---------- what the "reps" field actually measures ----------
   `reps` is prose, and in a real block roughly two rows in five prescribe something
   that is not a rep count: "45 sec", "8-10 min", "20 m", "45 sec hard / 75 sec easy".
   The input used to be inputmode="numeric" — a digits-only keypad on iOS — which made
   a 45-second hold literally untypeable. So the one field becomes whatever that
   exercise measures: label, unit suffix, keyboard and placeholder all come from here.

   Nothing about the stored value changes. It is still exactly what the athlete typed,
   in `reps`, as a string, with `prescribed.reps` beside it in the export to say what
   the number means — no schema change. See docs/data-contracts.md. */
/* Labels are kept SHORT on purpose: at 360px the metric column is about 68px wide, and a
   label that wraps to two lines drops its input below the others in the same grid row. */
const REP_METRICS=[
  /* Composite prose FIRST, or "45 sec hard / 75 sec easy" reads as a 45-second hold.
     A prescription with arithmetic in it, or two halves at different efforts, is not
     one number: give it the full keyboard and let the athlete say what happened. */
  {re:/\+|\bhard\b|\beasy\b|\bthen\b|\bamrap\b|\bmax\b|\brounds?\b/i,
                                                    label:"Result",unit:"",    mode:"text"},
  {re:/\bcal(?:orie)?s?\b/i,                        label:"Work",  unit:"cal", mode:"decimal"},
  {re:/\d\s*(?:s|secs?|seconds?)\b/i,               label:"Hold",  unit:"s",   mode:"decimal"},
  /* Before the bare-m rule, so "8-10 min" is minutes and "20 m" stays metres. */
  {re:/\bmin(?:s|ute|utes)?\b/i,                    label:"Time",  unit:"min", mode:"decimal"},
  {re:/\d\s*(?:m|metres?|meters?)\b/i,              label:"Dist",  unit:"m",   mode:"decimal"},
  {re:/^\d+(?:\s*[-–—]\s*\d+)?(?:\s*\/\s*\w+)?$/,   label:"Reps",  unit:"",    mode:"numeric"}
];
function metricOf(ex){
  const rx=txt(ex&&ex.reps);
  /* Anything unrecognised is reps typed on a full keyboard — never a numeric keypad,
     which is the trap this whole function exists to avoid. */
  const m=REP_METRICS.find(c=>c.re.test(rx))||{label:"Reps",unit:"",mode:"text"};
  const lead=/^[\d.]+(?:\s*[-–—]\s*[\d.]+)?/.exec(rx);
  return {
    label:m.label,
    /* The unit goes in the LABEL, not in an overlay inside the field. A 3-character
       suffix ("min") plus a 4-character value ("8-10") does not fit a 68px column — it
       clipped the value, which is worse than a slightly longer label. */
    fieldLabel:m.label+(m.unit?` (${m.unit})`:""),
    unit:m.unit,
    inputmode:m.mode,
    /* Free text keeps sentence capitalisation; a number never wants it. */
    autocap:m.mode==="text"?"sentences":"off",
    /* The prescription itself, minus the unit — the label already carries that. Prose gets
       a generic word instead: "5 TnG power cleans + 15/12 cal bike" clips to "5 TnG p" in
       a 68px column, which reads as broken, and the full prescription is on the line
       directly above the field anyway. */
    placeholder:m.mode==="text"?"result"
               :(lead?lead[0].replace(/\s+/g,""):(rx.slice(0,6)||"reps"))
  };
}

/* ---------- what the programme says to capture ----------
   `logHint` is the generator's own list of what matters for this movement ("Top load;
   RPE-1; depth owned Y/N; knee pain during + next AM"). It used to render as one line
   of blue prose the eye slides straight off. Split on the semicolons only — "knee pain
   during + next AM" is one instruction, and cutting it at the + leaves "next AM"
   standing on its own meaning nothing. */
function parseHints(ex){
  return txt(ex&&ex.logHint).split(/\s*;\s*/).map(s=>s.trim()).filter(Boolean).slice(0,4);
}
/* Does this exercise's own prescription ask for a pain reading? Used to accent the
   pain field and to nudge once on Finish — never to hide the field, because
   `tracking.painPerExercise` means "this device collects it" and an exercise-by-exercise
   exception would make an empty value unreadable. See docs/data-contracts.md. */
const PAIN_CUES=/pain|sore|ache|stiff|flare|niggle|tendon|response/i;
const PAIN_SITES=/\b(knee|patella\w*|hamstring|shoulder|achilles|elbow|wrist|ankle|hip|back|neck|groin|calf|quad)\b/i;
function painAsked(ex){
  if(!ex)return null;
  const hint=txt(ex.logHint),focus=txt(ex.focus),cat=catOf(ex);
  if(!(PAIN_CUES.test(hint)||PAIN_CUES.test(focus)||(cat&&cat.key==="tendon")))return null;
  const site=PAIN_SITES.exec(hint)||PAIN_SITES.exec(focus);
  return {site:site?site[1].toLowerCase():""};
}
/* The site the loaded programme talks about most, so the drawer can offer it instead of
   the athlete having to know that "Knee" is a setting. Nothing here is persisted or
   exported, and the device's own painLabel always wins. */
function programPainSite(){
  if(!PROGRAM||!Array.isArray(PROGRAM.exercises))return "";
  const freq=new Map();
  PROGRAM.exercises.forEach(ex=>{
    const a=painAsked(ex);
    if(a&&a.site)freq.set(a.site,(freq.get(a.site)||0)+1);
  });
  let best="",n=0;
  freq.forEach((c,s)=>{if(c>n){best=s;n=c;}});
  return best;
}

/* ---------- where the athlete is in the block ----------
   Week and day are a position, not a preference: week 5 is a fact about the block, and a
   refresh — or the service worker activating a new build mid-session — must not drop it
   back to Week 1 Day 1 and silently show the wrong prescriptions. Date is deliberately
   NOT restored: it keys the stored session, so reopening the app the next morning must
   start a new day rather than reopen yesterday's file. */
function firstDay(){return (PROGRAM&&PROGRAM.meta&&PROGRAM.meta.days&&PROGRAM.meta.days[0])||null;}
function positionKey(){return APP.source==="sample"?LS.demoPos:LS.pos;}
function savePos(){
  try{localStorage.setItem(positionKey(),JSON.stringify({week:STATE.week,day:STATE.day}));}catch(e){}
}
function restorePos(){
  STATE.day=firstDay();
  let p=null;
  try{p=JSON.parse(localStorage.getItem(positionKey())||"null");}catch(e){}
  if(!p||typeof p!=="object")return;
  /* Clamp against the programme actually loaded, not against what was saved. A saved week
     can point past the end of a shorter block imported since, and a saved day can name a
     day this programme doesn't have — either would render an empty screen. */
  const w=Number(p.week), weeks=Number(PROGRAM.meta.weeks)||1;
  if(Number.isFinite(w)&&w>=1&&w<=weeks)STATE.week=Math.floor(w);
  const days=Array.isArray(PROGRAM.meta.days)?PROGRAM.meta.days:[];
  if(days.indexOf(p.day)>=0)STATE.day=p.day;
}

function loadProgram(obj){
  if(!obj||!obj.meta||!Array.isArray(obj.exercises))throw new Error("Not a valid program.json (need meta + exercises).");
  PROGRAM=obj;APP.source="personal";localStorage.setItem(LS.prog,JSON.stringify(obj));
  const demo=$("#demoBanner");if(demo)demo.hidden=true;
  /* A fresh import starts at the top of the block — and that reset has to be persisted,
     or the next refresh would restore the position from the programme just replaced. */
  STATE.week=1; STATE.day=(obj.meta.days&&obj.meta.days[0])||null; STATE.date=todayISO();
  savePos();
  resetFocus();
  renderAll();resetViewScroll();
}
function acceptProgramImport(obj,fromProfile=APP.surface==="profile"){
  if(window.TPPrograms&&TPPrograms.importProgram){
    const pending=TPPrograms.importProgram(obj);
    return Promise.resolve(pending).then(result=>{
      if(fromProfile)showSurface("profile");else closeDrawer();
      if(result&&result.ok){
        toast(result.pending?"Programme ready · cloud backup queued":"Programme added to your library");
      }else{
        const message=result&&result.error&&result.error.message||"Cloud backup failed";
        toast("Programme ready on this device · "+message);
      }
      return result;
    });
  }
  loadProgram(obj);
  if(fromProfile){showSurface("profile");if(window.TPProfileUI)TPProfileUI.render();}
  else closeDrawer();
  toast(fromProfile?"Programme ready on this device":"Program loaded");
}
function clearCachedProgram(){
  localStorage.removeItem(LS.prog);localStorage.removeItem(LS.pos);
  if(APP.source==="personal"||APP.surface==="profile")PROGRAM=null;
  if(window.TPProfileUI)TPProfileUI.render();
}
async function boot(){
  loadSettings();
  applyTheme();          /* head script already painted it; this keeps meta + state in sync */
  if(window.TPAuthUI)TPAuthUI.init({toast});
  if(window.TPPrograms)TPPrograms.init({
    getCachedProgram:cachedProgram,
    onActivate:loadProgram,
    onClearActive:clearCachedProgram
  });
  if(window.TPSessions)TPSessions.init({
    readLocalSessions:readPersonalSessions,
    buildPayload:(session,program)=>buildSessionPayload(session,program)
  });
  if(window.TPProfileUI)TPProfileUI.init({
    getCachedProgram:cachedProgram,
    onOpenCached:openCachedWorkout,
    onImport:requestProgramImport,
    onActivateProgram:id=>{
      const result=window.TPPrograms&&TPPrograms.activate(id);
      if(!result||!result.ok)toast(result&&result.error&&result.error.message||"Programme unavailable");
    },
    onBackUpCached:async()=>{
      const result=await TPPrograms.backUpCached();
      toast(result.ok?(result.pending?"Cloud backup queued":"Programme backed up"):
        result.error&&result.error.message||"Cloud backup failed");
    },
    onRemoveProgram:async item=>{
      const label=item&&item.title||"this programme";
      if(window.confirm&&!window.confirm(`Remove ${label} from your library? The workout logs on this device will be kept.`))return;
      const result=await TPPrograms.remove(item.id);
      toast(result.ok?"Programme removed":result.error&&result.error.message||"Remove failed");
    },
    onNotice:toast,
    onDownloadHistory:downloadSessionPayload,
    onCopyHistory:copySessionPayload,
    onOpenSample:openSampleWorkout,
    onSignedOut:()=>showSurface("profile")
  });
  if(window.TPAuth){
    TPAuth.subscribe(()=>{
      if(APP.surface==="workout"&&APP.source==="personal"&&!cachedAccess())openProfile();
      else if(drawerOpen())renderDrawer();
    });
    TPAuth.init();
  }
  showSurface("profile");
}

/* ---------- session persistence ---------- */
/* `amPainOnWaking` replaced `amPainNextDay` at tp-session-3. The old field asked for
   tomorrow's response to today's session, which meant re-opening a closed session the
   next morning — so in practice it arrived empty, and an empty tendon reading looks
   exactly like a good one. This is the same measurement taken at check-in, when the app
   is already open. It is the response to the PREVIOUS session; see docs/data-contracts.md. */
const BLANK_SESSION={bodyweightKg:"",sleep:"",readiness:"",hrvNote:"",amPainOnWaking:"",overall:""};

/* An exercise entry. `sets[]` holds only *committed* rows — a set the athlete actually
   confirmed with "Log set N". `draft` is the set currently being typed, seeded from the
   set before it; it is never in `sets[]` and never reaches an export (see exportEntry).
   `summaryAuto` says whether load/reps/rpe/painDuring are still following the sets —
   editing any of them directly in "Summary & notes" turns following off for good,
   exactly like a per-set row that stops following once it's been typed into. `setTarget`
   is the athlete's own adjusted set count (see targetSets()) — null until they remove an
   upcoming chip, so it doesn't have to be reset when a programme is re-imported. */
/* `dirty` is the difference between "these fields are showing you the last set" and
   "you have typed this set". Only a dirty draft is auto-committed when you end early or
   navigate away (see flushDraft), which is what stops a typed set being silently
   dropped without ever inventing a set nobody performed. App-local: `draft` never
   reaches an export, and commitSet() builds its row from named fields. */
function blankDraft(){return {load:"",reps:"",rpe:"",painDuring:"",note:"",dirty:false};}
function seedDraft(row){return {load:txt(row.load),reps:txt(row.reps),rpe:txt(row.rpe),
  painDuring:txt(row.painDuring),note:"",dirty:false};}
function draftEmpty(d){return !(txt(d.load)||txt(d.reps)||txt(d.rpe)||txt(d.painDuring)||txt(d.note));}
function draftDirty(e){return !!(e&&e.draft&&e.draft.dirty&&!draftEmpty(e.draft));}
/* Three states, and every surface has to tell them apart: "done" is finished, "part" is
   something logged or typed but not finished, "todo" is untouched. The Overview status
   line, the pip strip and the progress bar all read this — before, a half-logged
   exercise looked identical to an untouched one everywhere outside the editor, which is
   how a session could feel logged and export as empty. */
function entryState(e){
  if(!e)return "todo";
  if(e.done)return "done";
  return ((e.sets&&e.sets.length)||draftDirty(e)||circuitHasData(e))?"part":"todo";
}
function blankEntry(){return {done:false,load:"",reps:"",rpe:"",painDuring:"",notes:"",
  sets:[],draft:blankDraft(),summaryAuto:true,setTarget:null,circuit:null};}
function renumber(e){(e.sets||[]).forEach((r,i)=>{r.set=i+1;});return e.sets;}

/* ---------- deriving the flat summary from sets[] ----------
   Every one of these must be safe on an empty or partial set list: never fabricate an
   RPE of 0 from nothing logged, never emit "NaN" from prose ("7-8"), never assert a
   reps count sets[] doesn't support. */
function pickMode(vals){
  if(!vals.length)return "";
  const freq=new Map();
  vals.forEach(v=>freq.set(v,(freq.get(v)||0)+1));
  let best=vals[0],bestCount=freq.get(vals[0]);
  freq.forEach((c,v)=>{
    if(c>bestCount){best=v;bestCount=c;}
    else if(c===bestCount){
      /* Tie: prefer the numerically heavier value (a dropped-load top set beats its
         back-off sets), falling back to the first-seen when neither parses. */
      const pv=parseNum(v),pb=parseNum(best);
      if(pv!=null&&(pb==null||pv>pb)){best=v;bestCount=c;}
    }
  });
  return best;
}
function pickMax(vals){
  if(!vals.length)return "";
  const nums=vals.map(v=>({v,n:parseNum(v)})).filter(x=>x.n!=null);
  if(nums.length){let b=nums[0];nums.forEach(x=>{if(x.n>b.n)b=x;});return b.v;}
  return vals[vals.length-1];               /* nothing parsed ("7-8") — last raw string */
}
/* `unit` comes from metricOf(ex) and is optional throughout: three 45-second holds
   derive as "3x45s" rather than the ambiguous "3x45". It is appended, never parsed —
   the value stays exactly what the athlete typed. Callers that have no exercise in
   hand (the migration path in normalizeEntry) pass nothing and get the bare number. */
function withUnit(v,unit){return unit&&v?v+unit:v;}
function deriveReps(rows,unit){
  const vals=rows.map(r=>txt(r.reps));
  if(!vals.some(Boolean))return "";
  const allFilled=vals.every(Boolean);
  if(allFilled&&new Set(vals).size===1)
    return vals.length===1?withUnit(vals[0],unit):`${vals.length}x${withUnit(vals[0],unit)}`;
  if(allFilled)return vals.map(v=>withUnit(v,unit)).join("/");
  /* a hole is shown, never silently dropped */
  return vals.map(v=>v?withUnit(v,unit):"-").join("/");
}
function deriveSummary(rows,unit){
  return {
    load: pickMode(rows.map(r=>txt(r.load)).filter(Boolean)),
    reps: deriveReps(rows,unit),
    rpe: pickMax(rows.map(r=>txt(r.rpe)).filter(Boolean)),
    painDuring: pickMax(rows.map(r=>txt(r.painDuring)).filter(Boolean))
  };
}
function applyDerivedSummary(e,unit){
  if(e.summaryAuto===false)return;
  const d=deriveSummary(e.sets,unit);
  e.load=d.load;e.reps=d.reps;e.rpe=d.rpe;e.painDuring=d.painDuring;
}

/* ---------- migrating a stored entry ----------
   Runs inside getSession(), so every reader — renderMain, updateProgress, export — sees
   the current shape regardless of which build wrote the file on disk. Idempotent: run it
   twice and the second pass changes nothing, which matters because it runs on every read. */
function normalizeEntry(e){
  let changed=false;
  if(!Array.isArray(e.sets)){e.sets=[];changed=true;}
  /* The old "Log each set" table seeded rows the athlete hadn't actually typed into yet
     and flagged them `auto`. The set-at-a-time editor never writes that flag, so any row
     that still carries it predates this build and was never confirmed — drop it, or a
     7-set exercise where only set 1 was ever typed exports as 7 sets performed. */
  if(e.sets.some(r=>r&&"auto" in r)){
    /* Rebuild the survivors too, not just drop the auto:true rows — a row that carried
       the key at all predates this build, and leaving `auto:false` sitting on it is
       stale bookkeeping the new model never reads or writes. */
    e.sets=e.sets.filter(r=>!(r&&r.auto)).map(r=>({set:r.set,
      load:txt(r.load),reps:txt(r.reps),rpe:txt(r.rpe),painDuring:txt(r.painDuring),note:txt(r.note)}));
    renumber(e);
    changed=true;
  }
  /* Per-set logging used to be opt-in, so most existing logs are flat-only. Promote that
     into one committed set rather than let derivation below silently blank it out — but
     not for a box ticked with nothing logged at all (a warm-up needs no invented set). */
  if(!e.sets.length&&!(e.circuit&&e.circuit.mode==="final")&&
     (txt(e.load)||txt(e.reps)||txt(e.rpe)||txt(e.painDuring))){
    e.sets=[{set:1,load:txt(e.load),reps:txt(e.reps),rpe:txt(e.rpe),painDuring:txt(e.painDuring),note:""}];
    changed=true;
  }
  if(!e.draft||typeof e.draft!=="object"){
    e.draft=e.sets.length?seedDraft(e.sets[e.sets.length-1]):blankDraft();
    changed=true;
  }
  if(e.circuit&&typeof e.circuit==="object"){
    const normalized={...blankCircuit(),...e.circuit};
    if(JSON.stringify(normalized)!==JSON.stringify(e.circuit)){e.circuit=normalized;changed=true;}
  }else if(e.circuit!=null){e.circuit=null;changed=true;}
  if(typeof e.summaryAuto!=="boolean"){e.summaryAuto=true;changed=true;}
  if(changed){
    if(e.circuit&&e.circuit.mode!=="final")syncCircuitSummary(e);
    else if(!(e.circuit&&e.circuit.mode==="final"))applyDerivedSummary(e);
  }
  return changed;
}

function sessionKey(){return APP.source==="sample"?LS.demoSess(STATE.date,STATE.day):LS.sess(STATE.date,STATE.day);}
function getSession(){
  const raw=localStorage.getItem(sessionKey());
  let s=null;
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      if(parsed&&typeof parsed==="object"){
        parsed.session={...BLANK_SESSION,...(parsed.session||{})};
        if(!parsed.entries||typeof parsed.entries!=="object")parsed.entries={};
        s=parsed;
      }
    }catch(e){}
  }
  if(!s)s={block:PROGRAM?PROGRAM.meta.block:"",athlete:PROGRAM?PROGRAM.meta.athlete:"",
    week:STATE.week,day:STATE.day,date:STATE.date,
    session:{...BLANK_SESSION},entries:{}};
  let changed=false;
  Object.keys(s.entries).forEach(id=>{
    const e={...blankEntry(),...s.entries[id]};
    if(normalizeEntry(e))changed=true;
    s.entries[id]=e;
  });
  if(changed){try{localStorage.setItem(sessionKey(),JSON.stringify(s));}catch(e){}}
  return s;
}
function saveSession(s){
  s.week=STATE.week;s.day=STATE.day;s.date=STATE.date;
  /* localStorage can throw (quota, private mode) — never let a keystroke's autosave
     take the rest of the app down with it. */
  let saved=false;
  try{localStorage.setItem(sessionKey(),JSON.stringify(s));saved=true;}catch(e){}
  /* The remote path begins only after the device write succeeds. stage() is synchronous:
     it snapshots the contract into a durable queue and schedules network work elsewhere,
     so a keystroke never waits for Supabase. Demo sessions never cross this boundary. */
  if(saved&&APP.source==="personal"&&PROGRAM&&window.TPSessions&&window.TPPrograms){
    const active=TPPrograms.getActiveIdentity&&TPPrograms.getActiveIdentity();
    if(active&&active.id){
      try{TPSessions.stage(sessionKey(),active.id,buildSessionPayload(s,PROGRAM));}catch(e){}
    }
  }
  updateProgress(s);
}

/* ---------- set mutation ---------- */
function commitSet(e,unit){
  if(draftEmpty(e.draft))return false;
  const row={set:e.sets.length+1,load:txt(e.draft.load),reps:txt(e.draft.reps),
    rpe:txt(e.draft.rpe),painDuring:txt(e.draft.painDuring),note:txt(e.draft.note)};
  e.sets.push(row);
  e.draft=seedDraft(row);
  applyDerivedSummary(e,unit);
  return true;
}
function deleteSet(e,idx,unit){
  e.sets.splice(idx,1);renumber(e);
  applyDerivedSummary(e,unit);
}
/* A set the athlete typed but never confirmed used to vanish: ending set `done` without
   touching the draft, and only committed rows are exported. So anything that ends the
   athlete's time on an exercise commits a dirty draft first. Only *dirty* — a draft
   still showing the previous set's values is not a set that happened. */
function commitDraftIfDirty(e,unit){
  return draftDirty(e)?commitSet(e,unit):false;
}
function commitCircuitRound(e){
  if(!draftDirty(e))return false;
  e.sets.push({set:e.sets.length+1,load:txt(e.draft.load),
    reps:txt(e.draft.reps)||"As prescribed",rpe:txt(e.draft.rpe),
    painDuring:txt(e.draft.painDuring),note:txt(e.draft.note)});
  const c=e.circuit;c.rounds=e.sets.length;c.touched=true;e.draft=blankDraft();
  syncCircuitSummary(e);return true;
}
/* The same thing for the exercise currently open in Log view, for callers that navigate
   away rather than holding the entry. Returns whether anything was committed, because a
   caller that does not immediately re-render would otherwise leave the card on screen
   holding a session object one set out of date — the same staleness closeDrawer() guards
   against. */
function flushDraft(){
  if(!PROGRAM||!STATE.day)return false;
  const exs=dayExercises(),ex=exs[STATE.focus];
  if(!ex)return false;
  const s=getSession(),e=s.entries[ex.id];
  const spec=circuitOf(ex);
  if(spec){
    if(!e||circuitState(e,ex).mode!=="details"||!commitCircuitRound(e))return false;
    saveSession(s);return true;
  }
  if(!e||!commitDraftIfDirty(e,metricOf(ex).unit))return false;
  saveSession(s);
  return true;
}

/* ---------- rendering ---------- */
function renderAll(){renderHeader();renderDrawer();renderMain();}

/* The header carries only what has to be true while training: which session this is,
   how far through it you are, and which date it is being logged onto. Everything else
   moved into the drawer. */
function renderHeader(){
  const name=$("#blockName"),sub=$("#blockSub");
  if(!PROGRAM){
    name.textContent="Training Tracker";
    sub.textContent="No program loaded — tap Import";
    $("#ctxLine").textContent="Training Tracker";
    $("#ctxLine").classList.remove("off");
    $("#ctxSub").textContent="Import a program to begin";
    return;
  }
  name.textContent=PROGRAM.meta.block||"Training block";
  const rev=progVersion();
  sub.textContent=`${PROGRAM.meta.athlete||""} · ${PROGRAM.meta.weeks||"?"}-week block`
    +(rev?` · v${rev}`:"");
  const today=STATE.date===todayISO();
  const ctx=$("#ctxLine");
  ctx.textContent=STATE.day
    ?`Week ${STATE.week} · ${dayParts(STATE.day).short} ${fmtDateShort(STATE.date)}`+(today?"":" · not today")
    :`Week ${STATE.week}`;
  ctx.classList.toggle("off",!today);
  $("#ctxSub").textContent=STATE.day?dayTheme(STATE.day):"No training days in this program";
}
/* "Day 1 (Mon) - Clean Skill + Front Squat" -> {num:"D1", short:"Mon"} */
function dayParts(d){
  const m=/\(([A-Za-z]{3,9})\)/.exec(d||""), n=/Day\s*(\d+)/i.exec(d||"");
  return {num:n?"D"+n[1]:"", short:m?m[1]:((d||"").split(/[\s(-]/)[0]||"Day")};
}
/* …and the part after the dash, which names what the session actually is. Falls back to
   the whole label rather than to nothing — a generator need not use the dash. */
function dayTheme(d){
  const s=(d||"").trim();
  const m=/\s[-–—]\s(.+)$/.exec(s);
  return m?m[1].trim():s;
}
/* A date that isn't today is legitimate — it is how a session gets completed after the
   fact — but it is silent, and logging onto the wrong day can't be undone. Say it. */
function fmtDate(iso){
  try{
    const d=new Date(iso+"T00:00:00");
    if(isNaN(d.getTime()))return iso;
    return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  }catch(e){return iso;}
}
/* Same, without the weekday — the header already states that via the day name. */
function fmtDateShort(iso){
  try{
    const d=new Date(iso+"T00:00:00");
    if(isNaN(d.getTime()))return iso;
    return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
  }catch(e){return iso;}
}

/* ---------- view mode ----------
   "list"  — Overview: every exercise for the day, read-only, tap one to open it.
   "focus" — Log: one exercise, with prev/next and one pip per exercise in the header.
   Internal values kept as "list"/"focus" from the previous layout; only the on-screen
   wording changed to Overview/Log. */
function viewMode(){return SETTINGS.view==="focus"?"focus":"list";}
function setView(v){
  const next=v==="focus"?"focus":"list";
  const current=viewMode();
  if(next===current)return;
  if(current==="list")OVERVIEW_SCROLL=currentScrollY();
  if(next==="list")flushDraft();      /* leaving the editor ends the set in progress */
  SETTINGS.view=next;saveSettings();renderMain();
  if(next==="list")restoreOverviewScroll();else scrollTop();
}
function syncView(){
  const focus=viewMode()==="focus";
  $("#viewOverview").setAttribute("aria-pressed",String(!focus));
  $("#viewLog").setAttribute("aria-pressed",String(focus));
  $("#fExport").hidden=focus;
  $("#fNav").hidden=!focus;
  $("#pbar").hidden=focus;
  $("#pips").hidden=!focus;
}
function currentScrollY(){return Math.max(0,Number(window.scrollY??window.pageYOffset)||0);}
function scrollTop(){if(window.scrollTo)window.scrollTo(0,0);}
function restoreOverviewScroll(){if(window.scrollTo)window.scrollTo(0,OVERVIEW_SCROLL);}
function resetViewScroll(){OVERVIEW_SCROLL=0;scrollTop();}
/* Where to land when the session changes: the first thing not yet ticked off. */
function firstUndone(){
  const exs=dayExercises();
  if(!exs.length)return 0;
  const s=getSession();
  const i=exs.findIndex(e=>!(s.entries[e.id]&&s.entries[e.id].done));
  return i<0?exs.length-1:i;
}
function resetFocus(){STATE.focus=firstUndone();STATE.setEdit=null;}
function clampFocus(){
  const n=dayExercises().length,i=Math.floor(Number(STATE.focus));
  STATE.focus=n?Math.max(0,Math.min(Number.isFinite(i)?i:0,n-1)):0;
}
function goFocus(i){
  const n=dayExercises().length;if(!n)return;
  const next=Math.max(0,Math.min(i,n-1));
  STATE.setEdit=null;
  if(next===STATE.focus)return;
  flushDraft();                       /* before focus moves off the exercise it belongs to */
  STATE.focus=next;renderMain();scrollTop();
}
function stepFocus(d){goFocus(STATE.focus+d);}

function renderMain(){
  const m=$("#main");m.innerHTML="";
  if(!PROGRAM){
    const b=el("div",{className:"banner"},
      "No program.json loaded. Import the program.json from your Drive folder to begin.");
    const imp=el("button",{className:"primary"},"Import program…");
    imp.onclick=()=>$("#fileInp").click();
    b.append(el("div",{},imp));
    m.append(b);renderNav();updateProgress();return;
  }
  const s=getSession();
  const exs=dayExercises();
  /* v1 only: the rows on screen are the Week-1 template, so past week 1 the athlete
     has to apply the progression rule themselves. v2 authors every week, so the
     prescription shown IS this week's and the banner would be a lie. */
  if(!isV2()){
    const authoredWeeks=PROGRAM.exercises.map(e=>Number(e.week)||1);
    if(authoredWeeks.length&&STATE.week>Math.max(...authoredWeeks))
      m.append(el("div",{className:"banner"},`Week ${STATE.week}: prescriptions below are the Week-1 template — apply each exercise's Progression Rule for this week.`));
  }
  if(!exs.length)m.append(el("div",{className:"banner"},isV2()
    ?`No exercises for week ${STATE.week} of this day in the program.`
    :"No exercises for this day in the program."));
  const orphans=orphanExercises();
  if(orphans.length)m.append(el("div",{className:"banner"},
    `${orphans.length} exercise${orphans.length>1?"s":""} on this day (${orphans.map(o=>o.name).join("; ")}) have no valid week and are not shown in any week. Re-generate program.json.`));
  clampFocus();
  if(viewMode()==="focus"){
    if(exs.length)m.append(logCard(exs[STATE.focus],s,STATE.focus));
  }else{
    exs.forEach((ex,i)=>m.append(overviewCard(ex,s,i)));
  }
  renderNav();
  updateProgress(s);
}

/* The pip strip is rebuilt only when the set of exercises on screen changes; paintNav()
   keeps done-state and position current on every keystroke without rebuilding it. */
let PIPS=[];
let NAV_AT=-1;                    /* last STATE.focus the pip strip was scrolled to */
function renderNav(){
  syncView();
  const host=$("#pips");host.innerHTML="";PIPS=[];
  NAV_AT=-1;
  if(viewMode()!=="focus"||!PROGRAM)return;
  dayExercises().forEach((ex,i)=>{
    const b=el("button",{className:"pip",attrs:{title:ex.name,
      "aria-label":`Exercise ${i+1}: ${ex.name}`}},String(i+1));
    b.onclick=()=>goFocus(i);
    PIPS.push(b);host.append(b);
  });
}
function paintNav(sess){
  const exs=PROGRAM&&STATE.day?dayExercises():[];
  const s=exs.length?(sess||getSession()):null;
  PIPS.forEach((b,i)=>{
    const ex=exs[i],e=ex&&s?s.entries[ex.id]:null,st=entryState(e);
    b.setAttribute("data-done",st==="done"?"1":"0");
    b.setAttribute("data-part",st==="part"?"1":"0");
    b.setAttribute("aria-current",String(i===STATE.focus));
  });
  $("#navCount").textContent=exs.length
    ?`${Math.min(STATE.focus+1,exs.length)} / ${exs.length}`:"—";
  $("#prevBtn").disabled=STATE.focus<=0;
  $("#nextBtn").disabled=STATE.focus>=exs.length-1;
  /* Runs on every keystroke via saveSession() → updateProgress(). Scrolling the pip
     strip into view on every character (and while a soft keyboard is up) is what made
     the screen jump while typing — only actually do it when the position changes, and
     never while an input is focused. */
  if(STATE.focus!==NAV_AT){
    NAV_AT=STATE.focus;
    const active=document.activeElement,tag=active&&active.tagName;
    const typing=tag==="INPUT"||tag==="TEXTAREA";
    const cur=PIPS[STATE.focus];
    if(!typing&&cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"nearest"});
  }
}

/* Called on every autosave (saveSession → here), so it repaints state and never rebuilds
   structure. Accepts the session object already in hand so it never has to re-fetch and
   re-parse localStorage on every keystroke — see saveSession() and renderMain(). */
function updateProgress(sess){
  const fill=$("#pbarDone"),part=$("#pbarPart"),cnt=$("#progCount");
  if(!PROGRAM||!STATE.day){
    if(cnt)cnt.textContent="—";
    if(fill)fill.style.width="0";
    if(part)part.style.width="0";
    $("#menuBtn").classList.remove("alert");
    paintNav();return;
  }
  const s=sess||getSession();
  const exs=dayExercises();
  const states=exs.map(e=>entryState(s.entries[e.id]));
  const done=states.filter(st=>st==="done").length;
  const touched=states.filter(st=>st!=="todo").length;
  const pct=n=>(exs.length?Math.round(n/exs.length*100):0)+"%";
  fill.style.width=pct(done);
  /* A dimmer layer behind it, so a session with four exercises half-logged doesn't read
     as 0% through. Same bar, two truths: finished, and started. */
  part.style.width=pct(touched);
  cnt.textContent=`${done}/${exs.length} done`;
  /* The only nag in the app: a dot on the ≡ until the check-in has something in it.
     It lives here because this runs on every save, so it clears as soon as it's wrong. */
  $("#menuBtn").classList.toggle("alert",!checkinFilled(s));
  const stat=$("#checkinStat");
  if(stat)stat.textContent=checkinSummary(s);
  paintNav(s);
}

/* `labelClass` is how the pain field gets accented on an exercise whose own prescription
   asks for a reading — see painAsked(). */
function field(labelText,node,unit,labelClass){
  const fld=el("div",{className:"fld"+(unit?" has-unit":"")},[node]);
  if(unit)fld.append(el("span",{className:"unit"},unit));
  return el("div",{},[el("label",{className:"lbl"+(labelClass?" "+labelClass:"")},labelText),fld]);
}

function sessionCard(s){
  const c=el("div",{className:"card sessioncard"});
  c.append(el("span",{className:"rail"}));
  c.dataset.readiness=SETTINGS.readiness?(s.session.readiness||""):"";
  /* No title: the accordion this sits in is already called "Session check-in", and the
     rail keeps carrying the readiness colour. */
  c.append(el("div",{className:"rx"},"Fill this before you start — it's how today began, not how it went."));
  const wrap=el("div",{className:"log"});
  const mk=(k,label,type="text",attrs={},unit)=>{
    const inp=el("input",{type,value:s.session[k]??"",attrs});
    inp.oninput=()=>{s.session[k]=inp.value;saveSession(s);};
    return field(label,inp,unit);
  };
  /* First in the grid on purpose: for a tendon block this is the highest-value number in
     the file, it is only true before training, and it used to be the one that got missed. */
  if(SETTINGS.painOnWaking)
    wrap.append(mk("amPainOnWaking",painLbl(" on waking"),"number",{min:0,max:10},"/10"));
  if(SETTINGS.readiness){
    const rd=el("select",{},["","Green","Amber","Red"].map(o=>
      el("option",{value:o,textContent:o||"Readiness…",selected:s.session.readiness===o})));
    rd.onchange=()=>{s.session.readiness=rd.value;saveSession(s);
      c.dataset.readiness=rd.value;};
    wrap.append(field("Readiness",rd));
  }
  if(SETTINGS.sleep)wrap.append(mk("sleep","Sleep","number",{min:1,max:5},"/5"));
  if(SETTINGS.bodyweight)wrap.append(mk("bodyweightKg","Bodyweight","number",{},"kg"));
  if(SETTINGS.hrvNote){
    const hrv=el("input",{type:"text",value:s.session.hrvNote||"",
      attrs:{placeholder:"e.g. HRV 62, at baseline"}});
    hrv.oninput=()=>{s.session.hrvNote=hrv.value;saveSession(s);};
    const f=field("HRV / notes",hrv);f.className="full";wrap.append(f);
  }
  if(wrap.children.length)c.append(wrap);
  const ov=el("textarea",{value:s.session.overall||"",attrs:{placeholder:"Overall session notes…"}});
  ov.oninput=()=>{s.session.overall=ov.value;saveSession(s);};
  c.append(el("div",{style:"margin-top:12px"},[el("label",{className:"lbl"},"Overall notes"),ov]));
  return c;
}

/* ---------- exercise head (shared by Overview and Log) ----------
   The one place both surfaces draw from, so they cannot drift: category rail colour
   (set by the caller), name, and the prescription folded into one or two plain lines —
   no separate hero number, no pill-chip row. Everything past this point is where the
   two views genuinely differ (read-only status line vs. the set editor), which is why
   they are two bodies rather than one branchy card builder. */
/* The prescription, as [emphasised sets×reps, the rest as one muted string]. Two nodes
   rather than one string so the target numbers can carry weight while the prose around
   them stays quiet; it is still one wrapping line, not a hero number and a chip row. */
function rxLine(ex){
  const bits=[];
  if(ex.load)bits.push(ex.load);
  /* No "RPE " prefix here — the generator's own prescribed value already carries it
     ("RPE 5-6") or is prose that doesn't want one ("Pain <=3/10; effort 6-7/10"). */
  if(ex.rpe)bits.push(ex.rpe);
  const rest=bits.join(" · ");
  return [el("span",{className:"rx-x"},`${ex.sets||"?"} × ${ex.reps||"?"}`),
          rest?" · "+rest:null];
}
function metaLine(ex){
  const bits=[];
  if(ex.tempo&&ex.tempo!=="-")bits.push("Tempo "+ex.tempo);
  if(ex.rest&&ex.rest!=="-")bits.push("Rest "+ex.rest);
  return bits.join(" · ");
}
function exerciseHead(ex){
  const nodes=[el("div",{className:"ex-name"},ex.name),
               el("div",{className:"rx"},rxLine(ex))];
  const meta=metaLine(ex);
  if(meta)nodes.push(el("div",{className:"rx meta"},meta));
  return nodes;
}

function collapse(title,body){
  const d=el("details");d.append(el("summary",{},title));d.append(el("div",{className:"body"},body));return d;
}

const txtCol=(rows,k)=>rows.map(x=>txt(x[k])).filter(Boolean);
/* The one-line summary on a done Overview card. Prefers the set shape when the sets
   actually disagree — "100 → 80 → 80" says set 1 was wrong — over the flat fields, which
   are the headline once they agree. Returns "" when there is genuinely nothing, and the
   caller words that: an exercise finished with nothing logged is a legitimate warm-up,
   not an error. */
function summaryText(e){
  const b=[];
  const sets=Array.isArray(e.sets)?e.sets:[];
  const loads=txtCol(sets,"load");
  if(loads.length>1&&new Set(loads).size>1)b.push(loads.join(" → "));
  else if(txt(e.load))b.push(txt(e.load));
  else if(loads.length)b.push(loads[0]+(loads.length>1?` ×${loads.length}`:""));

  if(txt(e.reps))b.push(txt(e.reps));
  else if(txtCol(sets,"reps").length)b.push(txtCol(sets,"reps").join("/"));

  const rpe=txt(e.rpe)||txtCol(sets,"rpe").slice(-1)[0];
  if(rpe)b.push("RPE "+rpe);

  if(SETTINGS.painPerExercise){
    const pain=txt(e.painDuring)||txtCol(sets,"painDuring").sort().slice(-1)[0];
    if(pain)b.push(painLbl().toLowerCase()+" "+pain+"/10");
  }
  return b.join(" · ");
}
/* What this exercise's card says about itself. There is always a line — an absent one
   used to mean "untouched", which is indistinguishable from "the status didn't render",
   and it left a typed-but-uncommitted set completely invisible outside the editor. That
   silence is the likeliest cause of "I did that set and Overview shows nothing". */
function statusLine(ex,e){
  const st=entryState(e),n=(e.sets||[]).length;
  /* No tick in the text either — the badge beside it carries that, and the line is better
     spent on what was actually logged. */
  if(st==="done")return summaryText(e)||"Skipped — no sets logged";
  if(st==="todo")return "Not started";
  const spec=circuitOf(ex);
  if(spec){
    const c=circuitState(e,ex),rounds=Math.max(Number(c.rounds)||0,n);
    if(c.mode==="final")return summaryText(e)||"Result in progress";
    if(rounds)return spec.target?`${rounds} of ${spec.target} rounds completed`:
      `${rounds} round${rounds===1?"":"s"} completed`;
    return "Round in progress — not logged yet";
  }
  if(!n)return `Set 1 typed — not logged yet`;
  return `${n} of ${targetSets(ex,e)} sets logged`
    +(draftDirty(e)?` · set ${n+1} in progress`:"");
}
const STATE_BADGE={done:"✓",part:"◐",todo:"○"};

/* ---------- Overview card (read-only) ----------
   Zero inputs — the whole point of splitting this out of the old all-in-one card. Tap
   anywhere on it to open the exercise in Log view. */
function overviewCard(ex,s,idx){
  const e=s.entries[ex.id]||(s.entries[ex.id]=blankEntry());
  normalizeEntry(e);
  const cat=catOf(ex);
  const st=entryState(e),line=statusLine(ex,e);
  const c=el("div",{className:"card ov"+(e.done?" done":""),
    attrs:{role:"button",tabindex:"0","aria-label":`Open ${ex.name} in Log view — ${line}`}});
  if(cat)c.style.setProperty("--cat",cat.color);
  c.append(el("span",{className:"rail"}));
  const body=el("div",{className:"grow"});
  body.append(...exerciseHead(ex));
  body.append(el("div",{className:"ov-status",attrs:{"data-state":st}},line));
  /* One glyph, right-aligned down the column, so the whole session's state reads in one
     vertical scan rather than by parsing six sentences. */
  c.append(el("div",{className:"ov-row"},[body,
    el("span",{className:"ov-badge",attrs:{"data-state":st,"aria-hidden":"true"}},
      STATE_BADGE[st])]));
  const open=()=>{STATE.setEdit=null;STATE.focus=idx;setView("focus");};
  c.onclick=open;
  c.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();open();}};
  return c;
}

/* One committed set, in as few characters as it can be said in: "60×4", or whichever of
   the two exists. Used for the recap strip and for the toast that confirms a commit. */
function setRecap(r,unit){
  const load=txt(r.load),reps=withUnit(txt(r.reps),unit),rpe=txt(r.rpe);
  if(load&&reps)return load+"×"+reps;
  return load||reps||(rpe?"RPE "+rpe:"")||"✓";
}
/* Is there a pain reading anywhere on this entry? "0" counts — a logged zero is a real
   reading and the whole point of asking. */
function painLogged(e){
  return !!(txt(e.painDuring)||txtCol(Array.isArray(e.sets)?e.sets:[],"painDuring").length);
}
/* Which chip to pulse, and which set's note was opened by hand. Both are "what happened
   a moment ago" rather than state — in memory, consumed by the next redraw. */
let JUST=null,NOTE_OPEN=null;

function advanceFrom(ex,e,s,idx,onchange,message){
  const addAnother=()=>{const latest=getSession(),current=latest.entries[ex.id]||(latest.entries[ex.id]=blankEntry());
    current.done=false;current.setTarget=Math.min(12,Math.max(targetSets(ex,current)+1,current.sets.length+1));
    STATE.focus=idx;STATE.setEdit=null;saveSession(latest);renderMain();scrollTop();};
  if(viewMode()==="focus"&&idx===STATE.focus&&idx<dayExercises().length-1){
    STATE.focus=idx+1;STATE.setEdit=null;renderMain();scrollTop();
  }else onchange("");
  const nudge=painAsked(ex)&&!painLogged(e)?` · no ${painLbl().toLowerCase()} logged`:"";
  toast((message||"Exercise complete")+nudge,{label:"Add set",onclick:addAnother});
}

function openAdjustSets(ex,e,s,onchange){
  const prescribed=prescribedSets(ex),floor=Math.max(e.sets.length+1,1);
  const wrap=el("div"),box=el("div",{className:"adjustbox"});
  const minus=el("button",{attrs:{"aria-label":"Plan one set fewer"}},"−");
  const plus=el("button",{attrs:{"aria-label":"Plan one set more"}},"+");
  const value=el("div",{className:"adjustvalue"});
  const paint=()=>{const n=targetSets(ex,e);value.innerHTML="";
    value.append(el("strong",{className:"tnum"},`${n} set${n===1?"":"s"}`),
      el("span",{},`${prescribed} prescribed`));minus.disabled=n<=floor;plus.disabled=n>=12;};
  minus.onclick=()=>{e.setTarget=Math.max(floor,targetSets(ex,e)-1);saveSession(s);paint();};
  plus.onclick=()=>{e.setTarget=Math.min(12,targetSets(ex,e)+1);saveSession(s);paint();};
  box.append(minus,value,plus);paint();wrap.append(box,
    el("div",{className:"sheet-copy",style:"margin-top:12px"},
      "This changes today's plan only. The original prescription stays in the exported log."));
  sheetOpen("Adjust planned sets",`Set ${e.sets.length+1} is next.`,wrap,()=>onchange(""));
}

function confirmEndExercise(ex,e,s,idx,onchange,metric){
  const spec=circuitOf(ex);
  const before=e.sets.length+(draftDirty(e)?1:0),target=targetSets(ex,e);
  const none=spec?!circuitHasData(e):before===0,title=none?"Skip this exercise?":spec?"End this circuit?":"End this exercise?";
  const copy=none?"No work will be recorded. The exercise will remain visible as skipped in the session.":spec?
    "Everything logged so far will be kept. The original workout remains unchanged.":
    `${before} of ${target} planned sets will be recorded. Your original prescription is not changed.`;
  const primary=none?"Skip exercise":spec?"End circuit":`End after ${before} set${before===1?"":"s"}`;
  const body=el("div");body.append(sheetActions(primary,()=>{
    if(spec&&circuitState(e,ex).mode==="details")commitCircuitRound(e);
    else if(!spec)commitDraftIfDirty(e,metric.unit);
    e.done=true;if(spec){if(circuitState(e,ex).mode==="final")syncFinalCircuit(ex,e);else syncCircuitSummary(e);}saveSession(s);
    if(viewMode()==="focus"&&idx===STATE.focus&&idx<dayExercises().length-1){
      STATE.focus=idx+1;STATE.setEdit=null;renderMain();scrollTop();
    }else onchange("");
    toast(none?"Exercise skipped":spec?"Circuit ended":`Exercise ended after ${e.sets.length} set${e.sets.length===1?"":"s"}`);
  },"Keep logging"));
  sheetOpen(title,copy,body);
}

/* ---------- the set editor (Log view) ----------
   Always exactly one set's fields on screen: the draft (the next new set) or, while
   STATE.setEdit names a committed row, that row instead. Every oninput here writes
   straight into the row/draft and autosaves — nothing here may rebuild a container an
   input lives in; only a button tap (commit / save / cancel / delete / finish / add-note)
   may call `onchange`, which redraws and — since it follows a tap, not a keystroke — is
   free to focus a field so the keyboard never has to be reopened by hand. */
function buildSetEditor(host,ex,e,s,idx,onchange,focusOn){
  const rows=e.sets;
  const target=targetSets(ex,e);
  const metric=metricOf(ex);
  const asked=painAsked(ex);
  if(e.done){
    if(rows.length)host.append(el("div",{className:"setrecap"},[
      el("span",{className:"rl"},"Completed"),
      el("span",{className:"rv tnum"},rows.map(r=>setRecap(r,metric.unit)).join(" · "))]));
    else host.append(el("div",{className:"setlabel"},"Exercise skipped — no sets logged"));
    const actions=el("div",{className:"setactions mainrow"});
    const reopen=el("button",{className:"ghost"},"Reopen exercise");
    reopen.onclick=()=>{e.done=false;saveSession(s);onchange("");};
    const add=el("button",{className:"primary"},"Add another set");
    add.onclick=()=>{e.done=false;e.setTarget=Math.min(12,Math.max(target+1,rows.length+1));saveSession(s);onchange("");};
    actions.append(reopen,add);host.append(actions);return;
  }
  const editIdx=(STATE.setEdit!=null&&STATE.setEdit>=0&&STATE.setEdit<rows.length)?STATE.setEdit:null;
  const draftMode=editIdx===null;
  const curPos=draftMode?rows.length:editIdx;
  const curNum=curPos+1;
  const total=Math.max(target,curNum,rows.length+(draftMode?1:0));

  /* What has actually gone in, spelled out. Committing used to change almost nothing on
     screen — the next draft is seeded from the set just logged, so the fields read the
     same — which is why it never felt like anything had been recorded. */
  if(rows.length){
    host.append(el("div",{className:"setrecap"},[
      el("span",{className:"rl"},"Logged"),
      el("span",{className:"rv tnum"},rows.map(r=>setRecap(r,metric.unit)).join(" · "))]));
  }

  const just=(JUST&&JUST.id===ex.id)?JUST.n:0;
  JUST=null;
  const chips=el("div",{className:"setchips"});
  for(let i=0;i<total;i++){
    if(i<rows.length){
      /* A logged set: tap to edit it (Save/Cancel/Delete live in the field group below). */
      const chip=el("button",{className:"setchip"+(i+1===just?" just":""),
        attrs:{"data-state":i===editIdx?"current":"done",
          "aria-label":`Set ${i+1} — ${setRecap(rows[i],metric.unit)}. Tap to edit.`}},String(i+1));
      chip.onclick=()=>{STATE.setEdit=(i===editIdx)?null:i;onchange();};
      chips.append(chip);
    }else if(i===curPos){
      /* The slot being typed into. Inert — you are already here. */
      chips.append(el("span",{className:"setchip",
        attrs:{"data-state":"current","aria-label":"Set "+(i+1)+", in progress"}},String(i+1)));
    }else{
      /* An upcoming slot is a plan, not a destination and not a delete button. It used to
         be a live button that dropped the set on one unconfirmed tap, which read as
         "jump to set 4" — so it is a plain placeholder now, and the count is changed in
         the secondary Adjust sets sheet, where it cannot be hit by accident. */
      chips.append(el("span",{className:"setchip",
        attrs:{"data-state":"todo","aria-hidden":"true"}},String(i+1)));
    }
  }
  /* A strip holding one chip says nothing that "Set 1 of 1" doesn't, and it costs 40px of
     height on every warm-up and every AMRAP row — which is what pushes the primary action
     off a 320px screen. */
  if(total>1)host.append(chips);

  const labelRow=el("div",{className:"setlabelrow"});
  labelRow.append(el("div",{className:"setlabel"},`Set ${curNum} of ${total}`));
  host.append(labelRow);

  const data=draftMode?e.draft:rows[editIdx];
  const grid=el("div",{className:"setgrid"+(SETTINGS.painPerExercise?"":" nopain")});
  const commonAttrs={autocapitalize:"off",autocorrect:"off",spellcheck:"false"};
  const onFieldInput=()=>{
    /* A draft the athlete has typed into is a set that happened — flag it so ending early and
       every navigation commit it rather than throwing it away. */
    if(draftMode)e.draft.dirty=true;
    else applyDerivedSummary(e,metric.unit);
    saveSession(s);
  };
  const loadInp=el("input",{type:"text",value:data.load??"",
    attrs:{placeholder:"kg",inputmode:"decimal","aria-label":"Load",...commonAttrs}});
  loadInp.oninput=()=>{data.load=loadInp.value;onFieldInput();};
  grid.append(field("Load",loadInp));
  /* Not inputmode="numeric": that is a digits-only keypad on iOS, and two prescriptions
     in five here are a duration, a distance or prose. metricOf() decides what this field
     is called, what unit it carries and which keyboard it opens. */
  const repsInp=el("input",{type:"text",value:data.reps??"",
    attrs:{placeholder:metric.placeholder,inputmode:metric.inputmode,
      "aria-label":metric.label+(ex.reps?", prescribed "+txt(ex.reps):""),
      autocapitalize:metric.autocap,autocorrect:"off",spellcheck:"false"}});
  repsInp.oninput=()=>{data.reps=repsInp.value;onFieldInput();};
  grid.append(field(metric.fieldLabel,repsInp));
  /* text + inputmode, not type=number: a number input reports "" while the value is an
     incomplete float like "7.", so the autosaved RPE would flicker to blank mid-type.
     This is also what lets RPE hold a half point ("7.5") — see CLAUDE.md. */
  const rpeInp=rpeButton(data.rpe,ex.rpe,v=>{data.rpe=v;onFieldInput();onchange("");});
  grid.append(field("RPE",rpeInp));
  if(SETTINGS.painPerExercise){
    const painInp=el("input",{type:"number",value:data.painDuring??"",
      attrs:{min:0,max:10,placeholder:"0",
        "aria-label":painLbl()+(asked?" — this exercise asks for it":"")}});
    painInp.oninput=()=>{data.painDuring=painInp.value;onFieldInput();};
    /* Accented, never hidden: the field exists on every exercise so an empty value stays
       readable as "no pain", and `tracking.painPerExercise` keeps meaning what it says. */
    grid.append(field(painLbl(),painInp,"/10",asked?"asked":""));
  }
  host.append(grid);

  const noteOpen=!!txt(data.note)||
    !!(NOTE_OPEN&&NOTE_OPEN.id===ex.id&&NOTE_OPEN.n===curNum&&NOTE_OPEN.edit===!draftMode);
  if(noteOpen){
    const note=el("input",{type:"text",value:data.note||"",
      attrs:{placeholder:`Set ${curNum} note…`,"aria-label":`Set ${curNum} note`}});
    /* Through onFieldInput, so a note-only set ("felt the knee on rep 3") is dirty too and
       gets committed rather than dropped when the exercise ends. */
    note.oninput=()=>{data.note=note.value;onFieldInput();};
    host.append(el("div",{className:"setnoteinp"},note));
    if(focusOn==="note"&&note.focus)note.focus();
  }else{
    /* Most sets have no note, and an always-present empty field pushed the primary action
       down a row for nothing. */
    const add=el("button",{className:"ghost mini addnote"},"+ note");
    add.onclick=()=>{NOTE_OPEN={id:ex.id,n:curNum,edit:!draftMode};onchange("note");};
    host.append(el("div",{className:"setnoteinp"},add));
  }

  /* Two rows, and neither wraps: one unmistakable primary action, and the quieter things
     beneath it at equal width. The main set action remains the obvious next tap. */
  const mainrow=el("div",{className:"setactions mainrow"});
  const subrow=el("div",{className:"setactions subrow"});
  if(!draftMode){
    const save=el("button",{className:"primary"},`Save set ${curNum}`);
    save.onclick=()=>{STATE.setEdit=null;saveSession(s);onchange();};
    const cancel=el("button",{className:"ghost"},"Cancel");
    cancel.onclick=()=>{STATE.setEdit=null;onchange();};
    const del=el("button",{className:"ghost danger"},"Delete set");
    let armed=false;
    del.onclick=()=>{
      if(!armed){armed=true;del.textContent="Tap again to delete";del.classList.add("armed");
        setTimeout(()=>{armed=false;},4000);return;}
      deleteSet(e,editIdx,metric.unit);STATE.setEdit=null;saveSession(s);onchange();
    };
    mainrow.append(save);
    subrow.append(cancel,del);
  }else{
    const finalPlanned=rows.length===target-1;
    const commit=el("button",{className:"primary"},finalPlanned?"Log final set":
      (rows.length<target?`Log set ${curNum} of ${target}`:"Log another set"));
    commit.onclick=()=>{
      /* Silence used to be the answer here, which is indistinguishable from a dead app. */
      if(!commitSet(e,metric.unit)){toast("Nothing to log yet — add a load, "+
        metric.label.toLowerCase()+" or RPE");return;}
      const n=e.sets.length;
      saveSession(s);
      JUST={id:ex.id,n};
      if(navigator.vibrate)try{navigator.vibrate(12);}catch(err){}
      if(finalPlanned){e.done=true;saveSession(s);
        advanceFrom(ex,e,s,idx,onchange,`Exercise complete · ${n} sets logged`);}
      else{toast(`Set ${n} logged · ${setRecap(e.sets[n-1],metric.unit)}`);onchange();}
    };
    mainrow.append(commit);
  }
  host.append(mainrow,subrow);

  if(draftMode){const secondary=el("div",{className:"setsecondary"});
    const adjust=el("button",{className:"quietaction"},"Adjust sets");
    adjust.onclick=()=>openAdjustSets(ex,e,s,onchange);
    const n=rows.length+(draftDirty(e)?1:0);
    const end=el("button",{className:"quietaction"},n?`End after ${n} of ${target}`:"Skip exercise");
    end.onclick=()=>confirmEndExercise(ex,e,s,idx,onchange,metric);
    secondary.append(adjust,end);host.append(secondary);}

}

/* ---------- Summary & notes (collapsed, inside Log view) ----------
   The flat load/reps/RPE/pain fields, auto-filled from the sets and editable — editing
   one here is a deliberate override and stops it following future sets (summaryAuto).
   Kept collapsed: the athlete never has to open it, but it is theirs to correct. */
function buildSummaryPanel(host,ex,e,s){
  host.innerHTML="";
  const wrap=el("div",{className:"log tight"+(SETTINGS.painPerExercise?"":" nopain")});
  const mk=(k,label,type,attrs,unit)=>{
    const inp=el("input",{type,value:e[k]??"",attrs});
    inp.oninput=()=>{e[k]=inp.value;e.summaryAuto=false;saveSession(s);};
    return {inp,node:field(label,inp,unit)};
  };
  const metric=metricOf(ex);
  const load=mk("load","Load","text",{placeholder:"90"},"kg");
  /* Named for what this exercise measures, like the per-set field — "Sets × reps" over a
     value of "3x45s" was its own small lie. */
  const reps=mk("reps",metric.label==="Result"?"Result":"Sets × "+metric.label.toLowerCase(),
    "text",{placeholder:"4×"+metric.placeholder});
  const rpeBtn=rpeButton(e.rpe,ex.rpe,v=>{e.rpe=v;e.summaryAuto=false;saveSession(s);buildSummaryPanel(host,ex,e,s);},"Summary RPE");
  const rpe={inp:rpeBtn,node:field("RPE",rpeBtn)};
  wrap.append(load.node,reps.node,rpe.node);
  let pain=null;
  if(SETTINGS.painPerExercise){
    pain=mk("painDuring",painLbl(),"number",{min:0,max:10,placeholder:"0"},"/10");
    wrap.append(pain.node);
  }
  host.append(wrap);
  const nt=el("textarea",{value:e.notes||"",attrs:{placeholder:"Notes…"}});
  nt.oninput=()=>{e.notes=nt.value;saveSession(s);};
  host.append(el("div",{className:"full"},[el("label",{className:"lbl"},"Notes"),nt]));
  host._refresh=()=>{
    load.inp.value=e.load??"";reps.inp.value=e.reps??"";
    rpe.inp._setValue(e.rpe);
    if(pain)pain.inp.value=e.painDuring??"";
  };
}

/* The programme's own list of what matters for this movement, one chip per instruction
   instead of a single line of prose the eye slides off. Parenthetical asides move to the
   title so a chip stays one short phrase; the pain-relevant ones are marked, which is the
   same cue that accents the pain field. */
function hintChips(hints){
  const wrap=el("div",{className:"hintchips"});
  wrap.append(el("span",{className:"hl"},"Capture"));
  hints.forEach(h=>{
    const short=h.replace(/\s*\([^)]*\)\s*/g," ").trim()||h;
    wrap.append(el("span",{className:"hchip"+(PAIN_CUES.test(h)?" pain":""),
      attrs:{title:h}},short));
  });
  return wrap;
}

function circuitPlan(ex,spec){
  const box=el("div",{className:"circuitplan"});
  box.append(el("div",{className:"cp-title"},spec.kind==="rounds"?spec.label+" · each round":spec.label+" · workout"));
  const parts=circuitParts(ex);(parts.length?parts:[txt(ex.reps)]).forEach((p,i)=>
    box.append(el("div",{className:"circuitpart"},[
      el("span",{className:"cpn"},String(i+1)),el("span",{},p)])));
  if(ex.load)box.append(el("div",{className:"circuitload"},"Equipment / load · "+ex.load));
  return box;
}

function clearCircuitLog(e,mode){
  e.done=false;e.load="";e.reps="";e.rpe="";e.painDuring="";e.notes="";e.sets=[];
  e.draft=blankDraft();e.summaryAuto=true;e.setTarget=null;e.circuit={...blankCircuit(),mode};
}
function openCircuitModeSheet(ex,e,s,onchange){
  const c=circuitState(e,ex),wrap=el("div",{className:"modechoices"});
  const options=[
    ["quick","Quick rounds","One large tap records each completed round. Finish details are collected once at the end."],
    ["details","Round details","Record a time, split, RPE or changed load for each round."],
    ["final","Final result","Skip live round tracking and record only the completed result."]];
  options.forEach(([mode,name,desc])=>{const b=el("button",{className:"modechoice",
      attrs:{"aria-pressed":String(c.mode===mode)}},[el("strong",{},name),el("span",{},desc)]);
    b.onclick=()=>{
      if(mode===c.mode){sheetClose();return;}
      if(!circuitHasData(e)){c.mode=mode;saveSession(s);sheetClose();onchange("");return;}
      sheetClose();const confirm=el("div");
      confirm.append(sheetActions("Reset and change",()=>{clearCircuitLog(e,mode);saveSession(s);onchange("");},"Keep current log"));
      sheetOpen("Start this circuit over?","Changing mode after logging has started resets this exercise only. Nothing changes unless you confirm.",confirm);
    };wrap.append(b);});
  sheetOpen("Choose how to log",`Recommended here: ${circuitModeName(circuitOf(ex).defaultMode)}.`,wrap);
}

function circuitModeLine(ex,e,s,onchange){
  const c=circuitState(e,ex),line=el("div",{className:"modeline"});
  line.append(el("div",{},[el("div",{className:"modehint"},"Logging mode"),
    el("strong",{},circuitModeName(c.mode))]));
  const change=el("button",{className:"quietaction"},circuitHasData(e)?"Change / reset ›":"Change ›");
  change.onclick=()=>openCircuitModeSheet(ex,e,s,onchange);line.append(change);return line;
}

function syncCircuitSummary(e){
  const c=e.circuit||blankCircuit(),rows=e.sets||[],n=Math.max(Number(c.rounds)||0,rows.length);
  if(rows.length){
    e.load=pickMode(rows.map(r=>txt(r.load)).filter(Boolean))||txt(c.load);
    e.rpe=pickMax(rows.map(r=>txt(r.rpe)).filter(Boolean))||txt(e.rpe);
    e.painDuring=pickMax(rows.map(r=>txt(r.painDuring)).filter(Boolean))||txt(e.painDuring);
  }else if(c.load)e.load=txt(c.load);
  const count=n?`${n} round${n===1?"":"s"}`:"";
  const extra=txt(c.extra)?` + ${txt(c.extra)} reps`:"";
  const time=txt(c.time)?` · ${txt(c.time)}`:"";
  const result=txt(c.result)?` · ${txt(c.result)}`:"";
  const mins=txt(c.minutes)?`${txt(c.minutes)} min completed`:"";
  e.reps=mins||((count||extra||time||result)?count+extra+time+result:e.reps);
}

function finishCircuit(ex,e,s,idx,onchange,message){
  e.done=true;
  if(circuitState(e,ex).mode==="final")syncFinalCircuit(ex,e);
  else syncCircuitSummary(e);
  saveSession(s);
  if(viewMode()==="focus"&&idx===STATE.focus&&idx<dayExercises().length-1){
    STATE.focus=idx+1;STATE.setEdit=null;renderMain();scrollTop();
  }else onchange("");
  toast(message||"Circuit complete");
}

function openCircuitFinish(ex,e,s,idx,onchange){
  const c=circuitState(e,ex),spec=circuitOf(ex),wrap=el("div");
  const grid=el("div",{className:"circuitresult"});
  const time=el("input",{type:"text",value:c.time,attrs:{placeholder:"e.g. 12:34",
    inputmode:"text","aria-label":"Final time or result"}});
  time.oninput=()=>{c.time=time.value;c.touched=true;syncCircuitSummary(e);saveSession(s);};
  grid.append(field(/for\s+time/i.test(txt(ex.sets))?"Finish time":"Time / result",time));
  const rpe=rpeButton(e.rpe,ex.rpe,v=>{e.rpe=v;c.touched=true;saveSession(s);openCircuitFinish(ex,e,s,idx,onchange);},"Final RPE");
  grid.append(field("Final RPE",rpe));
  if(SETTINGS.painPerExercise){const pain=el("input",{type:"number",value:e.painDuring,
      attrs:{min:0,max:10,placeholder:"0","aria-label":painLbl()}});
    pain.oninput=()=>{e.painDuring=pain.value;c.touched=true;saveSession(s);};
    grid.append(field(painLbl(),pain,"/10",painAsked(ex)?"asked":""));}
  const note=el("input",{type:"text",value:c.note,attrs:{placeholder:"Optional finish note"}});
  note.oninput=()=>{c.note=note.value;e.notes=txt(note.value);c.touched=true;saveSession(s);};
  grid.append(el("div",{className:"full"},field("Note",note)));
  const actions=sheetActions("Save & next",()=>finishCircuit(ex,e,s,idx,onchange,
    `${spec.kind==="rounds"?c.rounds+" rounds":"Circuit"} logged`),"Skip details");
  wrap.append(grid,actions);
  /* Skip details still means finish; it is a valid quick-count path, not Cancel. */
  const skip=actions.children[0];
  if(skip)skip.onclick=()=>{sheetClose();finishCircuit(ex,e,s,idx,onchange,"Circuit complete");};
  sheetOpen("Finish circuit",`${c.rounds||e.sets.length} round${(c.rounds||e.sets.length)===1?"":"s"} completed. Add only what is useful.`,wrap);
}

function buildQuickCircuit(host,ex,e,s,idx,onchange){
  const c=circuitState(e,ex),spec=circuitOf(ex),n=Math.max(c.rounds,e.sets.length);
  const target=spec.target||Math.max(n+1,1),chips=el("div",{className:"setchips"});
  const total=spec.target?Math.max(spec.target,n+1):Math.max(n+1,1);
  for(let i=0;i<total;i++)chips.append(el("span",{className:"setchip",attrs:{"data-state":i<n?"done":i===n?"current":"todo"}},String(i+1)));
  if(total>1)host.append(chips);
  host.append(el("div",{className:"setlabel"},spec.target&&n<target?`Round ${n+1} of ${target}`:
    spec.target?`${n} rounds completed · ${target} prescribed`:`${n} round${n===1?"":"s"} completed`));
  const done=el("button",{className:"primary circuit-primary"},spec.target&&n<target?
    (n===target-1?"Complete final round":`Complete round ${n+1} of ${target}`):"Complete another round");
  done.onclick=()=>{const row={set:e.sets.length+1,load:"",reps:"As prescribed",rpe:"",painDuring:"",note:""};
    e.sets.push(row);c.rounds=e.sets.length;c.touched=true;syncCircuitSummary(e);saveSession(s);
    if(navigator.vibrate)try{navigator.vibrate(12);}catch(err){}
    if(spec.target&&c.rounds>=spec.target){onchange("");openCircuitFinish(ex,e,s,idx,onchange);}
    else{toast(`Round ${c.rounds} logged`);onchange("");}};
  host.append(done);
  if(n){const end=el("button",{className:"quietaction",style:"width:100%;margin-top:8px"},"Finish circuit now");
    end.onclick=()=>openCircuitFinish(ex,e,s,idx,onchange);host.append(end);}
}

function circuitResultLabel(ex){const h=txt(ex.logHint);
  return /split/i.test(h)?"Time / split":/time/i.test(h)?"Round time":"Round result";}

function buildDetailedCircuit(host,ex,e,s,idx,onchange){
  const c=circuitState(e,ex),spec=circuitOf(ex),rows=e.sets;
  const edit=(STATE.setEdit!=null&&STATE.setEdit<rows.length)?STATE.setEdit:null;
  const cur=edit==null?rows.length:edit,data=edit==null?e.draft:rows[edit];
  const target=spec.target||Math.max(rows.length+1,1),chips=el("div",{className:"setchips"});
  for(let i=0;i<Math.max(target,rows.length+1);i++){
    if(i<rows.length){const b=el("button",{className:"setchip",attrs:{"data-state":i===edit?"current":"done","aria-label":`Round ${i+1}, tap to edit`}},String(i+1));
      b.onclick=()=>{STATE.setEdit=i;onchange("");};chips.append(b);}
    else chips.append(el("span",{className:"setchip",attrs:{"data-state":i===rows.length?"current":"todo"}},String(i+1)));
  }
  if(Math.max(target,rows.length+1)>1)host.append(chips);
  const roundLabel=edit!=null?`Edit round ${cur+1}${spec.target?` of ${target}`:""}`:
    spec.target&&rows.length>=target?`${rows.length} rounds completed · ${target} prescribed`:
    `Round ${cur+1}${spec.target?` of ${target}`:""}`;
  host.append(el("div",{className:"setlabel"},roundLabel));
  const grid=el("div",{className:"circuitresult"});
  const changed=()=>{if(edit==null)e.draft.dirty=true;else syncCircuitSummary(e);saveSession(s);};
  const result=el("input",{type:"text",value:data.reps,attrs:{placeholder:"e.g. 1:42 or as prescribed"}});
  result.oninput=()=>{data.reps=result.value;changed();};
  grid.append(field(circuitResultLabel(ex),result));
  const rpe=rpeButton(data.rpe,ex.rpe,v=>{data.rpe=v;changed();onchange("");});
  grid.append(field("RPE",rpe));
  const load=el("input",{type:"text",value:data.load,attrs:{placeholder:"Only if changed"}});
  load.oninput=()=>{data.load=load.value;changed();};
  grid.append(field("Changed load",load));
  if(SETTINGS.painPerExercise){const pain=el("input",{type:"number",value:data.painDuring,
      attrs:{min:0,max:10,placeholder:"0"}});pain.oninput=()=>{data.painDuring=pain.value;changed();};
    grid.append(field(painLbl(),pain,"/10",painAsked(ex)?"asked":""));}
  const note=el("input",{type:"text",value:data.note,attrs:{placeholder:"Optional round note"}});
  note.oninput=()=>{data.note=note.value;changed();};grid.append(el("div",{className:"full"},field("Note",note)));
  host.append(grid);
  const actions=el("div",{className:"setactions mainrow"});
  if(edit!=null){const save=el("button",{className:"primary"},`Save round ${cur+1}`);save.onclick=()=>{STATE.setEdit=null;syncCircuitSummary(e);saveSession(s);onchange("");};
    const del=el("button",{className:"ghost danger"},"Delete round");let armed=false;
    del.onclick=()=>{if(!armed){armed=true;del.textContent="Tap again to delete";del.classList.add("armed");
        setTimeout(()=>{armed=false;},4000);return;}
      e.sets.splice(edit,1);renumber(e);c.rounds=e.sets.length;STATE.setEdit=null;syncCircuitSummary(e);saveSession(s);onchange("");};
    actions.append(save,del);
  }else{const final=!!spec.target&&rows.length===spec.target-1;
    const log=el("button",{className:"primary"},final?"Log final round":
      spec.target&&rows.length>=target?"Log another round":`Log round ${rows.length+1}`);
    log.onclick=()=>{e.draft.dirty=!draftEmpty(e.draft);
      if(!commitCircuitRound(e)){/* A round tap itself confirms prescribed work. */
        e.draft.reps="As prescribed";e.draft.dirty=true;commitCircuitRound(e);}
      saveSession(s);
      if(final){onchange("");openCircuitFinish(ex,e,s,idx,onchange);}
      else{toast(`Round ${rows.length} logged`);onchange("");}};
    actions.append(log);
  }host.append(actions);
  if(edit==null&&rows.length){const finish=el("button",{className:"quietaction",style:"width:100%;margin-top:8px"},"Finish circuit now");
    finish.onclick=()=>openCircuitFinish(ex,e,s,idx,onchange);host.append(finish);}
}

function syncFinalCircuit(ex,e){
  const c=circuitState(e,ex),spec=circuitOf(ex),n=txt(c.rounds),extra=txt(c.extra),time=txt(c.time),result=txt(c.result);
  if(spec.kind==="amrap")e.reps=n?`${n} round${n==="1"?"":"s"}${extra?` + ${extra} reps`:""}`:result;
  else if(spec.kind==="emom")e.reps=txt(c.minutes)?`${txt(c.minutes)} min completed${result?` · ${result}`:""}`:result;
  else if(spec.kind==="rounds")e.reps=n?`${n} round${n==="1"?"":"s"}${time?` · ${time}`:""}`:time||result;
  else e.reps=time?`Time ${time}${result?` · ${result}`:""}`:result;
  e.load=txt(c.load);e.notes=txt(c.note);
}

function buildFinalCircuit(host,ex,e,s,idx,onchange){
  const c=circuitState(e,ex),spec=circuitOf(ex),grid=el("div",{className:"circuitresult"});
