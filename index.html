/* ---------- exercise categories ----------
   Colour for an exercise's left rail. Resolution order:
     1. an explicit `category` on the exercise (tp-program-1 optional field)
     2. a keyword guess from the exercise name
     3. nothing — neutral rail (never assert a category we don't have)
   Colours are CSS variables, not hex: each theme picks rail colours from its own
   palette, so a category keeps its *slot* across themes rather than its exact hue.
   The rail alone carries the category — no per-card tag chip. */
/* `key` is carried through by catOf() so a caller can ask which slot resolved without
   string-matching the display label — painAsked() treats tendon work as pain-relevant
   even when the generator wrote no logHint. */
const CATS={
  warmup:  {key:"warmup",   label:"Warm-up",       color:"var(--cat-warm)"},
  tendon:  {key:"tendon",   label:"Tendon/prehab", color:"var(--cat-tendon)"},
  skill:   {key:"skill",    label:"Skill",         color:"var(--cat-skill)"},
  strength:{key:"strength", label:"Strength",      color:"var(--cat-strength)"},
  cond:    {key:"cond",     label:"Conditioning",  color:"var(--cat-cond)"},
  accessory:{key:"accessory",label:"Accessory",    color:"var(--cat-accessory)"},
  cooldown:{key:"cooldown", label:"Cool-down",     color:"var(--cat-warm)"}
};
/* Aliases so a generator can say "conditioning", "metcon", "prehab" etc. */
const CAT_ALIASES={metcon:"cond",conditioning:"cond",aerobic:"cond",cardio:"cond",
  prehab:"tendon",rehab:"tendon",tendon:"tendon",isometric:"tendon",
  warmup:"warmup","warm-up":"warmup",prep:"warmup",
  cooldown:"cooldown","cool-down":"cooldown",mobility:"cooldown",
  skill:"skill",technique:"skill",olympic:"skill",
  strength:"strength",lift:"strength",main:"strength",
  accessory:"accessory",auxiliary:"accessory",core:"accessory"};
/* Ordered — skill lifts must win before the EMOM/interval rule, because
   "Hang power clean (EMOM every 90s)" is skill work, not conditioning. */
const CAT_RULES=[
  [/warm-?up|cool-?down|prep\b|mobility/i,                               "warmup"],
  [/isometric|spanish squat|nordic|copenhagen|tibialis|prehab|neck iso/i, "tendon"],
  [/clean|snatch|jerk|muscle-?up|skill|high pull/i,                       "skill"],
  [/metcon|emom|amrap|for time|interval|erg\b|bike|\bski\b|sled|couplet/i,"cond"],
  [/squat|deadlift|rdl|press|bench|\brow\b|pull-?up|\bchin|\bdip|hinge/i, "strength"]
];
/* Unknown declared categories still get a stable colour rather than falling back to
   grey, so a generator can invent its own vocabulary and the UI keeps working. Drawn
   from the active theme's rail colours so an invented category can't import a hue the
   palette doesn't contain. */
const SPARE_COLORS=["var(--cat-skill)","var(--cat-strength)","var(--cat-cond)",
  "var(--cat-accessory)","var(--cat-tendon)","var(--cat-warm)"];
function spareColor(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return SPARE_COLORS[h%SPARE_COLORS.length];}

function catOf(ex){
  const declared=(ex.category||"").toString().trim();
  if(declared){
    const k=declared.toLowerCase().replace(/[\s_]+/g,"-");
    const hit=CATS[k]||CATS[CAT_ALIASES[k]]||CATS[CAT_ALIASES[k.replace(/-/g,"")]];
    if(hit)return {...hit,source:"declared"};
    return {label:declared,color:spareColor(k),source:"declared"};
  }
  for(const[re,key]of CAT_RULES)
    if(re.test(ex.name||""))return {...CATS[key],source:"guessed"};
  return null;                                  /* no tag, neutral rail */
}

/* ---------- program loading ----------
   Two programme schemas are live at once, on purpose:
     tp-program-1  Week 1 only; later weeks described in prose in `progression`.
     tp-program-2  every week authored as its own rows.
   A phone can be mid-block on a v1 programme in localStorage, so v1 must keep
   working indefinitely — this is the one place the difference is decided, and
   everything else asks dayExercises(). See docs/data-contracts.md. */
function isV2(){return !!(PROGRAM&&PROGRAM.meta&&PROGRAM.meta.schema==="tp-program-2");}
/* The exercises on screen right now. v2 filters by day AND week; v1 by day only,
   because under v1 every row is week 1 and filtering on week would empty the list. */
function dayExercises(){
  if(!PROGRAM||!Array.isArray(PROGRAM.exercises))return [];
  return PROGRAM.exercises.filter(e=>
    e.day===STATE.day && (!isV2() || Number(e.week)===Number(STATE.week)));
}
/* A v2 row whose `week` isn't a number matches no week at all, so the exercise would
   vanish from the whole block and the athlete would simply never do it. The generator
   rejects that input, but a hand-edited programme can still arrive — count them so the
   UI can say so out loud rather than quietly dropping work. */
function orphanExercises(){
  if(!isV2())return [];
  return PROGRAM.exercises.filter(e=>e.day===STATE.day&&!Number.isFinite(Number(e.week)));
}
/* meta.athleteId names the athlete/<slug>/logs/ folder an export belongs in. v1
   programmes predate it; derive the same slug from the display name so a log file
   is still filed correctly. A label, never a selector — the app has no profiles. */
function athleteId(){
  if(!PROGRAM||!PROGRAM.meta)return "";
  return PROGRAM.meta.athleteId||slug(PROGRAM.meta.athlete)||"";
}
/* Revision of the loaded programme. A week gets revised mid-block after a review, and
   re-importing is a manual step with no prompt — so this is shown next to the block name
   and stamped on every export, to answer "is the phone on the current version?" without
   diffing prescriptions. 0 means the programme predates versioning; the UI stays silent
   rather than claiming "v1", which would be a guess. */
function progVersion(){
  const v=PROGRAM&&PROGRAM.meta?Number(PROGRAM.meta.version):NaN;
  return Number.isFinite(v)&&v>0?Math.floor(v):0;
}
/* Prescribed set count, when the generator gave a plain number or a plain range —
   the set-at-a-time editor materialises this many chips before the athlete has logged
   anything. "3-4" or "AMRAP" are legitimate prose values, so anything else just means
   "start with one set": a range takes its lower bound (the extra set is one tap of
   "Log another set"); prose collapses to a single Set 1 of 1. */
function prescribedSets(ex){
  const s=String(ex.sets??"").trim();
  const clamp=n=>Math.min(Math.max(n,1),12);
  const plain=/^(\d+)$/.exec(s);
  if(plain)return clamp(parseInt(plain[1],10));
  const range=/^(\d+)\s*[-–—]\s*(\d+)$/.exec(s);
  if(range)return clamp(parseInt(range[1],10));
  /* "4 rounds" is four sets, not one. Deliberately tight — an
     integer, whitespace, then a *word*: "8-10 min" has no space after the 8 and
     "1 + 3" has no word after it, so both still mean "one set", which is right. */
  const counted=/^(\d+)\s+[a-z]/i.exec(s);
  if(counted)return clamp(parseInt(counted[1],10));
  return 1;
}
/* How many set chips the athlete actually wants shown right now. Starts at the
   prescription but is adjustable downward — tapping away an upcoming (never-logged) chip
   in the set editor sets `e.setTarget`, so skipping a set the plan called for doesn't
   leave a dead, always-outstanding slot sitting on the card forever. It never overrides
   what's already been committed — buildSetEditor() takes the max of this and rows.length. */
function targetSets(ex,e){
  return (typeof e.setTarget==="number"&&e.setTarget>=1)?e.setTarget:prescribedSets(ex);
}

/* Circuits need a different question from a strength set. The format already tells us
   whether a live round counter or one final result is the lower-friction default. */
function circuitOf(ex){
  const s=txt(ex&&ex.sets);let m;
  if((m=/^(\d+)\s+rounds?\b/i.exec(s)))return {kind:"rounds",target:Math.min(12,Math.max(1,+m[1])),
    defaultMode:/for\s+time/i.test(s)?"final":"quick",label:/for\s+time/i.test(s)?"Rounds for time":"Rounds"};
  if(/\bamrap\b/i.test(s)){m=/^(\d+)\s*(?:min(?:ute)?s?)?\s+amrap\b/i.exec(s)||/\bamrap\s*(\d+)?/i.exec(s);
    return {kind:"amrap",minutes:m&&m[1]?+m[1]:0,defaultMode:"final",label:"AMRAP"};}
  if(/\bemom\b/i.test(s)){m=/^(\d+)\s*(?:min(?:ute)?s?)?\s+emom\b/i.exec(s)||/\bemom\s*(\d+)?/i.exec(s);
    return {kind:"emom",minutes:m&&m[1]?+m[1]:0,defaultMode:"final",label:"EMOM"};}
  if(/\bfor\s+time\b/i.test(s))return {kind:"fortime",defaultMode:"final",label:"For time"};
  if(/^\d+(?:\s*[-–—]\s*\d+){2,}$/.test(s))return {kind:"ladder",defaultMode:"final",label:s};
  return null;
}
function circuitParts(ex){return txt(ex&&ex.reps).split(/\s*(?:\+|;|,)\s*/).map(x=>x.trim()).filter(Boolean);}
function blankCircuit(){return {mode:"",rounds:"",extra:"",time:"",result:"",minutes:"",load:"",note:"",touched:false};}
function circuitState(e,ex){
  /* Keep the object identity stable while fields are being edited. Replacing this
     object here leaves the other inputs in the same rendered form closing over a stale
     reference (typing rounds and then extra reps would silently lose the second value). */
  const fresh=!e.circuit||typeof e.circuit!=="object";
  if(fresh)e.circuit=blankCircuit();
  const c=e.circuit,defaults=blankCircuit();
  Object.keys(defaults).forEach(k=>{if(!(k in c))c[k]=defaults[k];});
  const spec=circuitOf(ex);if(!c.mode)c.mode=spec?spec.defaultMode:"final";
  if(!c.rounds&&e.sets&&e.sets.length)c.rounds=e.sets.length;
  /* A circuit logged before this UI existed has only the public flat headline. Keep it
     as a final-result fallback so opening Edit result can never blank old training data. */
  if(fresh&&c.mode==="final"&&(txt(e.reps)||txt(e.load)||txt(e.notes))){
    c.result=txt(e.reps);c.load=txt(e.load);c.note=txt(e.notes);c.touched=true;
  }
  return c;
}
function circuitHasData(e){const c=e&&e.circuit;
  return !!((e&&e.sets&&e.sets.length)||draftDirty(e)||(c&&(c.touched||c.rounds||txt(c.extra)||txt(c.time)||
    txt(c.result)||txt(c.minutes)||txt(c.load)||txt(c.note))));
}
function circuitModeName(mode){return mode==="quick"?"Quick rounds":mode==="details"?"Round details":"Final result";}

/* ---------- what the "reps" field actually measures ----------
   `reps` is prose, and in a real block roughly two rows in five prescribe something
   that is not a rep count: "45 sec", "8-10 min", "20 m", "45 sec hard / 75 sec easy".
   Never `inputmode="numeric"` here: it is a digits-only keypad on iOS, which makes a
   45-second hold literally untypeable. The one field becomes whatever that exercise
   measures — label, unit suffix, keyboard and placeholder all come from here.

   Nothing about the stored value changes. It is still exactly what the athlete typed,
   in `reps`, as a string, with `prescribed.reps` beside it in the export to say what
   the number means — no schema change. See docs/data-contracts.md. */
/* Labels are kept SHORT on purpose: at 360px the metric column is about 68px wide, and a
   label that wraps to two lines drops its input below the others in the same grid row. */
const REP_METRICS=[
  /* Composite prose FIRST, or "45 sec hard / 75 sec easy" reads as a 45-second hold.
     A prescription with arithmetic in it, or two halves at different efforts, is not
     one number: give it the full keyboard and let the athlete say what happened. */
  {re:/\+|\bhard\b|\beasy\b|\bthen\b|\bamrap\b|\bmax\b|\brounds?\b/i,
                                                    label:"Result",unit:"",    mode:"text"},
  {re:/\bcal(?:orie)?s?\b/i,                        label:"Work",  unit:"cal", mode:"decimal"},
  {re:/\d\s*(?:s|secs?|seconds?)\b/i,               label:"Hold",  unit:"s",   mode:"decimal"},
  /* Before the bare-m rule, so "8-10 min" is minutes and "20 m" stays metres. */
  {re:/\bmin(?:s|ute|utes)?\b/i,                    label:"Time",  unit:"min", mode:"decimal"},
  {re:/\d\s*(?:m|metres?|meters?)\b/i,              label:"Dist",  unit:"m",   mode:"decimal"},
  {re:/^\d+(?:\s*[-–—]\s*\d+)?(?:\s*\/\s*\w+)?$/,   label:"Reps",  unit:"",    mode:"numeric"}
];
function metricOf(ex){
  const rx=txt(ex&&ex.reps);
  /* Anything unrecognised is reps typed on a full keyboard — never a numeric keypad,
     which is the trap this whole function exists to avoid. */
  const m=REP_METRICS.find(c=>c.re.test(rx))||{label:"Reps",unit:"",mode:"text"};
  const lead=/^[\d.]+(?:\s*[-–—]\s*[\d.]+)?/.exec(rx);
  return {
    label:m.label,
    /* The unit goes in the LABEL, not in an overlay inside the field. A 3-character
       suffix ("min") plus a 4-character value ("8-10") does not fit a 68px column — it
       clipped the value, which is worse than a slightly longer label. */
    fieldLabel:m.label+(m.unit?` (${m.unit})`:""),
    unit:m.unit,
    inputmode:m.mode,
    /* Free text keeps sentence capitalisation; a number never wants it. */
    autocap:m.mode==="text"?"sentences":"off",
    /* The prescription itself, minus the unit — the label already carries that. Prose gets
       a generic word instead: "5 TnG power cleans + 15/12 cal bike" clips to "5 TnG p" in
       a 68px column, which reads as broken, and the full prescription is on the line
       directly above the field anyway. */
    placeholder:m.mode==="text"?"result"
               :(lead?lead[0].replace(/\s+/g,""):(rx.slice(0,6)||"reps"))
  };
}

/* ---------- what the programme says to capture ----------
   `logHint` is the generator's own list of what matters for this movement ("Top load;
   RPE-1; depth owned Y/N; knee pain during + next AM"). Split on the semicolons only — "knee pain
   during + next AM" is one instruction, and cutting it at the + leaves "next AM"
   standing on its own meaning nothing. */
function parseHints(ex){
  return txt(ex&&ex.logHint).split(/\s*;\s*/).map(s=>s.trim()).filter(Boolean).slice(0,4);
}
/* Does this exercise's own prescription ask for a pain reading? Used to accent the
   pain field and to nudge once on Finish — never to hide the field, because
   `tracking.painPerExercise` means "this device collects it" and an exercise-by-exercise
   exception would make an empty value unreadable. See docs/data-contracts.md. */
const PAIN_CUES=/pain|sore|ache|stiff|flare|niggle|tendon|response/i;
const PAIN_SITES=/\b(knee|patella\w*|hamstring|shoulder|achilles|elbow|wrist|ankle|hip|back|neck|groin|calf|quad)\b/i;
function painAsked(ex){
  if(!ex)return null;
  const hint=txt(ex.logHint),focus=txt(ex.focus),cat=catOf(ex);
  if(!(PAIN_CUES.test(hint)||PAIN_CUES.test(focus)||(cat&&cat.key==="tendon")))return null;
  const site=PAIN_SITES.exec(hint)||PAIN_SITES.exec(focus);
  return {site:site?site[1].toLowerCase():""};
}
/* The site the loaded programme talks about most, so the Account screen can offer it
   instead of the athlete having to know that "Knee" is a setting. Nothing here is
   persisted or exported, and the athlete's own painLabel always wins. */
function programPainSite(){
  if(!PROGRAM||!Array.isArray(PROGRAM.exercises))return "";
  const freq=new Map();
  PROGRAM.exercises.forEach(ex=>{
    const a=painAsked(ex);
    if(a&&a.site)freq.set(a.site,(freq.get(a.site)||0)+1);
  });
  let best="",n=0;
  freq.forEach((c,s)=>{if(c>n){best=s;n=c;}});
  return best;
}

/* ---------- where the athlete is in the block ----------
   Tracking is date-first: `STATE.date` is primary and (week, day) are derived from it —
   see the STATE comment above for why the position is never stored separately. Claims
   live in the sessions; see "what a date is" below. */
/* `STATE.day` is a LABEL STRING everywhere — it is half of the stored session key and
   what every exercise row's own `day` is compared against. dayLabels() is the only
   correct way to read meta.days, because a structured day is an object and letting one
   reach STATE.day would break the session key, the day filter and the header at once. */
function dayLabels(program){return dayEntries(program||PROGRAM).map(d=>d.label);}
function firstDay(){return dayLabels()[0]||null;}

/* ---------- the derived schedule ----------
   `tp-program-2` carries no dates. A programme is (week, day) only, and the weekday
   exists solely as prose inside the day label — "Day 1 (Mon) - Clean Skill + Front
   Squat" — a convention documented in data-contracts.md and deliberately NOT enforced
   by validate_program.py. Tracking is date-first, so exactly one function turns that
   into calendar dates, with three fallbacks in the documented order.

   Everything below is only ever a SUGGESTION — claims win over it; see "what a date is".
   Nothing here is a lookup the render path pays for: SCHEDULE is computed when the
   programme or the anchor changes, and read from memory after that. */
const WEEKDAYS=[
  {n:1,re:/\bmon(?:day)?\b/i,short:"Mon"},
  {n:2,re:/\btue(?:s(?:day)?)?\b/i,short:"Tue"},
  {n:3,re:/\bwed(?:nesday)?\b/i,short:"Wed"},
  {n:4,re:/\bthu(?:r(?:s(?:day)?)?)?\b/i,short:"Thu"},
  {n:5,re:/\bfri(?:day)?\b/i,short:"Fri"},
  {n:6,re:/\bsat(?:urday)?\b/i,short:"Sat"},
  {n:7,re:/\bsun(?:day)?\b/i,short:"Sun"}
];
function weekdayShort(n){const w=WEEKDAYS.find(x=>x.n===Number(n));return w?w.short:"";}
function matchWeekday(s){
  const t=String(s??"");
  /* "Monostructural" must not read as Monday — every pattern is \b-anchored on both
     sides, so a weekday only matches when it stands as its own word. */
  for(const w of WEEKDAYS)if(w.re.test(t))return w.n;
  return 0;
}
/* The parenthetical is the convention, so it wins over a weekday word appearing anywhere
   else in the label: "Day 1 (Mon) - Sunday long grind" is a Monday. */
function parseWeekday(label){
  const s=String(label??"");
  const paren=/\(([^)]*)\)/.exec(s);
  return (paren?matchWeekday(paren[1]):0)||matchWeekday(s);
}
function normWeekday(v){
  if(typeof v==="number"){const n=Math.floor(v);return n>=1&&n<=7?n:0;}
  return matchWeekday(v);
}
/* meta.days is a list of label strings today. A future generator may emit
   {label, weekday} objects instead — accepting both here is what makes adding the
   structured fields a no-op in the app rather than a migration. Nothing emits them yet;
   see "Deferred on purpose" in docs/roadmap.md. */
function dayEntries(program){
  const days=(program&&program.meta&&program.meta.days)||[];
  if(!Array.isArray(days))return [];
  return days.map(d=>(d&&typeof d==="object")
    ?{label:txt(d.label??d.name??d.day),weekday:normWeekday(d.weekday)}
    :{label:txt(d),weekday:0}).filter(d=>d.label);
}
/* Identifies the programme an anchor belongs to, so a stale anchor for a replaced
   programme is ignored rather than silently applied to the new block. Deliberately
   excludes meta.version: a week revised mid-block bumps the revision, and losing the
   anchor there would move every date in the block. */
function programKeyOf(program){
  const m=(program&&program.meta)||{};
  return [slug(m.block),slug(m.athleteId||m.athlete),Math.floor(Number(m.weeks)||0),
          dayEntries(program).length].join("|");
}
function scheduleStoreKey(){return APP.source==="sample"?LS.demoSched:LS.sched;}
function storedAnchor(program){
  try{
    const v=JSON.parse(localStorage.getItem(scheduleStoreKey())||"null");
    if(v&&typeof v==="object"&&v.programKey===programKeyOf(program)&&parseISO(v.anchorMonday))
      return mondayOf(v.anchorMonday);
  }catch(e){}
  return "";
}
function saveAnchor(program,iso){
  const monday=mondayOf(iso);
  if(!monday)return "";
  try{localStorage.setItem(scheduleStoreKey(),
    JSON.stringify({programKey:programKeyOf(program),anchorMonday:monday}));}catch(e){}
  return monday;
}
/* Right most of the time, cheap when wrong: the Monday of the week the programme was
   imported. It is persisted the first time it resolves, which is what makes it mean
   "imported" rather than quietly re-deriving to whatever Monday it is now. A programme
   that ever declares meta.startDate wins over that, but never over an athlete's own
   edit — an edited anchor is already stored and matches on programKey. */
function anchorFor(program){
  const stored=storedAnchor(program);
  if(stored)return stored;
  const declared=(program&&program.meta&&program.meta.startDate)||"";
  return mondayOf(parseISO(declared)?declared:todayISO());
}
function scheduleFor(program){
  if(!program||!program.meta)return null;
  const weeks=Math.max(1,Math.floor(Number(program.meta.weeks)||1));
  const days=dayEntries(program).map(d=>({label:d.label,
    weekday:d.weekday||parseWeekday(d.label)}));
  /* Third fallback: no weekday could be read for this day, so distribute across
     consecutive weekdays from Monday — skipping the ones the labelled days already own,
     so a partly-labelled programme keeps the labels it does have instead of being
     flattened back to Mon/Tue/Wed. With more than seven days the tail doubles up, which
     is the same "two sessions on one date" case the calendar already lists. */
  const taken=new Set(days.filter(d=>d.weekday).map(d=>d.weekday));
  let next=1;
  days.forEach(d=>{
    if(d.weekday)return;
    while(next<=7&&taken.has(next))next++;
    d.weekday=Math.min(next,7);taken.add(d.weekday);next++;
  });
  return {anchorMonday:anchorFor(program),weeks,days};
}
/* The live schedule for the loaded programme. null with no programme loaded, which every
   caller has to tolerate — "no programme" is one of the honest date states. */
let SCHEDULE=null;
function refreshSchedule(){
  SCHEDULE=PROGRAM?scheduleFor(PROGRAM):null;
  if(SCHEDULE&&PROGRAM)saveAnchor(PROGRAM,SCHEDULE.anchorMonday);
  return SCHEDULE;
}
/* One tap in the UI; the value is always normalised to a Monday so week arithmetic
   cannot drift by a few days. */
function setAnchorMonday(iso){
  if(!PROGRAM)return "";
  const monday=saveAnchor(PROGRAM,iso);
  if(!monday)return "";
  refreshSchedule();
  return monday;
}
function scheduleDay(label,sched){
  const s=sched||SCHEDULE;
  if(!s)return null;
  return s.days.find(d=>d.label===label)||null;
}
/* (week, day) -> the date the schedule suggests. "" when there is no schedule, or the
   day is not one this programme has. */
function dateFor(week,dayLabel,sched){
  const s=sched||SCHEDULE;
  const day=scheduleDay(dayLabel,s);
  if(!s||!day)return "";
  const w=Math.max(1,Math.floor(Number(week)||1));
  return addDays(s.anchorMonday,(w-1)*7+(day.weekday-1));
}
/* …and the other direction. null means the schedule has nothing on that date: before the
   block, past its last week, or a weekday the programme does not train — a rest day. */
function scheduleForDate(date,sched){
  const s=sched||SCHEDULE;
  if(!s)return null;
  const diff=daysBetween(s.anchorMonday,date);
  if(diff==null||diff<0)return null;
  const week=Math.floor(diff/7)+1;
  if(week>s.weeks)return null;
  const day=s.days.find(d=>d.weekday===(diff%7)+1);
  return day?{week,day:day.label}:null;
}

/* ---------- what a date is ----------
   Opening a date resolves to exactly one of five things, and that IS the navigation
   model:

     noprogram  nothing imported
     rest       nothing scheduled and nothing stored — notes only
     start      scheduled, nothing stored yet (worded "Log it late" once it has passed)
     resume     an open session exists on this date
     review     a sealed session exists — viewable, and editable

   A CLAIM is any stored session carrying this date, and claims always win over the
   schedule's suggestion — which is why there is no "move session" operation at all. A
   scheduled date that passes with nothing logged stays not-done: never red, never
   auto-rolled forward. See docs/design-rationale.md. */
function sortClaims(list){
  const order=dayLabels();
  /* An open session first: if a date holds two, the one still being logged is the one
     you meant to open. Two sessions on one date are allowed and listed — not designed
     for, but never silently dropped. */
  return list.slice().sort((a,b)=>
    (a.status==="sealed"?1:0)-(b.status==="sealed"?1:0)||
    order.indexOf(a.day)-order.indexOf(b.day));
}
function dateStateOf(iso){
  const date=parseISO(iso)?iso:todayISO();
  if(!PROGRAM)return {kind:"noprogram",date,week:1,day:null,claims:[]};
  const claims=sortClaims(sessionsOn(date));
  if(claims.length){
    const pick=claims[0];
    return {kind:pick.status==="sealed"?"review":"resume",
      date,week:pick.week,day:pick.day,claims};
  }
  const suggestion=scheduleForDate(date);
  if(suggestion)return {kind:"start",date,week:suggestion.week,day:suggestion.day,claims:[]};
  return {kind:"rest",date,week:suggestedWeek(date),day:null,claims:[]};
}
/* A rest day has no (week, day) to show, but the claim picker still needs a sensible
   week preselected — the week the block is in on that date, clamped to the block. */
function suggestedWeek(iso){
  if(!SCHEDULE)return 1;
  const diff=daysBetween(SCHEDULE.anchorMonday,iso);
  if(diff==null)return 1;
  return Math.min(SCHEDULE.weeks,Math.max(1,Math.floor(diff/7)+1));
}
/* The next date at or after `from` that the schedule has a session on. Bounded by the
   block rather than searching forward forever, and used only to point at the next
   session from a rest day — never to move anything. */
function nextScheduled(from){
  if(!SCHEDULE)return null;
  const start=parseISO(from)?from:todayISO();
  const diff=daysBetween(SCHEDULE.anchorMonday,start);
  if(diff==null)return null;
  const last=addDays(SCHEDULE.anchorMonday,SCHEDULE.weeks*7-1);
  for(let d=diff<0?SCHEDULE.anchorMonday:start;d&&d<=last;d=addDays(d,1)){
    const hit=scheduleForDate(d);
    if(hit)return {date:d,week:hit.week,day:hit.day};
  }
  return null;
}
/* Is there a stored session under the open date + day? This is what separates "start"
   from "resume": the claim is a record on disk, not a flag in memory. */
function sessionStored(){
  if(!txt(STATE.day))return false;
  try{return localStorage.getItem(sessionKey())!=null;}catch(e){return false;}
}
/* The state of the date currently open, read from STATE and storage rather than
   re-resolved — so it can never disagree with the claim the athlete just made. */
function openState(s){
  if(!PROGRAM)return "noprogram";
  if(!txt(STATE.day))return "rest";
  if(!sessionStored())return "start";
  return sealed(s||getSession())?"review":"resume";
}
/* The state half of opening a date, with no re-render: used while a workout is still
   being opened, before there is anything on screen to update. */
function adoptDate(iso){
  const d=dateStateOf(iso);
  STATE.date=d.date;STATE.week=d.week;STATE.day=d.day;STATE.setEdit=null;
  resetFocus();
  return d;
}
/* The one entry point for "show me this date", so the claim is adopted in exactly one
   place. Flushes first, while STATE still points at the session the draft belongs to. */
function openDate(iso){
  flushDraft();
  adoptDate(iso);
  renderHeader();
  renderMain();resetViewScroll();
}
/* Claiming is a WRITE, not navigation: it says "this date is week W, day D". A session
   already stored under the resulting key has its week rewritten, because the claim is
   the athlete's own correction. Nothing is created otherwise, so browsing weeks never
   litters the calendar with empty sessions. */
function applyClaim(week,day){
  flushDraft();
  STATE.week=Math.max(1,Math.floor(Number(week)||1));
  STATE.day=txt(day)||null;
  STATE.setEdit=null;
  /* saveSession() stamps week/day/date from STATE, which is exactly the claim. */
  if(sessionStored())saveSession(getSession());
  resetFocus();
  renderHeader();
  renderMain();resetViewScroll();
}
/* Starting a session writes it, and that write is what makes the date a claim: from here
   on the stored record, not the schedule, decides what this date is. */
function startSession(){
  if(!PROGRAM||!txt(STATE.day))return null;
  const s=getSession();
  s.status="open";s.sealedAt="";
  saveSession(s);
  return s;
}
/* ---------- sealing ----------
   Inferring "complete" from the entries cannot tell "I finished" from "I did four of six
   and walked out" — a difference the coaching side cares about, hence an explicit seal.
   Sealing is LOCAL and works with the radio off: tying it to sync or export would make a
   dropped connection look like an unfinished workout. */
function sealSession(){
  if(!PROGRAM||!txt(STATE.day))return null;
  flushDraft();
  const s=getSession();
  s.status="sealed";s.sealedAt=new Date().toISOString();
  saveSession(s);
  return s;
}
/* Editing a sealed session deliberately does NOT come through here — un-sealing because
   a typo was fixed would flip the calendar back to "unfinished", which is a lie about
   that day. This is only the explicit "reopen this day", so a mis-tapped Finish is not
   permanent. */
function unsealSession(){
  if(!PROGRAM||!txt(STATE.day))return null;
  const s=getSession();
  s.status="open";s.sealedAt="";
  saveSession(s);
  return s;
}
/* Export stays manual and per-session — the export is a file that has to be put
   somewhere, on the athlete's terms. Recording when it left is what lets the app say
   "edited since export" afterwards, which is information the coaching loop needs and the
   app has never had. */
function markExported(){
  if(!PROGRAM||!sessionStored())return null;
  const s=getSession();
  saveSession(s,{exported:true});
  return s;
}

function loadProgram(obj){
  if(!obj||!obj.meta||!Array.isArray(obj.exercises))throw new Error("Not a valid program.json (need meta + exercises).");
  PROGRAM=obj;APP.source="personal";localStorage.setItem(LS.prog,JSON.stringify(obj));
  const demo=$("#demoBanner");if(demo)demo.hidden=true;
  /* A fresh import starts at the top of the block — and that reset has to be persisted,
     or the next refresh would restore the position from the programme just replaced. */
  /* The anchor is resolved and persisted here, so "the Monday of the week the programme
     was imported" is a fact about this import rather than about whenever it is next
     opened. The session index belongs to the previous programme's namespace. */
  refreshSchedule();
  invalidateSessionIndex();
  /* A fresh import lands on TODAY, like every other entry point (see STATE). Today may
     well be a rest day, and the date view says so, offering the next session and the
     claim picker. */
  adoptDate(todayISO());
  renderAll();resetViewScroll();
}
function acceptProgramImport(obj,fromProfile=APP.surface==="profile"){
  if(window.TPPrograms&&TPPrograms.importProgram){
    const pending=TPPrograms.importProgram(obj);
    return Promise.resolve(pending).then(result=>{
      if(fromProfile)showSurface("profile");
      if(result&&result.ok){
        toast(result.pending?"Programme ready · cloud backup queued":"Programme added to your library");
      }else{
        const message=result&&result.error&&result.error.message||"Cloud backup failed";
        toast("Programme ready on this device · "+message);
      }
      return result;
    });
  }
  loadProgram(obj);
  if(fromProfile){showSurface("profile");if(window.TPProfileUI)TPProfileUI.render();}
  toast(fromProfile?"Programme ready on this device":"Program loaded");
}
function clearCachedProgram(){
  localStorage.removeItem(LS.prog);
  LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));
  /* The anchor is a fact about a programme, not about the device — it goes with it.
     Sessions are deliberately kept: they are the training record. */
  localStorage.removeItem(LS.sched);
  SCHEDULE=null;invalidateSessionIndex();
  if(APP.source==="personal"||APP.surface==="profile")PROGRAM=null;
  if(window.TPProfileUI)TPProfileUI.render();
}
async function boot(){
  loadSettings();
  applyTheme();          /* head script already painted it; this keeps meta + state in sync */
  if(window.TPAuthUI)TPAuthUI.init({toast});
  if(window.TPPrograms)TPPrograms.init({
    getCachedProgram:cachedProgram,
    onActivate:loadProgram,
    onClearActive:clearCachedProgram
  });
  /* Account-scoped settings, initialised before the surfaces that render them. A merged
     record arriving from another device is adopted rather than ignored. */
  if(window.TPAccountSettings)TPAccountSettings.init({
    onMerged:record=>{adoptAccountSettings(record);}
  });
  if(window.TPSessions)TPSessions.init({
    readLocalSessions:readPersonalSessions,
    buildPayload:(session,program)=>buildSessionPayload(session,program)
  });
  if(window.TPProfileUI)TPProfileUI.init({
    getCachedProgram:cachedProgram,
    /* profile-ui repaints on every auth/library/sync tick. It has no idea which screen
       is showing, so it asks. */
    isEntryVisible:()=>APP.route==="entry",
    onRefresh:()=>{
      if(APP.route==="programme")renderProgrammePage();
      else if(APP.route==="account")renderAccountPage();
      else if(APP.route==="home")renderHome();
    },
    /* A cloud session that IS on this device is a date on the calendar, so it does not
       need a second home in Account. */
    hasLocalSession:(date,day)=>{
      try{return localStorage.getItem(LS.sess(date,day))!=null;}catch(e){return false;}
    },
    onOpenCached:openCachedWorkout,
    onImport:requestProgramImport,
    onActivateProgram:id=>{
      const result=window.TPPrograms&&TPPrograms.activate(id);
      if(!result||!result.ok)toast(result&&result.error&&result.error.message||"Programme unavailable");
    },
    onBackUpCached:async()=>{
      const result=await TPPrograms.backUpCached();
      toast(result.ok?(result.pending?"Cloud backup queued":"Programme backed up"):
        result.error&&result.error.message||"Cloud backup failed");
    },
    onRemoveProgram:async item=>{
      const label=item&&item.title||"this programme";
      if(window.confirm&&!window.confirm(`Remove ${label} from your library? The workout logs on this device will be kept.`))return;
      const result=await TPPrograms.remove(item.id);
      toast(result.ok?"Programme removed":result.error&&result.error.message||"Remove failed");
    },
    onNotice:toast,
    onExportAccount:async()=>{
      if(!window.TPAccountData)throw new Error("Account export is unavailable.");
      await TPAccountData.exportAccountData();
      toast("Account data downloaded");
    },
    onDeleteAccount:async()=>{
      if(!window.TPAccountData)throw new Error("Account deletion is unavailable.");
      const approved=window.confirm&&window.confirm(
        "Delete this account permanently? Cloud programmes and workout history will be deleted. " +
        "This device’s personal data will be cleared after deletion succeeds. Offline data on other devices and managed backups may remain temporarily. Choose Export account data first if you want a copy."
      );
      if(!approved)return;
      const password=window.prompt&&window.prompt("Enter your current password to confirm account deletion:");
      if(password==null)return;
      await TPAccountData.deleteAccount(password);
      toast("Account deleted on this device");
      if(window.location&&window.location.reload)setTimeout(()=>window.location.reload(),300);
    },
    onDownloadHistory:downloadSessionPayload,
    onCopyHistory:copySessionPayload,
    onOpenSample:openSampleWorkout,
    onSignedOut:()=>{forgetProgram();openProfile();}
  });
  if(window.TPAuth){
    TPAuth.subscribe(()=>{
      /* Losing access has to drop the personal training surface at once, and with it
         everything derived from the programme. */
      if(APP.source==="personal"&&APP.route!=="entry"&&!cachedAccess()){
        forgetProgram();openProfile();return;
      }
      /* Gaining access on the gate is what turns a cold sign-in into the hub. */
      if(APP.route==="entry"&&cachedAccess()){bootSurface();return;}
      /* The account screen shows sign-in state, so it follows an auth change. */
      if(APP.route==="account")renderAccountPage();
    });
    TPAuth.init();
  }
  bootSurface();
}
/* Drop the loaded programme and everything derived from it, without touching the
   sessions on disk — those are the training record, not a cache. */
function forgetProgram(){
  PROGRAM=null;SCHEDULE=null;APP.source=null;invalidateSessionIndex();
}
/* Where a cold start lands. The hub answers "what am I doing today", which needs the
   cached programme in hand — so it is loaded here rather than on the way into a workout. */
function bootSurface(){
  if(cachedAccess()&&!PROGRAM){
    const cached=cachedProgram();
    if(cached){
      PROGRAM=cached;APP.source="personal";
      refreshSchedule();invalidateSessionIndex();adoptDate(todayISO());
    }
  }
  showRoute(cachedAccess()&&PROGRAM?"home":"entry");
}

/* ---------- session persistence ---------- */
/* `amPainOnWaking` replaced `amPainNextDay` at tp-session-3. The old field asked for
   tomorrow's response to today's session, which meant re-opening a closed session the
   next morning — so in practice it arrived empty, and an empty tendon reading looks
   exactly like a good one. This is the same measurement taken at check-in, when the app
   is already open. It is the response to the PREVIOUS session; see docs/data-contracts.md. */
const BLANK_SESSION={bodyweightKg:"",sleep:"",readiness:"",hrvNote:"",amPainOnWaking:"",overall:""};

/* An exercise entry. `sets[]` holds only *committed* rows — a set the athlete actually
   confirmed with "Log set N". `draft` is the set currently being typed, seeded from the
   set before it; it is never in `sets[]` and never reaches an export (see exportEntry).
   `summaryAuto` says whether load/reps/rpe/painDuring are still following the sets —
   editing any of them directly in "Summary & notes" turns following off for good,
   exactly like a per-set row that stops following once it's been typed into. `setTarget`
   is the athlete's own adjusted set count (see targetSets()) — null until they remove an
   upcoming chip, so it doesn't have to be reset when a programme is re-imported. */
/* `dirty` is the difference between "these fields are showing you the last set" and
   "you have typed this set". Only a dirty draft is auto-committed when you end early or
   navigate away (see flushDraft), which is what stops a typed set being silently
   dropped without ever inventing a set nobody performed. App-local: `draft` never
   reaches an export, and commitSet() builds its row from named fields. */
function blankDraft(){return {load:"",reps:"",rpe:"",painDuring:"",note:"",dirty:false};}
function seedDraft(row){return {load:txt(row.load),reps:txt(row.reps),rpe:txt(row.rpe),
  painDuring:txt(row.painDuring),note:"",dirty:false};}
function draftEmpty(d){return !(txt(d.load)||txt(d.reps)||txt(d.rpe)||txt(d.painDuring)||txt(d.note));}
function draftDirty(e){return !!(e&&e.draft&&e.draft.dirty&&!draftEmpty(e.draft));}
/* Three states, and every surface has to tell them apart: "done" is finished, "part" is
   something logged or typed but not finished, "todo" is untouched. The Overview status
   line, the pip strip and the progress bar all read this — before, a half-logged
   exercise looked identical to an untouched one everywhere outside the editor, which is
   how a session could feel logged and export as empty. */
function entryState(e){
  if(!e)return "todo";
  if(e.done)return "done";
  return ((e.sets&&e.sets.length)||draftDirty(e)||circuitHasData(e))?"part":"todo";
}
function blankEntry(){return {done:false,name:"",load:"",reps:"",rpe:"",painDuring:"",notes:"",
  sets:[],draft:blankDraft(),summaryAuto:true,setTarget:null,circuit:null};}
function renumber(e){(e.sets||[]).forEach((r,i)=>{r.set=i+1;});return e.sets;}
/* The entry for an exercise on the open session, created on demand. The exercise's own
   name is stamped on it because "last time" has to match across blocks, where ids are
   regenerated — the id alone stops working exactly when the comparison is most wanted.
   App-local: exportEntry() names every exported key, so this can never reach a log file. */
function entryFor(s,ex){
  const e=s.entries[ex.id]||(s.entries[ex.id]=blankEntry());
  normalizeEntry(e);
  if(e.name!==ex.name)e.name=ex.name;
  return e;
}

/* ---------- deriving the flat summary from sets[] ----------
   Every one of these must be safe on an empty or partial set list: never fabricate an
   RPE of 0 from nothing logged, never emit "NaN" from prose ("7-8"), never assert a
   reps count sets[] doesn't support. */
function pickMode(vals){
  if(!vals.length)return "";
  const freq=new Map();
  vals.forEach(v=>freq.set(v,(freq.get(v)||0)+1));
  let best=vals[0],bestCount=freq.get(vals[0]);
  freq.forEach((c,v)=>{
    if(c>bestCount){best=v;bestCount=c;}
    else if(c===bestCount){
      /* Tie: prefer the numerically heavier value (a dropped-load top set beats its
         back-off sets), falling back to the first-seen when neither parses. */
      const pv=parseNum(v),pb=parseNum(best);
      if(pv!=null&&(pb==null||pv>pb)){best=v;bestCount=c;}
    }
  });
  return best;
}
function pickMax(vals){
  if(!vals.length)return "";
  const nums=vals.map(v=>({v,n:parseNum(v)})).filter(x=>x.n!=null);
  if(nums.length){let b=nums[0];nums.forEach(x=>{if(x.n>b.n)b=x;});return b.v;}
  return vals[vals.length-1];               /* nothing parsed ("7-8") — last raw string */
}
/* `unit` comes from metricOf(ex) and is optional throughout: three 45-second holds
   derive as "3x45s" rather than the ambiguous "3x45". It is appended, never parsed —
   the value stays exactly what the athlete typed. Callers that have no exercise in
   hand (the migration path in normalizeEntry) pass nothing and get the bare number. */
function withUnit(v,unit){return unit&&v?v+unit:v;}
function deriveReps(rows,unit){
  const vals=rows.map(r=>txt(r.reps));
  if(!vals.some(Boolean))return "";
  const allFilled=vals.every(Boolean);
  if(allFilled&&new Set(vals).size===1)
    return vals.length===1?withUnit(vals[0],unit):`${vals.length}x${withUnit(vals[0],unit)}`;
  if(allFilled)return vals.map(v=>withUnit(v,unit)).join("/");
  /* a hole is shown, never silently dropped */
  return vals.map(v=>v?withUnit(v,unit):"-").join("/");
}
function deriveSummary(rows,unit){
  return {
    load: pickMode(rows.map(r=>txt(r.load)).filter(Boolean)),
    reps: deriveReps(rows,unit),
    rpe: pickMax(rows.map(r=>txt(r.rpe)).filter(Boolean)),
    painDuring: pickMax(rows.map(r=>txt(r.painDuring)).filter(Boolean))
  };
}
function applyDerivedSummary(e,unit){
  if(e.summaryAuto===false)return;
  const d=deriveSummary(e.sets,unit);
  e.load=d.load;e.reps=d.reps;e.rpe=d.rpe;e.painDuring=d.painDuring;
}

/* ---------- migrating a stored entry ----------
   Runs inside getSession(), so every reader — renderMain, updateProgress, export — sees
   the current shape regardless of which build wrote the file on disk. Idempotent: run it
   twice and the second pass changes nothing, which matters because it runs on every read. */
function normalizeEntry(e){
  let changed=false;
  if(!Array.isArray(e.sets)){e.sets=[];changed=true;}
  /* The old "Log each set" table seeded rows the athlete hadn't actually typed into yet
     and flagged them `auto`. The set-at-a-time editor never writes that flag, so any row
     that still carries it predates this build and was never confirmed — drop it, or a
     7-set exercise where only set 1 was ever typed exports as 7 sets performed. */
  if(e.sets.some(r=>r&&"auto" in r)){
    /* Rebuild the survivors too, not just drop the auto:true rows — a row that carried
       the key at all predates this build, and leaving `auto:false` sitting on it is
       stale bookkeeping the new model never reads or writes. */
    e.sets=e.sets.filter(r=>!(r&&r.auto)).map(r=>({set:r.set,
      load:txt(r.load),reps:txt(r.reps),rpe:txt(r.rpe),painDuring:txt(r.painDuring),note:txt(r.note)}));
    renumber(e);
    changed=true;
  }
  /* Per-set logging used to be opt-in, so most existing logs are flat-only. Promote that
     into one committed set rather than let derivation below silently blank it out — but
     not for a box ticked with nothing logged at all (a warm-up needs no invented set). */
  if(!e.sets.length&&!(e.circuit&&e.circuit.mode==="final")&&
     (txt(e.load)||txt(e.reps)||txt(e.rpe)||txt(e.painDuring))){
    e.sets=[{set:1,load:txt(e.load),reps:txt(e.reps),rpe:txt(e.rpe),painDuring:txt(e.painDuring),note:""}];
    changed=true;
  }
  if(!e.draft||typeof e.draft!=="object"){
    e.draft=e.sets.length?seedDraft(e.sets[e.sets.length-1]):blankDraft();
    changed=true;
  }
  if(e.circuit&&typeof e.circuit==="object"){
    const normalized={...blankCircuit(),...e.circuit};
    if(JSON.stringify(normalized)!==JSON.stringify(e.circuit)){e.circuit=normalized;changed=true;}
  }else if(e.circuit!=null){e.circuit=null;changed=true;}
  if(typeof e.summaryAuto!=="boolean"){e.summaryAuto=true;changed=true;}
  if(changed){
    if(e.circuit&&e.circuit.mode!=="final")syncCircuitSummary(e);
    else if(!(e.circuit&&e.circuit.mode==="final"))applyDerivedSummary(e);
  }
  return changed;
}

/* ---------- session lifecycle state ----------
   Additive, and read tolerantly: a record already on a phone has none of these keys.
   **An absent `status` means "open"** — a session written before sealing existed cannot
   have been sealed, and reading it as anything else would flip the calendar's account of
   a day the athlete already finished.

     status      "open" | "sealed" — Finish session seals it. Sealing is local and works
                 with the radio off; it is deliberately not tied to sync or export, or a
                 dropped connection would look like an unfinished workout.
     sealedAt    when that happened.
     exportedAt  when the session last left the phone as a file. Compared against
                 `editedAt` to derive "edited since export" — editing a sealed session
                 never un-seals it, because un-sealing would flip the calendar back to
                 "unfinished" because you fixed a typo, which is a lie about that day.
     editedAt    when it last changed. Written by saveSession().
     lastSetAt   when a set was last committed. The rest clock is always now − this, so
                 there is no timer state to drift, corrupt or desynchronise.

   None of them reach a log file: buildSessionPayload() names every exported key. */
function normalizeSessionState(s){
  let changed=false;
  const status=s.status==="sealed"?"sealed":"open";
  if(s.status!==status){s.status=status;changed=true;}
  if(status!=="sealed"&&txt(s.sealedAt)){s.sealedAt="";changed=true;}
  ["sealedAt","exportedAt","editedAt","lastSetAt"].forEach(k=>{
    const v=txt(s[k]);
    if(s[k]!==v){s[k]=v;changed=true;}
  });
  return changed;
}
function sealed(s){return !!s&&s.status==="sealed";}
/* A strictly increasing edit stamp. Two writes inside the same millisecond would compare
   equal, and "edited since export" would then be hidden by nothing more than a fast
   thumb — so a collision is nudged forward by a millisecond, which keeps the stored value
   a plain ISO timestamp. `new Date(previous)` is right here and not a parseISO case:
   these are UTC instants, not local calendar days. */
function nextStamp(previous){
  const now=new Date().toISOString();
  if(!previous||now>previous)return now;
  return new Date(new Date(previous).getTime()+1).toISOString();
}
/* A sealed session whose file on disk is older than its last edit. The coaching loop
   needs to know; the app has never had the information before. */
function editedSinceExport(s){
  if(!s||!txt(s.exportedAt)||!txt(s.editedAt))return false;
  return s.editedAt>s.exportedAt;
}
function sessionKey(){
  if(!txt(STATE.day))return "";
  return APP.source==="sample"?LS.demoSess(STATE.date,STATE.day):LS.sess(STATE.date,STATE.day);
}
function getSession(){
  const raw=localStorage.getItem(sessionKey());
  let s=null;
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      if(parsed&&typeof parsed==="object"){
        parsed.session={...BLANK_SESSION,...(parsed.session||{})};
        if(!parsed.entries||typeof parsed.entries!=="object")parsed.entries={};
        s=parsed;
      }
    }catch(e){}
  }
  if(!s)s={block:PROGRAM?PROGRAM.meta.block:"",athlete:PROGRAM?PROGRAM.meta.athlete:"",
    week:STATE.week,day:STATE.day,date:STATE.date,
    status:"open",sealedAt:"",exportedAt:"",editedAt:"",lastSetAt:"",
    session:{...BLANK_SESSION},entries:{}};
  let changed=normalizeSessionState(s);
  Object.keys(s.entries).forEach(id=>{
    const e={...blankEntry(),...s.entries[id]};
    if(normalizeEntry(e))changed=true;
    s.entries[id]=e;
  });
  if(changed&&sessionKey()){try{localStorage.setItem(sessionKey(),JSON.stringify(s));}catch(e){}}
  return s;
}
function saveSession(s,opts){
  /* No day claimed means there is no session on this date — a rest day holds notes, not
     a workout. Guarding here rather than at every caller stops a stray autosave filing a
     `::null` record that the calendar would then have to explain. */
  if(!txt(STATE.day)){updateProgress(s);return;}
  s.week=STATE.week;s.day=STATE.day;s.date=STATE.date;
  s.editedAt=nextStamp(s.editedAt);
  /* Exporting is not an edit. Stamping both from the same instant is what keeps
     "edited since export" false until the athlete actually changes something after. */
  if(opts&&opts.exported)s.exportedAt=s.editedAt;
  /* localStorage can throw (quota, private mode) — never let a keystroke's autosave
     take the rest of the app down with it. */
  let saved=false;
  try{localStorage.setItem(sessionKey(),JSON.stringify(s));saved=true;}catch(e){}
  /* The index is a cache over the sibling session keys. Anything that writes a session
     must drop it, or the calendar and "last time" would go stale mid-block. */
  if(saved)invalidateSessionIndex();
  /* The remote path begins only after the device write succeeds. stage() is synchronous:
     it snapshots the contract into a durable queue and schedules network work elsewhere,
     so a keystroke never waits for Supabase. Demo sessions never cross this boundary. */
  if(saved&&APP.source==="personal"&&PROGRAM&&window.TPSessions&&window.TPPrograms){
    const active=TPPrograms.getActiveIdentity&&TPPrograms.getActiveIdentity();
    if(active&&active.id){
      try{TPSessions.stage(sessionKey(),active.id,buildSessionPayload(s,PROGRAM));}catch(e){}
    }
  }
  updateProgress(s);
}

/* ---------- the session index ----------
   Date-first navigation asks "what is on this date", and the focus logger asks "what did
   I lift for this exercise last time" — both about sessions other than the open one,
   which means reading sibling tp_sess_v1::* keys. That is a localStorage scan, and
   saveSession() runs on every keystroke, so it is built ONCE and cached behind
   sessionIndex(). **Never call the builder from a render path.**

   It is a cache, so every write invalidates it (see saveSession). Missing that is how
   "last time" would go quietly stale mid-block. */
let SESSION_INDEX=null;
function invalidateSessionIndex(){SESSION_INDEX=null;}
function sessionPrefix(){return APP.source==="sample"?LS.demoSessPrefix:LS.sessPrefix;}
/* Exercise identity for matching across sessions: an id is stable inside a block, but a
   re-generated programme or a new block renumbers them, so the name — punctuation and
   case removed — is the fallback that keeps "last time" alive where it matters most. */
function normName(s){return String(s??"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();}
function buildSessionIndex(){
  const prefix=sessionPrefix();
  const byDate=new Map();      /* date            -> [record]  (as stored, unordered) */
  const byId=new Map();        /* exercise id     -> [logged]   oldest first          */
  const byName=new Map();      /* normalised name -> [logged]   oldest first          */
  const logged=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(!key||key.indexOf(prefix)!==0)continue;
    let v=null;
    try{v=JSON.parse(localStorage.getItem(key)||"null");}catch(e){}
    if(!v||typeof v!=="object")continue;
    /* The date in the KEY is authoritative. It is what the session is filed under, so a
       record whose body disagrees — hand-edited storage, or a build that predates the
       claim — must still land on the date the athlete will look for it on. */
    const rest=key.slice(prefix.length),cut=rest.indexOf("::");
    const date=cut<0?txt(v.date):rest.slice(0,cut);
    if(!parseISO(date))continue;
    const rec={key,date,day:cut<0?txt(v.day):rest.slice(cut+2),
      week:Math.max(1,Math.floor(Number(v.week)||1)),
      status:v.status==="sealed"?"sealed":"open",
      sealedAt:txt(v.sealedAt),exportedAt:txt(v.exportedAt),editedAt:txt(v.editedAt),
      lastSetAt:txt(v.lastSetAt),record:v};
    if(!byDate.has(date))byDate.set(date,[]);
    byDate.get(date).push(rec);
    const entries=(v.entries&&typeof v.entries==="object")?v.entries:{};
    Object.keys(entries).forEach(id=>{
      const e=entries[id];
      const sets=(e&&Array.isArray(e.sets))?e.sets:[];
      if(!sets.length)return;                 /* nothing was committed — nothing to show */
      logged.push({id,date,day:rec.day,week:rec.week,name:txt(e.name),sets});
    });
  }
  /* Ascending, so "the most recent one before this date" is a walk from the end. */
  logged.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  logged.forEach(r=>{
    if(r.id){if(!byId.has(r.id))byId.set(r.id,[]);byId.get(r.id).push(r);}
    const n=normName(r.name);
    if(n){if(!byName.has(n))byName.set(n,[]);byName.get(n).push(r);}
  });
  return {byDate,byId,byName};
}
function sessionIndex(){
  if(!SESSION_INDEX)SESSION_INDEX=buildSessionIndex();
  return SESSION_INDEX;
}
/* Every stored session filed on this date. More than one is allowed and listed —
   two sessions on one date is a real thing that happens, just not designed for. */
function sessionsOn(date){
  const list=sessionIndex().byDate.get(txt(date));
  return list?list.slice():[];
}
/* The most recent committed sets for this exercise from a session STRICTLY BEFORE
   `date`. Id first, then the normalised name; null when there is genuinely nothing,
   because the logger prints nothing rather than an empty row. */
function lastLoggedFor(ex,date){
  if(!ex||!parseISO(date))return null;
  const idx=sessionIndex();
  let best=null;
  /* Strictly greater, and ids are scanned first, so an id match wins a same-date tie. */
  const consider=r=>{if(r.date<date&&(!best||r.date>best.date))best=r;};
  (idx.byId.get(txt(ex.id))||[]).forEach(consider);
  (idx.byName.get(normName(ex.name))||[]).forEach(consider);
  return best;
}

/* ---------- set mutation ---------- */
/* The rest clock reads "time since you last logged anything", which is what you want
   between exercises as well as between sets — so the stamp is session-level, and every
   path that commits a set or a round takes the session in order to write it. There is no
   timer state anywhere: the display is always now − lastSetAt. */
function stampLastSet(s){if(s)s.lastSetAt=new Date().toISOString();}
function commitSet(e,unit,s){
  if(draftEmpty(e.draft))return false;
  const row={set:e.sets.length+1,load:txt(e.draft.load),reps:txt(e.draft.reps),
    rpe:txt(e.draft.rpe),painDuring:txt(e.draft.painDuring),note:txt(e.draft.note)};
  e.sets.push(row);
  e.draft=seedDraft(row);
  applyDerivedSummary(e,unit);
  stampLastSet(s);
  return true;
}
function deleteSet(e,idx,unit){
  e.sets.splice(idx,1);renumber(e);
  applyDerivedSummary(e,unit);
}
/* Only committed rows are exported, so a set the athlete typed but never confirmed would
   vanish. Anything that ends the athlete's time on an exercise must therefore commit a
   dirty draft first. Only *dirty* — a draft still showing the previous set's values is
   not a set that happened. */
function commitDraftIfDirty(e,unit,s){
  return draftDirty(e)?commitSet(e,unit,s):false;
}
function commitCircuitRound(e,s){
  if(!draftDirty(e))return false;
  e.sets.push({set:e.sets.length+1,load:txt(e.draft.load),
    reps:txt(e.draft.reps)||"As prescribed",rpe:txt(e.draft.rpe),
    painDuring:txt(e.draft.painDuring),note:txt(e.draft.note)});
  const c=e.circuit;c.rounds=e.sets.length;c.touched=true;e.draft=blankDraft();
  syncCircuitSummary(e);stampLastSet(s);return true;
}
/* The same thing for the exercise currently open in Log view, for callers that navigate
   away rather than holding the entry. Returns whether anything was committed, because a
   caller that does not immediately re-render would otherwise leave the card on screen
   holding a session object one set out of date. */
function flushDraft(){
  if(!PROGRAM||!STATE.day)return false;
  const exs=dayExercises(),ex=exs[STATE.focus];
  if(!ex)return false;
  const s=getSession(),e=s.entries[ex.id];
  const spec=circuitOf(ex);
  if(spec){
    if(!e||circuitState(e,ex).mode!=="details"||!commitCircuitRound(e,s))return false;
    saveSession(s);return true;
  }
  if(!e||!commitDraftIfDirty(e,metricOf(ex).unit,s))return false;
  saveSession(s);
  return true;
}

/* ---------- rendering ---------- */
function renderAll(){renderHeader();renderMain();}

/* The header carries only what has to be true while training: which session this is and
   how far through it you are. The date view states the date itself, so the context line
   only carries it in the focus logger. */
function renderHeader(){
  if(!PROGRAM){
    $("#ctxLine").textContent="Training Tracker";
    $("#ctxLine").classList.remove("off");
    $("#ctxSub").textContent="Import a program to begin";
    return;
  }
  const rev=progVersion();
  const today=STATE.date===todayISO();
  const ctx=$("#ctxLine");
  /* The date view states the date itself, larger, directly below — so the header only
     carries it in the focus logger, where there is no date head to read. Saying it
     twice on one screen is exactly the loose duplication this revamp removes. */
  if(viewMode()==="focus"){
    ctx.textContent=STATE.day
      ?`Week ${STATE.week} · ${dayParts(STATE.day).short} ${fmtDateShort(STATE.date)}`+(today?"":" · not today")
      :`Week ${STATE.week}`;
    ctx.classList.toggle("off",!today);
    $("#ctxSub").textContent=STATE.day?dayTheme(STATE.day):"No training days in this program";
  }else{
    ctx.textContent=PROGRAM.meta.block||"Training block";
    ctx.classList.remove("off");
    $("#ctxSub").textContent=`Week ${STATE.week} of ${PROGRAM.meta.weeks||"?"}`
      +(rev?` · v${rev}`:"");
  }
}
/* "Day 1 (Mon) - Clean Skill + Front Squat" -> {num:"D1", short:"Mon"} */
function dayParts(d){
  const m=/\(([A-Za-z]{3,9})\)/.exec(d||""), n=/Day\s*(\d+)/i.exec(d||"");
  return {num:n?"D"+n[1]:"", short:m?m[1]:((d||"").split(/[\s(-]/)[0]||"Day")};
}
/* …and the part after the dash, which names what the session actually is. Falls back to
   the whole label rather than to nothing — a generator need not use the dash. */
function dayTheme(d){
  const s=(d||"").trim();
  const m=/\s[-–—]\s(.+)$/.exec(s);
  return m?m[1].trim():s;
}
/* A date that isn't today is legitimate — it is how a session gets completed after the
   fact — but it is silent, and logging onto the wrong day can't be undone. Say it. */
function fmtDate(iso){
  try{
    const d=new Date(iso+"T00:00:00");
    if(isNaN(d.getTime()))return iso;
    return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  }catch(e){return iso;}
}
/* "Fri 4 Sep" — the date view's own headline, where the weekday IS the point. */
function fmtDateLong(iso){
  try{
    const d=parseISO(iso);
    if(!d)return txt(iso);
    return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  }catch(e){return txt(iso);}
}
/* How far from today, in words — the other half of the not-today cue on fmtDate(). */
function relDay(iso){
  const n=daysBetween(todayISO(),iso);
  if(n==null)return "";
  if(n===0)return "Today";
  if(n===-1)return "Yesterday";
  if(n===1)return "Tomorrow";
  return n<0?`${-n} days ago`:`in ${n} days`;
}
/* A stored instant, shown as a wall-clock time. Not a calendar day, so Date() is right. */
function fmtTime(iso){
  try{
    const d=new Date(txt(iso));
    return isNaN(d.getTime())?"":d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  }catch(e){return "";}
}
/* Same, without the weekday — the header already states that via the day name. */
function fmtDateShort(iso){
  try{
    const d=new Date(iso+"T00:00:00");
    if(isNaN(d.getTime()))return iso;
    return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
  }catch(e){return iso;}
}

/* ---------- view mode ----------
   "list"  — Overview: every exercise for the day, read-only, tap one to open it.
   "focus" — Log: one exercise, with prev/next and one pip per exercise in the header.
   Internal values kept as "list"/"focus" from the previous layout; only the on-screen
   wording changed to Overview/Log. */
function viewMode(){return SETTINGS.view==="focus"?"focus":"list";}
function setView(v){
  const next=v==="focus"?"focus":"list";
  const current=viewMode();
  if(next===current)return;
  if(current==="list")OVERVIEW_SCROLL=currentScrollY();
  if(next==="list")flushDraft();      /* leaving the editor ends the set in progress */
  /* renderHeader() reads the view, so it has to run again — see its own note. */
  setSetting("view",next);renderHeader();renderMain();
  if(next==="list")restoreOverviewScroll();else scrollTop();
}
function syncView(){
  const focus=viewMode()==="focus";
  $("#viewOverview").setAttribute("aria-pressed",String(!focus));
  $("#viewLog").setAttribute("aria-pressed",String(focus));
  $("#fExport").hidden=focus;
  $("#fNav").hidden=!focus;
  $("#pbar").hidden=focus;
  $("#pips").hidden=!focus;
}
function currentScrollY(){return Math.max(0,Number(window.scrollY??window.pageYOffset)||0);}
function scrollTop(){if(window.scrollTo)window.scrollTo(0,0);}
function restoreOverviewScroll(){if(window.scrollTo)window.scrollTo(0,OVERVIEW_SCROLL);}
function resetViewScroll(){OVERVIEW_SCROLL=0;scrollTop();}
/* Where to land when the session changes: the first thing not yet ticked off. */
function firstUndone(){
  const exs=dayExercises();
  if(!exs.length)return 0;
  const s=getSession();
  const i=exs.findIndex(e=>!(s.entries[e.id]&&s.entries[e.id].done));
  return i<0?exs.length-1:i;
}
function resetFocus(){STATE.focus=firstUndone();STATE.setEdit=null;}
function clampFocus(){
  const n=dayExercises().length,i=Math.floor(Number(STATE.focus));
  STATE.focus=n?Math.max(0,Math.min(Number.isFinite(i)?i:0,n-1)):0;
}
function goFocus(i){
  const n=dayExercises().length;if(!n)return;
  const next=Math.max(0,Math.min(i,n-1));
  STATE.setEdit=null;
  if(next===STATE.focus)return;
  flushDraft();                       /* before focus moves off the exercise it belongs to */
  STATE.focus=next;renderMain();scrollTop();
}
function stepFocus(d){goFocus(STATE.focus+d);}

function renderMain(){
  const m=$("#main");m.innerHTML="";
  if(!PROGRAM){
    const b=el("div",{className:"banner"},
      "No program.json loaded. Import the program.json from your Drive folder to begin.");
    const imp=el("button",{className:"primary"},"Import program…");
    imp.onclick=()=>$("#fileInp").click();
    b.append(el("div",{},imp));
    m.append(b);renderNav();updateProgress();return;
  }
  const s=getSession();
  const exs=dayExercises();
  const list=viewMode()!=="focus";
  /* The date, what is on it, and one action — first, before anything that qualifies it. */
  if(list)m.append(dateHead(s));
  /* v1 only: the rows on screen are the Week-1 template, so past week 1 the athlete
     has to apply the progression rule themselves. v2 authors every week, so the
     prescription shown IS this week's and the banner would be a lie. */
  if(!isV2()){
    const authoredWeeks=PROGRAM.exercises.map(e=>Number(e.week)||1);
    if(authoredWeeks.length&&STATE.week>Math.max(...authoredWeeks))
      m.append(el("div",{className:"banner"},`Week ${STATE.week}: prescriptions below are the Week-1 template — apply each exercise's Progression Rule for this week.`));
  }
  /* A rest day has no exercises and is not missing any — that is a different sentence
     from a day whose rows failed to resolve, and saying the wrong one reads as a bug. */
  if(!exs.length&&txt(STATE.day))m.append(el("div",{className:"banner"},isV2()
    ?`No exercises for week ${STATE.week} of this day in the program.`
    :"No exercises for this day in the program."));
  const orphans=orphanExercises();
  if(orphans.length)m.append(el("div",{className:"banner"},
    `${orphans.length} exercise${orphans.length>1?"s":""} on this day (${orphans.map(o=>o.name).join("; ")}) have no valid week and are not shown in any week. Re-generate program.json.`));
  clampFocus();
  let checkinHost=null;
  if(!list){
    if(exs.length)m.append(logCard(exs[STATE.focus],s,STATE.focus));
  }else{
    /* The check-in is above the exercise list and below the primary action: the data is
       worth asking for, but it must never stand between the athlete and a warm-up. */
    if(txt(STATE.day)){checkinHost=el("div",{id:"checkinHost"});m.append(checkinHost);}
    exs.forEach((ex,i)=>m.append(overviewCard(ex,s,i)));
    const foot=dateFoot(s);
    if(foot)m.append(foot);
  }
  renderNav();
  /* After the host is in the document, so renderCheckin() can find it by id. */
  if(checkinHost)renderCheckin();
  updateProgress(s);
}

/* The pip strip is rebuilt only when the set of exercises on screen changes; paintNav()
   keeps done-state and position current on every keystroke without rebuilding it. */
let PIPS=[];
let NAV_AT=-1;                    /* last STATE.focus the pip strip was scrolled to */
function renderNav(){
  syncView();
  const host=$("#pips");host.innerHTML="";PIPS=[];
  NAV_AT=-1;
  if(viewMode()!=="focus"||!PROGRAM)return;
  dayExercises().forEach((ex,i)=>{
    const b=el("button",{className:"pip",attrs:{title:ex.name,
      "aria-label":`Exercise ${i+1}: ${ex.name}`}},String(i+1));
    b.onclick=()=>goFocus(i);
    PIPS.push(b);host.append(b);
  });
}
function paintNav(sess){
  const exs=PROGRAM&&STATE.day?dayExercises():[];
  const s=exs.length?(sess||getSession()):null;
  PIPS.forEach((b,i)=>{
    const ex=exs[i],e=ex&&s?s.entries[ex.id]:null,st=entryState(e);
    b.setAttribute("data-done",st==="done"?"1":"0");
    b.setAttribute("data-part",st==="part"?"1":"0");
    b.setAttribute("aria-current",String(i===STATE.focus));
  });
  $("#navCount").textContent=exs.length
    ?`${Math.min(STATE.focus+1,exs.length)} / ${exs.length}`:"—";
  $("#prevBtn").disabled=STATE.focus<=0;
  $("#nextBtn").disabled=STATE.focus>=exs.length-1;
  /* Runs on every keystroke via saveSession() → updateProgress(). Scrolling the pip
     strip into view on every character (and while a soft keyboard is up) is what made
     the screen jump while typing — only actually do it when the position changes, and
     never while an input is focused. */
  if(STATE.focus!==NAV_AT){
    NAV_AT=STATE.focus;
    const active=document.activeElement,tag=active&&active.tagName;
    const typing=tag==="INPUT"||tag==="TEXTAREA";
    const cur=PIPS[STATE.focus];
    if(!typing&&cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"nearest"});
  }
}

/* Called on every autosave (saveSession → here), so it repaints state and never rebuilds
   structure. Accepts the session object already in hand so it never has to re-fetch and
   re-parse localStorage on every keystroke — see saveSession() and renderMain(). */
function updateProgress(sess){
  const fill=$("#pbarDone"),part=$("#pbarPart"),cnt=$("#progCount");
  if(!PROGRAM||!STATE.day){
    if(cnt)cnt.textContent="—";
    if(fill)fill.style.width="0";
    if(part)part.style.width="0";
    paintNav();return;
  }
  const s=sess||getSession();
  const exs=dayExercises();
  const states=exs.map(e=>entryState(s.entries[e.id]));
  const done=states.filter(st=>st==="done").length;
  const touched=states.filter(st=>st!=="todo").length;
  const pct=n=>(exs.length?Math.round(n/exs.length*100):0)+"%";
  fill.style.width=pct(done);
  /* A dimmer layer behind it, so a session with four exercises half-logged doesn't read
     as 0% through. Same bar, two truths: finished, and started. */
  part.style.width=pct(touched);
  cnt.textContent=`${done}/${exs.length} done`;
  /* The check-in is on screen rather than behind a tap, so its own status line is the
     only nag it needs. */
  const stat=$("#checkinStat");
  if(stat)stat.textContent=checkinSummary(s);
  paintNav(s);
}

/* `labelClass` is how the pain field gets accented on an exercise whose own prescription
   asks for a reading — see painAsked(). */
function field(labelText,node,unit,labelClass){
  const fld=el("div",{className:"fld"+(unit?" has-unit":"")},[node]);
  if(unit)fld.append(el("span",{className:"unit"},unit));
  return el("div",{},[el("label",{className:"lbl"+(labelClass?" "+labelClass:"")},labelText),fld]);
}

/* ---------- the session check-in ----------
   Sits near the top of the date view and NEVER gates Start — the primary action stays
   above it. `amPainOnWaking` describes the response to the PREVIOUS session, not this
   one. See docs/design-rationale.md for why it is never a gate. */
function sessionCard(s){
  const c=el("div",{className:"checkin"});
  c.dataset.readiness=SETTINGS.readiness?(s.session.readiness||""):"";
  c.append(el("div",{className:"ci-head"},[
    el("span",{className:"ci-title"},"Check-in"),
    el("span",{className:"ci-stat",id:"checkinStat"},checkinSummary(s))]));
  c.append(el("div",{className:"ci-note"},"How today began, not how it went — the response to your last session."));
  const wrap=el("div",{className:"log"});
  const mk=(k,label,type="text",attrs={},unit)=>{
    const inp=el("input",{type,value:s.session[k]??"",attrs});
    inp.oninput=()=>{s.session[k]=inp.value;saveSession(s);};
    return field(label,inp,unit);
  };
  /* First in the grid on purpose: for a tendon block this is the highest-value number in
     the file, and it is only true before training — asked late, it gets missed. */
  if(SETTINGS.painOnWaking)
    wrap.append(mk("amPainOnWaking",painLbl(" on waking"),"number",{min:0,max:10},"/10"));
  if(SETTINGS.readiness){
    const rd=el("select",{},["","Green","Amber","Red"].map(o=>
      el("option",{value:o,textContent:o||"Readiness…",selected:s.session.readiness===o})));
    rd.onchange=()=>{s.session.readiness=rd.value;saveSession(s);
      c.dataset.readiness=rd.value;};
    wrap.append(field("Readiness",rd));
  }
  if(SETTINGS.sleep)wrap.append(mk("sleep","Sleep","number",{min:1,max:5},"/5"));
  if(SETTINGS.bodyweight)wrap.append(mk("bodyweightKg","Bodyweight","number",{},"kg"));
  if(SETTINGS.hrvNote){
    const hrv=el("input",{type:"text",value:s.session.hrvNote||"",
      attrs:{placeholder:"e.g. HRV 62, at baseline"}});
    hrv.oninput=()=>{s.session.hrvNote=hrv.value;saveSession(s);};
    const f=field("HRV / notes",hrv);f.className="full";wrap.append(f);
  }
  if(wrap.children.length)c.append(wrap);
  const ov=el("textarea",{value:s.session.overall||"",attrs:{placeholder:"Overall session notes…"}});
  ov.oninput=()=>{s.session.overall=ov.value;saveSession(s);};
  c.append(el("div",{style:"margin-top:12px"},[el("label",{className:"lbl"},"Overall notes"),ov]));
  return c;
}

/* ---------- the date view ----------
   Opening a date shows the list first and focus second: focus-first is faster
   mid-session but disorienting on open, and reviewing a logged workout wants the list,
   not a single exercise. Hairlines and typographic hierarchy carry the structure — a
   date, what is on it, one action — rather than another nested card. */
function sessionProgressLine(s){
  const exs=dayExercises();
  if(!exs.length)return "Nothing prescribed for this day";
  const states=exs.map(ex=>entryState(s.entries[ex.id]));
  const done=states.filter(x=>x==="done").length;
  const touched=states.filter(x=>x!=="todo").length;
  return `${done} of ${exs.length} done`+(touched>done?` · ${touched-done} in progress`:"");
}
/* What a sealed day says about itself. "not exported" is worth saying out loud: the file
   still has to be put somewhere by hand, and the app is the only thing that knows. */
function sealLine(s){
  const at=fmtTime(s.sealedAt);
  const bits=["Finished"+(at?" "+at:"")];
  if(!txt(s.exportedAt))bits.push("not exported yet");
  else bits.push(editedSinceExport(s)?"edited since export":"exported");
  return bits.join(" · ");
}
/* Week AND day together, with the schedule's guess preselected — day-only
   would quietly serve the wrong week's prescription, which is worse than any navigation
   problem, because you would train off it. */
function openClaimPicker(){
  if(!PROGRAM)return;
  const days=dayLabels();
  if(!days.length){toast("This programme lists no training days.");return;}
  const weeks=SCHEDULE?SCHEDULE.weeks:1;
  const suggestion=scheduleForDate(STATE.date);
  let week=Math.min(weeks,Math.max(1,Number(STATE.week)||(suggestion?suggestion.week:1)));
  let day=txt(STATE.day)||(suggestion?suggestion.day:days[0]);
  const wrap=el("div");
  const stepper=el("div",{className:"stepper"});
  const dec=el("button",{className:"stepbtn",attrs:{"aria-label":"Previous week"}},"‹");
  const val=el("div",{className:"stepval tnum"});
  const inc=el("button",{className:"stepbtn",attrs:{"aria-label":"Next week"}},"›");
  const list=el("div",{className:"daylist"});
  const confirm=el("button",{className:"primary"},"");
  /* Rebuilt on a tap, never on a keystroke — there is no text input in this sheet. */
  const paint=()=>{
    val.textContent="Week "+week;
    dec.disabled=week<=1;inc.disabled=week>=weeks;
    list.innerHTML="";
    days.forEach(d=>{
      const p=dayParts(d);
      const b=el("button",{className:"dayitem",attrs:{"aria-pressed":String(d===day)}},[
        el("span",{className:"dnum"},p.num||"·"),
        el("span",{className:"dwrap"},[el("span",{className:"dday"},p.short),
          el("span",{className:"dtheme"},dayTheme(d))])]);
      b.onclick=()=>{day=d;paint();};
      list.append(b);
    });
    confirm.textContent=`Train Week ${week} · ${dayParts(day).num||dayParts(day).short}`;
  };
  dec.onclick=()=>{week=Math.max(1,week-1);paint();};
  inc.onclick=()=>{week=Math.min(weeks,week+1);paint();};
  confirm.onclick=()=>{sheetClose();applyClaim(week,day);};
  stepper.append(dec,val,inc);
  paint();
  const row=el("div",{className:"sheet-actions"});
  const cancel=el("button",{className:"ghost"},"Cancel");cancel.onclick=sheetClose;
  row.append(cancel,confirm);
  wrap.append(stepper,list,row);
  sheetOpen("Doing a different day?",
    suggestion?`${fmtDate(STATE.date)} · the schedule suggests Week ${suggestion.week} · ${dayParts(suggestion.day).short}. Nothing is moved — the session you create is what this date holds.`
              :`${fmtDate(STATE.date)} is a rest day on the schedule. Nothing is moved — the session you create is what this date holds.`,
    wrap);
}
function confirmFinish(){
  const s=getSession(),exs=dayExercises();
  const done=exs.filter(ex=>entryState(s.entries[ex.id])==="done").length;
  const left=exs.length-done;
  const body=el("div");
  body.append(sheetActions("Finish session",()=>{
    sealSession();renderMain();toast("Session finished");
  },"Keep logging"));
  sheetOpen("Finish this session?",

/* ---------- the hub ----------
   The hub answers "what am I doing today" before anything else and links to everything;
   the calendar below is the timeline its Recent rows are a shortcut into. Neither reads
   STATE — they are about dates other than the one open — so everything in both sections
   takes a stored record or an ISO date. */
/* Progress for a session we are not standing in, so it cannot call dayExercises(). */
function recordProgress(rec){
  const exs=sessionExercises(PROGRAM,rec.week,rec.day);
  const entries=(rec.record&&rec.record.entries)||{};
  const states=exs.map(ex=>entryState(entries[ex.id]));
  return {total:exs.length,
    done:states.filter(x=>x==="done").length,
    touched:states.filter(x=>x!=="todo").length};
}
function progressWords(p){
  if(!p.total)return "Nothing prescribed for this day";
  return `${p.done} of ${p.total} done`+(p.touched>p.done?` · ${p.touched-p.done} in progress`:"");
}
/* The last few stored sessions, newest first, excluding the date the hub already shows. */
function recentSessions(n,exclude){
  const out=[];
  sessionIndex().byDate.forEach(list=>list.forEach(r=>{if(r.date!==exclude)out.push(r);}));
  out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  return out.slice(0,Math.max(0,n));
}
/* The most recent scheduled date before `from` with nothing stored on it. Returns null
   as soon as the last scheduled day WAS trained, so this is an offer and never a list of
   accusations — a missed date stays quiet and greyed, exactly as the calendar shows it. */
function lastMissed(from){
  if(!SCHEDULE)return null;
  for(let i=1;i<=14;i++){
    const d=addDays(from,-i);
    if(!d)break;
    const off=daysBetween(SCHEDULE.anchorMonday,d);
    if(off==null||off<0)break;
    const hit=scheduleForDate(d);
    if(!hit)continue;
    if(sessionsOn(d).length)return null;
    return {date:d,week:hit.week,day:hit.day};
  }
  return null;
}
