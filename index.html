/* ---------- the calendar ----------
   The block's weeks labelled W1–Wn, dates outside it present but plain. A cell holds the
   date number and one state mark and nothing more — see .cal for the width budget that
   forces that. */
const CAL_DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function calendarRange(){
  const today=todayISO();
  let first=SCHEDULE?addDays(SCHEDULE.anchorMonday,-7):mondayOf(today);
  let last=SCHEDULE?addDays(SCHEDULE.anchorMonday,SCHEDULE.weeks*7+6):addDays(mondayOf(today),13);
  /* A session logged outside the block still has to be findable. */
  sessionIndex().byDate.forEach((_,date)=>{
    if(date<first)first=mondayOf(date);
    if(date>last)last=addDays(mondayOf(date),6);
  });
  if(mondayOf(today)<first)first=mondayOf(today);
  if(addDays(mondayOf(today),6)>last)last=addDays(mondayOf(today),6);
  return {first,last};
}
/* One mark per cell. "claimed" is a session that exists with nothing logged in it yet;
   "scheduled" is a date the plan wants and nothing has happened on — greyed and quiet,
   never red and never rolled forward. */
function calendarMark(iso){
  const stored=sessionsOn(iso);
  if(stored.length){
    if(stored.some(r=>r.status==="sealed"))return "sealed";
    return stored.some(r=>recordProgress(r).touched>0)?"part":"claimed";
  }
  return scheduleForDate(iso)?"scheduled":"none";
}
const CAL_GLYPH={sealed:"✓",part:"◐",claimed:"○",scheduled:"",none:""};
/* The one number the tendon protocol tracks over time, and the calendar is the only
   place a trend in it would ever be visible. Shown only when the athlete tracks it at
   all: an athlete who does not sees no mark and no legend entry, not a greyed one. */
function calendarPain(iso){
  if(!SETTINGS.painOnWaking)return 0;
  let worst=0;
  sessionsOn(iso).forEach(r=>{
    const v=parseNum((r.record&&r.record.session&&r.record.session.amPainOnWaking)||"");
    if(v!=null&&v>worst)worst=v;
  });
  return worst;
}
function calendarLegend(){
  const box=el("div",{className:"cal-legend"});
  const item=(mark,label)=>box.append(el("span",{className:"cl-item"},[
    el("span",{className:"cl-mark",attrs:{"data-state":mark,"aria-hidden":"true"}},CAL_GLYPH[mark]||""),
    label]));
  item("sealed","finished");
  item("part","logged, not finished");
  item("claimed","started");
  item("scheduled","scheduled");
  if(SETTINGS.painOnWaking)box.append(el("span",{className:"cl-item"},[
    el("span",{className:"cl-pain",attrs:{"data-level":"mid","aria-hidden":"true"}}),
    painLbl(" on waking").toLowerCase()]));
  return box;
}
function renderCalendar(){
  const host=$("#pageBody");if(!host)return;
  host.innerHTML="";
  if(!PROGRAM){
    host.append(el("p",{className:"page-copy"},
      "Import a programme and the block appears here as dates."));
    return;
  }
  const today=todayISO();
  const range=calendarRange();
  const grid=el("div",{className:"cal"});
  grid.append(el("div",{className:"cal-corner",attrs:{"aria-hidden":"true"}},""));
  CAL_DOW.forEach(d=>grid.append(el("div",{className:"cal-dow"},d)));
  let todayCell=null;
  for(let monday=range.first;monday&&monday<=range.last;monday=addDays(monday,7)){
    const off=SCHEDULE?daysBetween(SCHEDULE.anchorMonday,monday):null;
    const week=(off!=null&&off>=0&&off%7===0&&off/7<SCHEDULE.weeks)?off/7+1:0;
    grid.append(el("div",{className:"cal-week"+(week?"":" out")},week?"W"+week:"·"));
    for(let i=0;i<7;i++){
      const iso=addDays(monday,i);
      const mark=calendarMark(iso);
      const pain=calendarPain(iso);
      const cell=el("button",{className:"cal-cell",attrs:{
        "data-state":mark,"data-today":String(iso===today),
        "aria-label":`${fmtDate(iso)} — ${CAL_STATE_WORDS[mark]}`}},[
        el("span",{className:"cc-num tnum"},String(Number(iso.slice(8,10)))),
        el("span",{className:"cc-mark",attrs:{"aria-hidden":"true"}},CAL_GLYPH[mark]||"")]);
      if(pain>0)cell.append(el("span",{className:"cc-pain",
        attrs:{"data-level":pain>=4?"high":"mid","aria-hidden":"true"}}));
      cell.onclick=()=>gotoDate(iso,"calendar");
      if(iso===today)todayCell=cell;
      grid.append(cell);
    }
  }
  host.append(grid);
  host.append(calendarLegend());
  /* Land on the week the athlete is in, not at the top of a two-month scroll. */
  if(todayCell&&todayCell.scrollIntoView)
    setTimeout(()=>{try{todayCell.scrollIntoView({block:"center"});}catch(e){}},0);
}
const CAL_STATE_WORDS={sealed:"finished",part:"logged, not finished",claimed:"started",
  scheduled:"scheduled, not done",none:"nothing scheduled"};

/* ---------- exercise head (shared by Overview and Log) ----------
   The one place both surfaces draw from, so they cannot drift: category rail colour
   (set by the caller), name, and the prescription folded into one or two plain lines —
   no separate hero number, no pill-chip row. Everything past this point is where the
   two views genuinely differ (read-only status line vs. the set editor), which is why
   they are two bodies rather than one branchy card builder. */
/* The prescription, as [emphasised sets×reps, the rest as one muted string]. Two nodes
   rather than one string so the target numbers can carry weight while the prose around
   them stays quiet; it is still one wrapping line, not a hero number and a chip row. */
function rxLine(ex){
  const bits=[];
  if(ex.load)bits.push(ex.load);
  /* No "RPE " prefix here — the generator's own prescribed value already carries it
     ("RPE 5-6") or is prose that doesn't want one ("Pain <=3/10; effort 6-7/10"). */
  if(ex.rpe)bits.push(ex.rpe);
  const rest=bits.join(" · ");
  return [el("span",{className:"rx-x"},`${ex.sets||"?"} × ${ex.reps||"?"}`),
          rest?" · "+rest:null];
}
function metaLine(ex){
  const bits=[];
  if(ex.tempo&&ex.tempo!=="-")bits.push("Tempo "+ex.tempo);
  if(ex.rest&&ex.rest!=="-")bits.push("Rest "+ex.rest);
  return bits.join(" · ");
}
function exerciseHead(ex){
  const nodes=[el("div",{className:"ex-name"},ex.name),
               el("div",{className:"rx"},rxLine(ex))];
  const meta=metaLine(ex);
  if(meta)nodes.push(el("div",{className:"rx meta"},meta));
  return nodes;
}

function collapse(title,body){
  const d=el("details");d.append(el("summary",{},title));d.append(el("div",{className:"body"},body));return d;
}

const txtCol=(rows,k)=>rows.map(x=>txt(x[k])).filter(Boolean);
/* The one-line summary on a done Overview card. Prefers the set shape when the sets
   actually disagree — "100 → 80 → 80" says set 1 was wrong — over the flat fields, which
   are the headline once they agree. Returns "" when there is genuinely nothing, and the
   caller words that: an exercise finished with nothing logged is a legitimate warm-up,
   not an error. */
function summaryText(e){
  const b=[];
  const sets=Array.isArray(e.sets)?e.sets:[];
  const loads=txtCol(sets,"load");
  if(loads.length>1&&new Set(loads).size>1)b.push(loads.join(" → "));
  else if(txt(e.load))b.push(txt(e.load));
  else if(loads.length)b.push(loads[0]+(loads.length>1?` ×${loads.length}`:""));

  if(txt(e.reps))b.push(txt(e.reps));
  else if(txtCol(sets,"reps").length)b.push(txtCol(sets,"reps").join("/"));

  const rpe=txt(e.rpe)||txtCol(sets,"rpe").slice(-1)[0];
  if(rpe)b.push("RPE "+rpe);

  if(SETTINGS.painPerExercise){
    const pain=txt(e.painDuring)||txtCol(sets,"painDuring").sort().slice(-1)[0];
    if(pain)b.push(painLbl().toLowerCase()+" "+pain+"/10");
  }
  return b.join(" · ");
}
/* What this exercise's card says about itself. There is always a line: an absent one
   reads as "untouched", which cannot be told apart from "the status didn't render", and
   it would leave a typed-but-uncommitted set completely invisible outside the editor —
   the likeliest cause of "I did that set and Overview shows nothing". */
function statusLine(ex,e){
  const st=entryState(e),n=(e.sets||[]).length;
  /* No tick in the text either — the badge beside it carries that, and the line is better
     spent on what was actually logged. */
  if(st==="done")return summaryText(e)||"Skipped — no sets logged";
  if(st==="todo")return "Not started";
  const spec=circuitOf(ex);
  if(spec){
    const c=circuitState(e,ex),rounds=Math.max(Number(c.rounds)||0,n);
    if(c.mode==="final")return summaryText(e)||"Result in progress";
    if(rounds)return spec.target?`${rounds} of ${spec.target} rounds completed`:
      `${rounds} round${rounds===1?"":"s"} completed`;
    return "Round in progress — not logged yet";
  }
  if(!n)return `Set 1 typed — not logged yet`;
  return `${n} of ${targetSets(ex,e)} sets logged`
    +(draftDirty(e)?` · set ${n+1} in progress`:"");
}
const STATE_BADGE={done:"✓",part:"◐",todo:"○"};

/* ---------- overview card (read-only) ----------
   Zero inputs — that is the whole point of it being separate from the Log card. Tap
   anywhere on it to open the exercise in Log view. */
function overviewCard(ex,s,idx){
  const e=entryFor(s,ex);
  const cat=catOf(ex);
  const st=entryState(e),line=statusLine(ex,e);
  const c=el("div",{className:"card ov"+(e.done?" done":""),
    attrs:{role:"button",tabindex:"0","aria-label":`Open ${ex.name} in Log view — ${line}`}});
  if(cat)c.style.setProperty("--cat",cat.color);
  c.append(el("span",{className:"rail"}));
  const body=el("div",{className:"grow"});
  body.append(...exerciseHead(ex));
  body.append(el("div",{className:"ov-status",attrs:{"data-state":st}},line));
  /* One glyph, right-aligned down the column, so the whole session's state reads in one
     vertical scan rather than by parsing six sentences. */
  c.append(el("div",{className:"ov-row"},[body,
    el("span",{className:"ov-badge",attrs:{"data-state":st,"aria-hidden":"true"}},
      STATE_BADGE[st])]));
  const open=()=>{STATE.setEdit=null;STATE.focus=idx;setView("focus");};
  c.onclick=open;
  c.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();open();}};
  return c;
}

/* One committed set, in as few characters as it can be said in: "60×4", or whichever of
   the two exists. Used for the recap strip and for the toast that confirms a commit. */
function setRecap(r,unit){
  const load=txt(r.load),reps=withUnit(txt(r.reps),unit),rpe=txt(r.rpe);
  if(load&&reps)return load+"×"+reps;
  return load||reps||(rpe?"RPE "+rpe:"")||"✓";
}
/* Is there a pain reading anywhere on this entry? "0" counts — a logged zero is a real
   reading and the whole point of asking. */
function painLogged(e){
  return !!(txt(e.painDuring)||txtCol(Array.isArray(e.sets)?e.sets:[],"painDuring").length);
}
/* Which chip to pulse, and which set's note was opened by hand. Both are "what happened
   a moment ago" rather than state — in memory, consumed by the next redraw. */
let JUST=null,NOTE_OPEN=null;

function advanceFrom(ex,e,s,idx,onchange,message){
  const addAnother=()=>{const latest=getSession(),current=latest.entries[ex.id]||(latest.entries[ex.id]=blankEntry());
    current.done=false;current.setTarget=Math.min(12,Math.max(targetSets(ex,current)+1,current.sets.length+1));
    STATE.focus=idx;STATE.setEdit=null;saveSession(latest);renderMain();scrollTop();};
  if(viewMode()==="focus"&&idx===STATE.focus&&idx<dayExercises().length-1){
    STATE.focus=idx+1;STATE.setEdit=null;renderMain();scrollTop();
  }else onchange("");
  const nudge=painAsked(ex)&&!painLogged(e)?` · no ${painLbl().toLowerCase()} logged`:"";
  toast((message||"Exercise complete")+nudge,{label:"Add set",onclick:addAnother});
}

function openAdjustSets(ex,e,s,onchange){
  const prescribed=prescribedSets(ex),floor=Math.max(e.sets.length+1,1);
  const wrap=el("div"),box=el("div",{className:"adjustbox"});
  const minus=el("button",{attrs:{"aria-label":"Plan one set fewer"}},"−");
  const plus=el("button",{attrs:{"aria-label":"Plan one set more"}},"+");
  const value=el("div",{className:"adjustvalue"});
  const paint=()=>{const n=targetSets(ex,e);value.innerHTML="";
    value.append(el("strong",{className:"tnum"},`${n} set${n===1?"":"s"}`),
      el("span",{},`${prescribed} prescribed`));minus.disabled=n<=floor;plus.disabled=n>=12;};
  minus.onclick=()=>{e.setTarget=Math.max(floor,targetSets(ex,e)-1);saveSession(s);paint();};
  plus.onclick=()=>{e.setTarget=Math.min(12,targetSets(ex,e)+1);saveSession(s);paint();};
  box.append(minus,value,plus);paint();wrap.append(box,
    el("div",{className:"sheet-copy",style:"margin-top:12px"},
      "This changes today's plan only. The original prescription stays in the exported log."));
  sheetOpen("Adjust planned sets",`Set ${e.sets.length+1} is next.`,wrap,()=>onchange(""));
}

function confirmEndExercise(ex,e,s,idx,onchange,metric){
  const spec=circuitOf(ex);
  const before=e.sets.length+(draftDirty(e)?1:0),target=targetSets(ex,e);
  const none=spec?!circuitHasData(e):before===0,title=none?"Skip this exercise?":spec?"End this circuit?":"End this exercise?";
  const copy=none?"No work will be recorded. The exercise will remain visible as skipped in the session.":spec?
    "Everything logged so far will be kept. The original workout remains unchanged.":
    `${before} of ${target} planned sets will be recorded. Your original prescription is not changed.`;
  const primary=none?"Skip exercise":spec?"End circuit":`End after ${before} set${before===1?"":"s"}`;
  const body=el("div");body.append(sheetActions(primary,()=>{
    if(spec&&circuitState(e,ex).mode==="details")commitCircuitRound(e,s);
    else if(!spec)commitDraftIfDirty(e,metric.unit,s);
    e.done=true;if(spec){if(circuitState(e,ex).mode==="final")syncFinalCircuit(ex,e);else syncCircuitSummary(e);}saveSession(s);
    if(viewMode()==="focus"&&idx===STATE.focus&&idx<dayExercises().length-1){
      STATE.focus=idx+1;STATE.setEdit=null;renderMain();scrollTop();
    }else onchange("");
    toast(none?"Exercise skipped":spec?"Circuit ended":`Exercise ended after ${e.sets.length} set${e.sets.length===1?"":"s"}`);
  },"Keep logging"));
  sheetOpen(title,copy,body);
}

/* ---------- the focus logger's instruments ----------
   One exercise, one set, and — visible at the same time — the exercise name, its
   prescription, the sets already committed, the current set's fields, the rest clock,
   and what was lifted for this exercise last time. Legibility is the binding constraint
   here rather than restraint: someone mid-session is tracking rest, target load, RPE and
   pain at once, and all of it has to be readable at arm's length, one-handed, with
   chalked hands. */

/* The rest clock counts UP from the last logged set, hiding itself past a quarter of an
   hour. Passive by design — see docs/design-rationale.md.

   It cannot get buggy, by construction, and that must stay true: committing a set writes
   `lastSetAt`, and the display is always now − lastSetAt, recomputed by a single interval
   that ONLY repaints. There is no timer state to drift, corrupt or desynchronise, so it
   survives a reload, a backgrounded tab and an iOS PWA being killed, and the worst case
   is a stale number for one repaint. Nothing in the log path may read it. */
const REST_HIDE_S=15*60;
let REST_TICK=null,REST_NODE=null;
/* The prescribed rest in seconds, when the generator gave something countable. A UNIT IS
   REQUIRED: every rest value in a real programme carries one ("90 sec", "2.5-3 min",
   "~90 sec between rounds"), and guessing at a bare number would read 90 as an hour and
   a half. Prose like "As needed", "Included" or "-" simply leaves the clock unmarked.
   A range takes its LOWER bound — the mark says "you may go", not "you must wait". */
function parseRestSeconds(ex){
  const m=/(\d+(?:\.\d+)?)\s*(?:[-–—]\s*\d+(?:\.\d+)?\s*)?(sec(?:onds?|s)?|min(?:utes?|s)?|s|m)\b/i
    .exec(txt(ex&&ex.rest));
  if(!m)return 0;
  const n=parseFloat(m[1]);
  if(!Number.isFinite(n)||n<=0)return 0;
  return Math.round(n*(/^m/i.test(m[2])?60:1));
}
/* Seconds since the session last had a set committed. null when nothing has been logged,
   which is the difference between "no rest yet" and "no rest needed". */
function restSeconds(s,now){
  const at=txt(s&&s.lastSetAt);
  if(!at)return null;
  const t=new Date(at).getTime();
  if(isNaN(t))return null;
  return Math.max(0,Math.round(((now||Date.now())-t)/1000));
}
function fmtClock(sec){
  const n=Math.max(0,Math.round(Number(sec)||0));
  return `${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
}
function restClockNode(ex,s){
  const target=parseRestSeconds(ex);
  /* aria-live off on purpose: a value that changes every second must never be announced. */
  const node=el("div",{className:"restclock",attrs:{"aria-live":"off"}});
  const value=el("span",{className:"rc-value tnum"});
  const label=el("span",{className:"rc-label"});
  node.append(value,label);
  node._paint=()=>{
    const sec=restSeconds(s);
    if(sec==null||sec>REST_HIDE_S){node.hidden=true;return;}
    node.hidden=false;
    value.textContent=fmtClock(sec);
    node.setAttribute("data-ready",String(!target||sec>=target));
    label.textContent=target?`rest · ${fmtClock(target)} prescribed`:"since last set";
  };
  node._paint();
  return node;
}
/* One interval for the whole app, and it only ever repaints. It stops itself once the
   node it was painting has left the document, so a rebuild never leaves a second one
   running. */
function startRestTick(node){
  REST_NODE=node||null;
  if(REST_TICK||typeof setInterval!=="function")return;
  REST_TICK=setInterval(()=>{
    const n=REST_NODE;
    if(!n||typeof n._paint!=="function"||n.isConnected===false){
      if(typeof clearInterval==="function")clearInterval(REST_TICK);
      REST_TICK=null;REST_NODE=null;return;
    }
    n._paint();
  },1000);
}

/* "Last time" is the other half of the instrument: the number you are aiming at, on
   screen instead of in your head. The same set number's load × reps where it exists,
   else the top set, always with how long ago. Deliberately NOT coloured as a target — it
   is a fact about the past, and making it green would quietly turn it into a
   prescription. Silent when there is nothing, rather than printing an empty row. */
function heaviestSet(rows){
  let best=rows[0];
  rows.forEach(r=>{
    const a=parseNum(r.load),b=parseNum(best.load);
    if(a!=null&&(b==null||a>b))best=r;
  });
  return best;
}
function agoWords(n){
  if(n==null)return "";
  if(n<=0)return "today";
  if(n===1)return "yesterday";
  if(n<14)return n+" days ago";
  const weeks=Math.round(n/7);
  return weeks<9?weeks+" weeks ago":Math.round(n/30)+" months ago";
}
function lastTimeNode(ex,e){
  const rec=lastLoggedFor(ex,STATE.date);
  if(!rec||!rec.sets.length)return null;
  const n=((e&&Array.isArray(e.sets))?e.sets.length:0)+1;
  const same=rec.sets[n-1];
  const row=same||heaviestSet(rec.sets);
  if(!row)return null;
  const value=[txt(row.load),withUnit(txt(row.reps),metricOf(ex).unit)]
    .filter(Boolean).join(" × ");
  if(!value)return null;
  return el("div",{className:"lasttime"},[
    el("span",{className:"lt-label"},same?`Set ${n} last time`:"Top set last time"),
    el("span",{className:"lt-value tnum"},value),
    el("span",{className:"lt-ago"},agoWords(daysBetween(rec.date,STATE.date)))]);
}
/* The two instruments on one rule. If the clock has nothing to say it hides itself and
   "last time" has the row to itself — on a 320×568 screen every row above the fields is
   a row the primary action moves down by. */
function instrumentRail(ex,e,s){
  const rail=el("div",{className:"instrument"});
  const clock=restClockNode(ex,s);
  rail.append(clock);
  const last=lastTimeNode(ex,e);
  if(last)rail.append(last);
  startRestTick(clock);
  return rail;
}

/* ---------- the set editor (Log view) ----------
   Always exactly one set's fields on screen: the draft (the next new set) or, while
   STATE.setEdit names a committed row, that row instead. Every oninput here writes
   straight into the row/draft and autosaves — nothing here may rebuild a container an
   input lives in; only a button tap (commit / save / cancel / delete / finish / add-note)
   may call `onchange`, which redraws and — since it follows a tap, not a keystroke — is
   free to focus a field so the keyboard never has to be reopened by hand. */
function buildSetEditor(host,ex,e,s,idx,onchange,focusOn){
  const rows=e.sets;
  const target=targetSets(ex,e);
  const metric=metricOf(ex);
  const asked=painAsked(ex);
  if(e.done){
    if(rows.length)host.append(el("div",{className:"setrecap"},[
      el("span",{className:"rl"},"Completed"),
      el("span",{className:"rv tnum"},rows.map(r=>setRecap(r,metric.unit)).join(" · "))]));
    else host.append(el("div",{className:"setlabel"},"Exercise skipped — no sets logged"));
    const actions=el("div",{className:"setactions mainrow"});
    const reopen=el("button",{className:"ghost"},"Reopen exercise");
    reopen.onclick=()=>{e.done=false;saveSession(s);onchange("");};
    const add=el("button",{className:"primary"},"Add another set");
    add.onclick=()=>{e.done=false;e.setTarget=Math.min(12,Math.max(target+1,rows.length+1));saveSession(s);onchange("");};
    actions.append(reopen,add);host.append(actions);return;
  }
  const editIdx=(STATE.setEdit!=null&&STATE.setEdit>=0&&STATE.setEdit<rows.length)?STATE.setEdit:null;
  const draftMode=editIdx===null;
  const curPos=draftMode?rows.length:editIdx;
  const curNum=curPos+1;
  const total=Math.max(target,curNum,rows.length+(draftMode?1:0));

  /* What has actually gone in, spelled out. Without it, committing changes almost nothing
     on screen — the next draft is seeded from the set just logged, so the fields read the
     same — and nothing feels recorded. */
  if(rows.length){
    host.append(el("div",{className:"setrecap"},[
      el("span",{className:"rl"},"Logged"),
      el("span",{className:"rv tnum"},rows.map(r=>setRecap(r,metric.unit)).join(" · "))]));
  }

  const just=(JUST&&JUST.id===ex.id)?JUST.n:0;
  JUST=null;
  const chips=el("div",{className:"setchips"});
  for(let i=0;i<total;i++){
    if(i<rows.length){
      /* A logged set: tap to edit it (Save/Cancel/Delete live in the field group below). */
      const chip=el("button",{className:"setchip"+(i+1===just?" just":""),
        attrs:{"data-state":i===editIdx?"current":"done",
          "aria-label":`Set ${i+1} — ${setRecap(rows[i],metric.unit)}. Tap to edit.`}},String(i+1));
      chip.onclick=()=>{STATE.setEdit=(i===editIdx)?null:i;onchange();};
      chips.append(chip);
    }else if(i===curPos){
      /* The slot being typed into. Inert — you are already here. */
      chips.append(el("span",{className:"setchip",
        attrs:{"data-state":"current","aria-label":"Set "+(i+1)+", in progress"}},String(i+1)));
    }else{
      /* An upcoming slot is a plan, not a destination and not a delete button. It must
         stay a plain placeholder: it reads as "jump to set 4", so a live control here
         would drop sets on one unconfirmed tap. The count is changed in the secondary
         Adjust sets sheet, where it cannot be hit by accident. */
      chips.append(el("span",{className:"setchip",
        attrs:{"data-state":"todo","aria-hidden":"true"}},String(i+1)));
    }
  }
  /* A strip holding one chip says nothing that "Set 1 of 1" doesn't, and it costs 40px of
     height on every warm-up and every AMRAP row — which is what pushes the primary action
     off a 320px screen. */
  if(total>1)host.append(chips);

  const labelRow=el("div",{className:"setlabelrow"});
  labelRow.append(el("div",{className:"setlabel"},`Set ${curNum} of ${total}`));
  host.append(labelRow);

  const data=draftMode?e.draft:rows[editIdx];
  const grid=el("div",{className:"setgrid"+(SETTINGS.painPerExercise?"":" nopain")});
  const commonAttrs={autocapitalize:"off",autocorrect:"off",spellcheck:"false"};
  const onFieldInput=()=>{
    /* A draft the athlete has typed into is a set that happened — flag it so ending early and
       every navigation commit it rather than throwing it away. */
    if(draftMode)e.draft.dirty=true;
    else applyDerivedSummary(e,metric.unit);
    saveSession(s);
  };
  const loadInp=el("input",{type:"text",value:data.load??"",
    attrs:{placeholder:"kg",inputmode:"decimal","aria-label":"Load",...commonAttrs}});
  loadInp.oninput=()=>{data.load=loadInp.value;onFieldInput();};
  /* The two values the athlete is actually aiming at get the instrument treatment: big
     tabular numerals on a rule. Marked here rather than by grid position, so reordering
     the row cannot silently move the emphasis. */
  const loadField=field("Load",loadInp);loadField.className="big";
  grid.append(loadField);
  /* Not inputmode="numeric": that is a digits-only keypad on iOS, and two prescriptions
     in five here are a duration, a distance or prose. metricOf() decides what this field
     is called, what unit it carries and which keyboard it opens. */
  const repsInp=el("input",{type:"text",value:data.reps??"",
    attrs:{placeholder:metric.placeholder,inputmode:metric.inputmode,
      "aria-label":metric.label+(ex.reps?", prescribed "+txt(ex.reps):""),
      autocapitalize:metric.autocap,autocorrect:"off",spellcheck:"false"}});
  repsInp.oninput=()=>{data.reps=repsInp.value;onFieldInput();};
  const repsField=field(metric.fieldLabel,repsInp);repsField.className="big";
  grid.append(repsField);
  /* text + inputmode, not type=number: a number input reports "" while the value is an
     incomplete float like "7.", so the autosaved RPE would flicker to blank mid-type.
     This is also what lets RPE hold a half point ("7.5") — see CLAUDE.md. */
  const rpeInp=rpeButton(data.rpe,ex.rpe,v=>{data.rpe=v;onFieldInput();onchange("");});
  grid.append(field("RPE",rpeInp));
  if(SETTINGS.painPerExercise){
    const painInp=el("input",{type:"number",value:data.painDuring??"",
      attrs:{min:0,max:10,placeholder:"0",
        "aria-label":painLbl()+(asked?" — this exercise asks for it":"")}});
    painInp.oninput=()=>{data.painDuring=painInp.value;onFieldInput();};
    /* Accented, never hidden: the field exists on every exercise so an empty value stays
       readable as "no pain", and `tracking.painPerExercise` keeps meaning what it says. */
    /* The site alone, not "Knee pain": this column is about 70px and the label is now
       uppercase and letterspaced, so the full wording ellipses — and the /10 beside it
       already says it is a score. Same reasoning as Dist over Distance. The aria-label
       above keeps the full wording. */
    grid.append(field(painLblShort(),painInp,"/10",asked?"asked":""));
  }
  host.append(grid);

  const noteOpen=!!txt(data.note)||
    !!(NOTE_OPEN&&NOTE_OPEN.id===ex.id&&NOTE_OPEN.n===curNum&&NOTE_OPEN.edit===!draftMode);
  if(noteOpen){
    const note=el("input",{type:"text",value:data.note||"",
      attrs:{placeholder:`Set ${curNum} note…`,"aria-label":`Set ${curNum} note`}});
    /* Through onFieldInput, so a note-only set ("felt the knee on rep 3") is dirty too and
       gets committed rather than dropped when the exercise ends. */
    note.oninput=()=>{data.note=note.value;onFieldInput();};
    host.append(el("div",{className:"setnoteinp"},note));
    if(focusOn==="note"&&note.focus)note.focus();
  }else{
    /* Most sets have no note, and an always-present empty field pushed the primary action
       down a row for nothing. */
    const add=el("button",{className:"ghost mini addnote"},"+ note");
    add.onclick=()=>{NOTE_OPEN={id:ex.id,n:curNum,edit:!draftMode};onchange("note");};
    host.append(el("div",{className:"setnoteinp"},add));
  }

  /* Two rows, and neither wraps: one unmistakable primary action, and the quieter things
     beneath it at equal width. The main set action remains the obvious next tap. */
  const mainrow=el("div",{className:"setactions mainrow"});
  const subrow=el("div",{className:"setactions subrow"});
  if(!draftMode){
    const save=el("button",{className:"primary"},`Save set ${curNum}`);
    save.onclick=()=>{STATE.setEdit=null;saveSession(s);onchange();};
    const cancel=el("button",{className:"ghost"},"Cancel");
    cancel.onclick=()=>{STATE.setEdit=null;onchange();};
    const del=el("button",{className:"ghost danger"},"Delete set");
    let armed=false;
    del.onclick=()=>{
      if(!armed){armed=true;del.textContent="Tap again to delete";del.classList.add("armed");
        setTimeout(()=>{armed=false;},4000);return;}
      deleteSet(e,editIdx,metric.unit);STATE.setEdit=null;saveSession(s);onchange();
    };
    mainrow.append(save);
    subrow.append(cancel,del);
  }else{
    const finalPlanned=rows.length===target-1;
    const commit=el("button",{className:"primary"},finalPlanned?"Log final set":
      (rows.length<target?`Log set ${curNum} of ${target}`:"Log another set"));
    commit.onclick=()=>{
      /* Say why nothing happened — silence here cannot be told apart from a dead app. */
      if(!commitSet(e,metric.unit,s)){toast("Nothing to log yet — add a load, "+
        metric.label.toLowerCase()+" or RPE");return;}
      const n=e.sets.length;
      saveSession(s);
      JUST={id:ex.id,n};
      if(navigator.vibrate)try{navigator.vibrate(12);}catch(err){}
      if(finalPlanned){e.done=true;saveSession(s);
        advanceFrom(ex,e,s,idx,onchange,`Exercise complete · ${n} sets logged`);}
      else{toast(`Set ${n} logged · ${setRecap(e.sets[n-1],metric.unit)}`);onchange();}
    };
    mainrow.append(commit);
  }
  host.append(mainrow,subrow);

  if(draftMode){const secondary=el("div",{className:"setsecondary"});
    const adjust=el("button",{className:"quietaction"},"Adjust sets");
    adjust.onclick=()=>openAdjustSets(ex,e,s,onchange);
    const n=rows.length+(draftDirty(e)?1:0);
    const end=el("button",{className:"quietaction"},n?`End after ${n} of ${target}`:"Skip exercise");
    end.onclick=()=>confirmEndExercise(ex,e,s,idx,onchange,metric);
    secondary.append(adjust,end);host.append(secondary);}

}

/* ---------- summary & notes (collapsed, inside Log view) ----------
   The flat load/reps/RPE/pain fields, auto-filled from the sets and editable — editing
   one here is a deliberate override and stops it following future sets (summaryAuto).
   Kept collapsed: the athlete never has to open it, but it is theirs to correct. */
function buildSummaryPanel(host,ex,e,s){
  host.innerHTML="";
  const wrap=el("div",{className:"log tight"+(SETTINGS.painPerExercise?"":" nopain")});
  const mk=(k,label,type,attrs,unit)=>{
    const inp=el("input",{type,value:e[k]??"",attrs});
    inp.oninput=()=>{e[k]=inp.value;e.summaryAuto=false;saveSession(s);};
    return {inp,node:field(label,inp,unit)};
  };
  const metric=metricOf(ex);
  const load=mk("load","Load","text",{placeholder:"90"},"kg");
  /* Named for what this exercise measures, like the per-set field — "Sets × reps" over a
     value of "3x45s" was its own small lie. */
  const reps=mk("reps",metric.label==="Result"?"Result":"Sets × "+metric.label.toLowerCase(),
    "text",{placeholder:"4×"+metric.placeholder});
  const rpeBtn=rpeButton(e.rpe,ex.rpe,v=>{e.rpe=v;e.summaryAuto=false;saveSession(s);buildSummaryPanel(host,ex,e,s);},"Summary RPE");
  const rpe={inp:rpeBtn,node:field("RPE",rpeBtn)};
  wrap.append(load.node,reps.node,rpe.node);
  let pain=null;
  if(SETTINGS.painPerExercise){
    pain=mk("painDuring",painLbl(),"number",{min:0,max:10,placeholder:"0"},"/10");
    wrap.append(pain.node);
  }
  host.append(wrap);
  const nt=el("textarea",{value:e.notes||"",attrs:{placeholder:"Notes…"}});
  nt.oninput=()=>{e.notes=nt.value;saveSession(s);};
  host.append(el("div",{className:"full"},[el("label",{className:"lbl"},"Notes"),nt]));
  host._refresh=()=>{
    load.inp.value=e.load??"";reps.inp.value=e.reps??"";
    rpe.inp._setValue(e.rpe);
    if(pain)pain.inp.value=e.painDuring??"";
  };
}

/* Parenthetical asides move to the `title` attribute so a chip stays one short phrase.
   See .hintchips for why these are chips at all. */
function hintChips(hints){
  const wrap=el("div",{className:"hintchips"});
  wrap.append(el("span",{className:"hl"},"Capture"));
  hints.forEach(h=>{
    const short=h.replace(/\s*\([^)]*\)\s*/g," ").trim()||h;
    wrap.append(el("span",{className:"hchip"+(PAIN_CUES.test(h)?" pain":""),
      attrs:{title:h}},short));
  });
  return wrap;
}

function circuitPlan(ex,spec){
  const box=el("div",{className:"circuitplan"});
  box.append(el("div",{className:"cp-title"},spec.kind==="rounds"?spec.label+" · each round":spec.label+" · workout"));
  const parts=circuitParts(ex);(parts.length?parts:[txt(ex.reps)]).forEach((p,i)=>
    box.append(el("div",{className:"circuitpart"},[
      el("span",{className:"cpn"},String(i+1)),el("span",{},p)])));
  if(ex.load)box.append(el("div",{className:"circuitload"},"Equipment / load · "+ex.load));
  return box;
}

function clearCircuitLog(e,mode){
  e.done=false;e.load="";e.reps="";e.rpe="";e.painDuring="";e.notes="";e.sets=[];
  e.draft=blankDraft();e.summaryAuto=true;e.setTarget=null;e.circuit={...blankCircuit(),mode};
}
function openCircuitModeSheet(ex,e,s,onchange){
  const c=circuitState(e,ex),wrap=el("div",{className:"modechoices"});
  const options=[
    ["quick","Quick rounds","One large tap records each completed round. Finish details are collected once at the end."],
    ["details","Round details","Record a time, split, RPE or changed load for each round."],
    ["final","Final result","Skip live round tracking and record only the completed result."]];
  options.forEach(([mode,name,desc])=>{const b=el("button",{className:"modechoice",
      attrs:{"aria-pressed":String(c.mode===mode)}},[el("strong",{},name),el("span",{},desc)]);
    b.onclick=()=>{
      if(mode===c.mode){sheetClose();return;}
      if(!circuitHasData(e)){c.mode=mode;saveSession(s);sheetClose();onchange("");return;}
      sheetClose();const confirm=el("div");
      confirm.append(sheetActions("Reset and change",()=>{clearCircuitLog(e,mode);saveSession(s);onchange("");},"Keep current log"));
      sheetOpen("Start this circuit over?","Changing mode after logging has started resets this exercise only. Nothing changes unless you confirm.",confirm);
    };wrap.append(b);});
  sheetOpen("Choose how to log",`Recommended here: ${circuitModeName(circuitOf(ex).defaultMode)}.`,wrap);
}

function circuitModeLine(ex,e,s,onchange){
  const c=circuitState(e,ex),line=el("div",{className:"modeline"});
  line.append(el("div",{},[el("div",{className:"modehint"},"Logging mode"),
    el("strong",{},circuitModeName(c.mode))]));
  const change=el("button",{className:"quietaction"},circuitHasData(e)?"Change / reset ›":"Change ›");
  change.onclick=()=>openCircuitModeSheet(ex,e,s,onchange);line.append(change);return line;
}

function syncCircuitSummary(e){
  const c=e.circuit||blankCircuit(),rows=e.sets||[],n=Math.max(Number(c.rounds)||0,rows.length);
  if(rows.length){
    e.load=pickMode(rows.map(r=>txt(r.load)).filter(Boolean))||txt(c.load);
    e.rpe=pickMax(rows.map(r=>txt(r.rpe)).filter(Boolean))||txt(e.rpe);
    e.painDuring=pickMax(rows.map(r=>txt(r.painDuring)).filter(Boolean))||txt(e.painDuring);
  }else if(c.load)e.load=txt(c.load);
  const count=n?`${n} round${n===1?"":"s"}`:"";
  const extra=txt(c.extra)?` + ${txt(c.extra)} reps`:"";
  const time=txt(c.time)?` · ${txt(c.time)}`:"";
  const result=txt(c.result)?` · ${txt(c.result)}`:"";
  const mins=txt(c.minutes)?`${txt(c.minutes)} min completed`:"";
  e.reps=mins||((count||extra||time||result)?count+extra+time+result:e.reps);
}

function finishCircuit(ex,e,s,idx,onchange,message){
  e.done=true;
  if(circuitState(e,ex).mode==="final")syncFinalCircuit(ex,e);
  else syncCircuitSummary(e);
  saveSession(s);
  if(viewMode()==="focus"&&idx===STATE.focus&&idx<dayExercises().length-1){
    STATE.focus=idx+1;STATE.setEdit=null;renderMain();scrollTop();
  }else onchange("");
  toast(message||"Circuit complete");
}

function openCircuitFinish(ex,e,s,idx,onchange){
  const c=circuitState(e,ex),spec=circuitOf(ex),wrap=el("div");
  const grid=el("div",{className:"circuitresult"});
  const time=el("input",{type:"text",value:c.time,attrs:{placeholder:"e.g. 12:34",
    inputmode:"text","aria-label":"Final time or result"}});
  time.oninput=()=>{c.time=time.value;c.touched=true;syncCircuitSummary(e);saveSession(s);};
  grid.append(field(/for\s+time/i.test(txt(ex.sets))?"Finish time":"Time / result",time));
  const rpe=rpeButton(e.rpe,ex.rpe,v=>{e.rpe=v;c.touched=true;saveSession(s);openCircuitFinish(ex,e,s,idx,onchange);},"Final RPE");
  grid.append(field("Final RPE",rpe));
  if(SETTINGS.painPerExercise){const pain=el("input",{type:"number",value:e.painDuring,
      attrs:{min:0,max:10,placeholder:"0","aria-label":painLbl()}});
    pain.oninput=()=>{e.painDuring=pain.value;c.touched=true;saveSession(s);};
    grid.append(field(painLbl(),pain,"/10",painAsked(ex)?"asked":""));}
  const note=el("input",{type:"text",value:c.note,attrs:{placeholder:"Optional finish note"}});
  note.oninput=()=>{c.note=note.value;e.notes=txt(note.value);c.touched=true;saveSession(s);};
  grid.append(el("div",{className:"full"},field("Note",note)));
  const actions=sheetActions("Save & next",()=>finishCircuit(ex,e,s,idx,onchange,
    `${spec.kind==="rounds"?c.rounds+" rounds":"Circuit"} logged`),"Skip details");
  wrap.append(grid,actions);
  /* Skip details still means finish; it is a valid quick-count path, not Cancel. */
  const skip=actions.children[0];
  if(skip)skip.onclick=()=>{sheetClose();finishCircuit(ex,e,s,idx,onchange,"Circuit complete");};
  sheetOpen("Finish circuit",`${c.rounds||e.sets.length} round${(c.rounds||e.sets.length)===1?"":"s"} completed. Add only what is useful.`,wrap);
}

/* A circuit's own composition. A strength set asks for three numerals; a circuit asks
   "which round am I on", and rendering that as the same three-field row left two of them
   meaningless. All five kinds × three modes keep every bit of their function — losing a
   mode would be a downgrade dressed as a simplification. */
function roundCounter(done,target,label){
  const box=el("div",{className:"roundcount"});
  box.append(el("span",{className:"rn-value tnum"},
    target?`${done}/${target}`:String(done)));
  box.append(el("span",{className:"rn-label"},label||"rounds"));
  return box;
}
function buildQuickCircuit(host,ex,e,s,idx,onchange){
  const c=circuitState(e,ex),spec=circuitOf(ex),n=Math.max(c.rounds,e.sets.length);
  const target=spec.target||Math.max(n+1,1),chips=el("div",{className:"setchips"});
  const total=spec.target?Math.max(spec.target,n+1):Math.max(n+1,1);
  host.append(roundCounter(n,spec.target||0,spec.label||"rounds"));
  for(let i=0;i<total;i++)chips.append(el("span",{className:"setchip",attrs:{"data-state":i<n?"done":i===n?"current":"todo"}},String(i+1)));
  if(total>1)host.append(chips);
  host.append(el("div",{className:"setlabel"},spec.target&&n<target?`Round ${n+1} of ${target}`:
    spec.target?`${n} rounds completed · ${target} prescribed`:`${n} round${n===1?"":"s"} completed`));
  const done=el("button",{className:"primary circuit-primary"},spec.target&&n<target?
    (n===target-1?"Complete final round":`Complete round ${n+1} of ${target}`):"Complete another round");
  done.onclick=()=>{const row={set:e.sets.length+1,load:"",reps:"As prescribed",rpe:"",painDuring:"",note:""};
    e.sets.push(row);c.rounds=e.sets.length;c.touched=true;syncCircuitSummary(e);stampLastSet(s);saveSession(s);
    if(navigator.vibrate)try{navigator.vibrate(12);}catch(err){}
    if(spec.target&&c.rounds>=spec.target){onchange("");openCircuitFinish(ex,e,s,idx,onchange);}
    else{toast(`Round ${c.rounds} logged`);onchange("");}};
  host.append(done);
  if(n){const end=el("button",{className:"quietaction",style:"width:100%;margin-top:8px"},"Finish circuit now");
    end.onclick=()=>openCircuitFinish(ex,e,s,idx,onchange);host.append(end);}
}

function circuitResultLabel(ex){const h=txt(ex.logHint);
  return /split/i.test(h)?"Time / split":/time/i.test(h)?"Round time":"Round result";}

function buildDetailedCircuit(host,ex,e,s,idx,onchange){
  const c=circuitState(e,ex),spec=circuitOf(ex),rows=e.sets;
  const edit=(STATE.setEdit!=null&&STATE.setEdit<rows.length)?STATE.setEdit:null;
  const cur=edit==null?rows.length:edit,data=edit==null?e.draft:rows[edit];
  const target=spec.target||Math.max(rows.length+1,1),chips=el("div",{className:"setchips"});
  for(let i=0;i<Math.max(target,rows.length+1);i++){
    if(i<rows.length){const b=el("button",{className:"setchip",attrs:{"data-state":i===edit?"current":"done","aria-label":`Round ${i+1}, tap to edit`}},String(i+1));
      b.onclick=()=>{STATE.setEdit=i;onchange("");};chips.append(b);}
    else chips.append(el("span",{className:"setchip",attrs:{"data-state":i===rows.length?"current":"todo"}},String(i+1)));
  }
  host.append(roundCounter(rows.length,spec.target||0,spec.label||"rounds"));
  if(Math.max(target,rows.length+1)>1)host.append(chips);
  const roundLabel=edit!=null?`Edit round ${cur+1}${spec.target?` of ${target}`:""}`:
    spec.target&&rows.length>=target?`${rows.length} rounds completed · ${target} prescribed`:
    `Round ${cur+1}${spec.target?` of ${target}`:""}`;
  host.append(el("div",{className:"setlabel"},roundLabel));
  const grid=el("div",{className:"circuitresult"});
  const changed=()=>{if(edit==null)e.draft.dirty=true;else syncCircuitSummary(e);saveSession(s);};
  const result=el("input",{type:"text",value:data.reps,attrs:{placeholder:"e.g. 1:42 or as prescribed"}});
  result.oninput=()=>{data.reps=result.value;changed();};
  grid.append(field(circuitResultLabel(ex),result));
  const rpe=rpeButton(data.rpe,ex.rpe,v=>{data.rpe=v;changed();onchange("");});
  grid.append(field("RPE",rpe));
  const load=el("input",{type:"text",value:data.load,attrs:{placeholder:"Only if changed"}});
  load.oninput=()=>{data.load=load.value;changed();};
  grid.append(field("Changed load",load));
  if(SETTINGS.painPerExercise){const pain=el("input",{type:"number",value:data.painDuring,
      attrs:{min:0,max:10,placeholder:"0"}});pain.oninput=()=>{data.painDuring=pain.value;changed();};
    grid.append(field(painLbl(),pain,"/10",painAsked(ex)?"asked":""));}
  const note=el("input",{type:"text",value:data.note,attrs:{placeholder:"Optional round note"}});
  note.oninput=()=>{data.note=note.value;changed();};grid.append(el("div",{className:"full"},field("Note",note)));
  host.append(grid);
  const actions=el("div",{className:"setactions mainrow"});
  if(edit!=null){const save=el("button",{className:"primary"},`Save round ${cur+1}`);save.onclick=()=>{STATE.setEdit=null;syncCircuitSummary(e);saveSession(s);onchange("");};
    const del=el("button",{className:"ghost danger"},"Delete round");let armed=false;
    del.onclick=()=>{if(!armed){armed=true;del.textContent="Tap again to delete";del.classList.add("armed");
        setTimeout(()=>{armed=false;},4000);return;}
      e.sets.splice(edit,1);renumber(e);c.rounds=e.sets.length;STATE.setEdit=null;syncCircuitSummary(e);saveSession(s);onchange("");};
    actions.append(save,del);
  }else{const final=!!spec.target&&rows.length===spec.target-1;
    const log=el("button",{className:"primary"},final?"Log final round":
      spec.target&&rows.length>=target?"Log another round":`Log round ${rows.length+1}`);
    log.onclick=()=>{e.draft.dirty=!draftEmpty(e.draft);
      if(!commitCircuitRound(e,s)){/* A round tap itself confirms prescribed work. */
        e.draft.reps="As prescribed";e.draft.dirty=true;commitCircuitRound(e,s);}
      saveSession(s);
      if(final){onchange("");openCircuitFinish(ex,e,s,idx,onchange);}
      else{toast(`Round ${rows.length} logged`);onchange("");}};
    actions.append(log);
  }host.append(actions);
  if(edit==null&&rows.length){const finish=el("button",{className:"quietaction",style:"width:100%;margin-top:8px"},"Finish circuit now");
    finish.onclick=()=>openCircuitFinish(ex,e,s,idx,onchange);host.append(finish);}
}

function syncFinalCircuit(ex,e){
  const c=circuitState(e,ex),spec=circuitOf(ex),n=txt(c.rounds),extra=txt(c.extra),time=txt(c.time),result=txt(c.result);
  if(spec.kind==="amrap")e.reps=n?`${n} round${n==="1"?"":"s"}${extra?` + ${extra} reps`:""}`:result;
  else if(spec.kind==="emom")e.reps=txt(c.minutes)?`${txt(c.minutes)} min completed${result?` · ${result}`:""}`:result;
  else if(spec.kind==="rounds")e.reps=n?`${n} round${n==="1"?"":"s"}${time?` · ${time}`:""}`:time||result;
  else e.reps=time?`Time ${time}${result?` · ${result}`:""}`:result;
  e.load=txt(c.load);e.notes=txt(c.note);
}

function buildFinalCircuit(host,ex,e,s,idx,onchange){
  const c=circuitState(e,ex),spec=circuitOf(ex),grid=el("div",{className:"circuitresult"});
  let end;
  const mk=(key,label,placeholder,mode="text")=>{const input=el("input",{type:"text",value:c[key],attrs:{placeholder,inputmode:mode}});
    input.oninput=()=>{c[key]=input.value;c.touched=true;syncFinalCircuit(ex,e);saveSession(s);
      if(end)end.textContent="End circuit now";};grid.append(field(label,input));return input;};
  if(spec.kind==="amrap"){mk("rounds","Rounds","e.g. 4","numeric");mk("extra","Extra reps","e.g. 12","numeric");}
  else if(spec.kind==="emom"){mk("minutes","Minutes completed",spec.minutes?String(spec.minutes):"minutes","numeric");mk("result","Result / notes","optional");}
  else if(spec.kind==="rounds"){mk("rounds","Rounds completed",String(spec.target),"numeric");mk("time","Time / result","e.g. 12:34");}
  else{mk("time","Finish time","e.g. 12:34");mk("result","Completed work","as prescribed or where you stopped");}
  const rpe=rpeButton(e.rpe,ex.rpe,v=>{e.rpe=v;c.touched=true;syncFinalCircuit(ex,e);saveSession(s);onchange("");},"Final RPE");grid.append(field("Final RPE",rpe));
  if(SETTINGS.painPerExercise){const pain=el("input",{type:"number",value:e.painDuring,attrs:{min:0,max:10,placeholder:"0"}});
    pain.oninput=()=>{e.painDuring=pain.value;c.touched=true;saveSession(s);if(end)end.textContent="End circuit now";};
    grid.append(field(painLbl(),pain,"/10",painAsked(ex)?"asked":""));}
  mk("load","Changed load","Only if different");
  const note=el("input",{type:"text",value:c.note,attrs:{placeholder:"Optional finish note"}});
  note.oninput=()=>{c.note=note.value;c.touched=true;syncFinalCircuit(ex,e);saveSession(s);
    if(end)end.textContent="End circuit now";};
  grid.append(el("div",{className:"full"},field("Note",note)));
  host.append(grid);const save=el("button",{className:"primary circuit-primary"},"Save result & next");
  save.onclick=()=>{syncFinalCircuit(ex,e);if(!circuitHasData(e)&&!txt(e.rpe)&&!txt(e.painDuring)){toast("Add a result or use Skip exercise");return;}
    finishCircuit(ex,e,s,idx,onchange,"Circuit result saved");};host.append(save);
  end=el("button",{className:"quietaction",style:"width:100%;margin-top:8px"},circuitHasData(e)?"End circuit now":"Skip exercise");
  end.onclick=()=>confirmEndExercise(ex,e,s,idx,onchange,{unit:""});host.append(end);
}

function buildCircuitEditor(host,ex,e,s,idx,onchange){
  const c=circuitState(e,ex);host.append(circuitPlan(ex,circuitOf(ex)),circuitModeLine(ex,e,s,onchange));
  if(e.done){const body=el("div",{className:"setblock"});
    body.append(el("div",{className:"setrecap"},[el("span",{className:"rl"},"Completed"),
      el("span",{className:"rv tnum"},summaryText(e)||"No result logged")]));
    const actions=el("div",{className:"setactions mainrow"});
    const edit=el("button",{className:c.mode==="final"?"primary":"ghost"},c.mode==="final"?"Edit result":"Reopen circuit");
    edit.onclick=()=>{e.done=false;saveSession(s);onchange("");};actions.append(edit);
    if(c.mode!=="final"){
      const add=el("button",{className:"primary"},"Add another round");
      add.onclick=()=>{e.done=false;saveSession(s);onchange("");};actions.append(add);
    }
    body.append(actions);host.append(body);return;}
  const body=el("div",{className:"setblock"});host.append(body);
  if(c.mode==="quick")buildQuickCircuit(body,ex,e,s,idx,onchange);
  else if(c.mode==="details")buildDetailedCircuit(body,ex,e,s,idx,onchange);
  else buildFinalCircuit(body,ex,e,s,idx,onchange);
}

/* ---------- log card ----------
   One exercise, worked one set at a time. The set editor rebuilds itself on a commit /
   edit / delete / finish tap (never on a keystroke); the summary panel is repainted in
   place afterwards rather than rebuilt, so an open "Summary & notes" section doesn't
   collapse out from under the athlete's thumb the moment a set is logged.

   Order matters: name, what to capture, then the editor. The reference material (coach
   notes, progression rule, the flat summary) sits *below* it, because on a 320×568 screen
   three collapsibles above the fields is enough to push the primary action off-screen. */
function logCard(ex,s,idx){
  const e=entryFor(s,ex);
  const cat=catOf(ex);
  const c=el("div",{className:"card"+(e.done?" done":"")});
  if(cat)c.style.setProperty("--cat",cat.color);
  c.append(el("span",{className:"rail"}));
  c.append(...exerciseHead(ex));
  const hints=parseHints(ex);
  if(hints.length)c.append(hintChips(hints));
  /* The rest clock and "last time", above the fields and below the prescription, so all
     six things the athlete is tracking are on screen at once. Both follow the set
     counter — "last time" reads the set about to be logged, and the clock only starts
     once one has been — so the rail is repainted alongside the editor. It holds no
     inputs and is only ever redrawn after a deliberate tap, so this stays inside the
     repaint-don't-rebuild rule. */
  const railHost=el("div");
  const paintRail=()=>{railHost.innerHTML="";railHost.append(instrumentRail(ex,e,s));};
  c.append(railHost);

  const summaryHost=el("div");
  const refreshSummary=()=>{if(summaryHost._refresh)summaryHost._refresh();};

  const editorHost=el("div",{className:circuitOf(ex)?"":"setblock"});
  /* Editor redraws are passive by default: moving between sets must not summon the
     keyboard. Only the explicit + note action asks the rebuilt note input for focus. */
  const redraw=focusOn=>{
    editorHost.innerHTML="";
    const changed=f=>{redraw(f===undefined?"":f);refreshSummary();};
    if(circuitOf(ex))buildCircuitEditor(editorHost,ex,e,s,idx,changed);
    else buildSetEditor(editorHost,ex,e,s,idx,changed,focusOn);
    paintRail();
  };
  redraw("");
  c.append(editorHost);

  if(ex.focus)c.append(collapse("Coach notes",ex.focus));
  if(ex.progression)c.append(collapse("Progression rule",ex.progression));
  buildSummaryPanel(summaryHost,ex,e,s);
  c.append(collapse("Summary & notes",summaryHost));
  return c;
}

/* ---------- export ---------- */
/* Per-set rows are exported with a fixed key set and no holes, so the coach never has
   to probe for a missing field. A wholly empty row (nothing typed, nothing committed)
   is dropped as a safety net — commitSet() already refuses to create one. */
function exportSets(e){
  return (Array.isArray(e.sets)?e.sets:[])
    .map(r=>({load:txt(r.load),reps:txt(r.reps),rpe:txt(r.rpe),
              painDuring:txt(r.painDuring),note:txt(r.note)}))
    .filter(r=>r.load||r.reps||r.rpe||r.painDuring||r.note)
    .map((r,i)=>({set:i+1,...r}));
}
/* A named whitelist, not a rest-spread over the entry: `draft`, `summaryAuto` and
   `setTarget` are app-local bookkeeping that must never reach a log file, and naming
   every exported key here — rather than naming the ones to exclude — is what keeps that
   true as the entry shape grows. */
function exportEntry(e){
  return {done:!!e.done,load:txt(e.load),reps:txt(e.reps),rpe:txt(e.rpe),
          painDuring:txt(e.painDuring),notes:txt(e.notes)};
}
function programVersionOf(program){
  const value=Number(program&&program.meta&&program.meta.version);
  return Number.isFinite(value)&&value>0?Math.floor(value):0;
}
function sessionExercises(program,week,day){
  if(!program||!Array.isArray(program.exercises))return [];
  const v2=program.meta&&program.meta.schema==="tp-program-2";
  return program.exercises.filter(ex=>ex.day===day&&(!v2||Number(ex.week)===Number(week)));
}
/* Pure enough for queue backfill: it receives the stored session and the programme that
   authored it rather than reading whichever workout happens to be open now. The returned
   wire shape is exactly the existing tp-session-3 export contract. */
function buildSessionPayload(stored,program){
  const s=JSON.parse(JSON.stringify(stored||{}));
  s.session={...BLANK_SESSION,...(s.session||{})};
  if(!s.entries||typeof s.entries!=="object")s.entries={};
  Object.keys(s.entries).forEach(id=>{
    const e={...blankEntry(),...s.entries[id]};normalizeEntry(e);s.entries[id]=e;
  });
  const week=Math.max(1,Math.floor(Number(s.week)||1));
  const day=txt(s.day);
  const exs=sessionExercises(program,week,day);
  /* `tracking` is additive metadata: it tells the coach whether an empty pain value means
     "no pain logged" or "this athlete doesn't track pain". Every other key keeps its shape
     so the review step never sees a missing field. See docs/data-contracts.md. */
  const tracking={painLabel:(SETTINGS.painLabel||"").trim()};
  FIELD_DEFS.forEach(f=>tracking[f.key]=!!SETTINGS[f.key]);
  /* Per-set logging is not a switch — it is how every exercise is logged — but the key
     stays so a reader built against tp-session-3's contract still gets it. */
  tracking.perSetLogging=true;
  return {
    schema:"tp-session-3",
    block:program.meta.block,athlete:program.meta.athlete,
    athleteId:txt(program.meta.athleteId)||slug(program.meta.athlete),
    /* Which revision of the programme this was actually trained off. Without it the coach
       has to diff the denormalised `prescribed` values against the current program.json to
       spot an athlete who never re-imported. 0 means the programme predates versioning. */
    programVersion:programVersionOf(program),
    week,day,date:txt(s.date),
    exportedAt:new Date().toISOString(),
    tracking,
    /* Merged, like entries: a session stored before a check-in field existed must
       still export every key, or the coach has to probe for missing ones. */
    session:{...BLANK_SESSION,...(s.session||{})},
    entries:exs.map(ex=>{
      const e={...blankEntry(),...(s.entries[ex.id]||{})};
      return {exercise:ex.name,
        ...(ex.category?{category:ex.category}:{}),
        prescribed:{sets:ex.sets,reps:ex.reps,load:ex.load,rpe:ex.rpe},
        ...exportEntry(e),
        sets:exportSets(e)};
    })
  };
}
function buildSessionExport(){return buildSessionPayload(getSession(),PROGRAM);}
function sessionFilename(data){return `session-${data.date}-${slug(data.day)||"day"}.json`;}
function downloadSessionPayload(data){
  if(!data||!data.schema)throw new Error("Workout details are unavailable on this device.");
  const name=sessionFilename(data);
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=el("a",{href:url,download:name});document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);toast("Exported "+name);
}
async function copySessionPayload(data){
  if(!data||!data.schema)throw new Error("Workout details are unavailable on this device.");
  const json=JSON.stringify(data,null,2);
  try{await navigator.clipboard.writeText(json);toast("Session JSON copied");}
  catch(e){const ta=el("textarea",{value:json});document.body.append(ta);ta.select();
    document.execCommand("copy");ta.remove();toast("Session JSON copied");}
}
/* Both export paths are wrapped: a throw here would look like the button doing
   nothing, at the one moment the session has to leave the phone. Better to say so —
   the data is still in localStorage and Copy JSON is the fallback. */
function exportSession(){
  if(!PROGRAM){toast("Load a program first");return;}
  /* A rest day holds notes, not a workout — there is no (week, day) to export against. */
  if(!txt(STATE.day)){toast("No session on this date — pick a day first");return;}
  /* A set typed and not confirmed is still a set that happened. Re-render after, or the
     card on screen keeps a session object one set older than storage. */
  if(flushDraft())renderMain();
  try{
    const data=buildSessionExport();
    const name=sessionFilename(data);
    downloadSessionPayload(data);
    /* Recorded only after the file has actually been produced — claiming a session left
       the phone when it didn't is worse than not knowing. The re-render is what puts
       "exported" (or "edited since export") on the date view. */
    markExported();
    renderMain();
    const who=athleteId();
    toast("Exported "+name+" — save into athlete/"+(who||"<you>")+"/logs/");
  }catch(err){toast("Export failed: "+err.message+" — try Copy JSON");}
}
/* Deliberately does NOT mark the session exported: copying is the fallback when the
   download fails, and also how the JSON gets looked at. Neither is a file on disk. */
async function copyJSON(){
  if(!PROGRAM){toast("Load a program first");return;}
  if(!txt(STATE.day)){toast("No session on this date — pick a day first");return;}
  if(flushDraft())renderMain();
  try{await copySessionPayload(buildSessionExport());}
  catch(err){toast("Copy failed: "+err.message);}
}

/* ---------- events ----------
   Everything wired here is markup present for the whole life of the page. Week, day and
   date are not standing widgets — they are the claim picker and the calendar, built on
   demand — so nothing below wires them. */
$("#exportBtn").onclick=exportSession;
$("#copyBtn").onclick=copyJSON;
$("#backBtn").onclick=backFromDate;
$("#pageBack").onclick=openHome;
$("#ctxBtn").onclick=openClaimPicker;
$("#sheetClose").onclick=sheetClose;
$("#sheetBg").onclick=sheetClose;
$("#viewOverview").onclick=()=>setView("list");
$("#viewLog").onclick=()=>setView("focus");
$("#prevBtn").onclick=()=>stepFocus(-1);
$("#nextBtn").onclick=()=>stepFocus(1);
$("#fileInp").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(!authCanImport()){
    e.target.value="";requestProgramImport();return;
  }
  const fromProfile=APP.surface==="profile";
  try{
    const txt=await f.text();await acceptProgramImport(JSON.parse(txt),fromProfile);
  }
  catch(err){toast("Import failed: "+err.message);}
  e.target.value="";
};
/* Escape closes the action sheet; arrow keys step through Log view. Both are desktop
   conveniences — guarded, because the headless test harness has no event target.
   Suppressed while editing a set: an arrow key while STATE.setEdit is set would jump
   exercises with a chip (not an INPUT) focused mid-edit. */
if(document.addEventListener)document.addEventListener("keydown",e=>{
  if(window.TPAuthUI&&TPAuthUI.handleKeydown(e))return;
  if(e.key==="Escape"&&$("#sheetWrap").classList.contains("in")){sheetClose();return;}
  if(e.key==="Tab"&&$("#sheetWrap").classList.contains("in")){
    const nodes=Array.from($("#sheet").querySelectorAll("button,input,textarea,select"))
      .filter(n=>!n.disabled&&(!n.getAttribute||n.getAttribute("aria-hidden")!=="true"));
    if(nodes.length){const first=nodes[0],last=nodes[nodes.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    return;
  }
  if(APP.route!=="date"||viewMode()!=="focus"||STATE.setEdit!=null)return;
  const t=e.target&&e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  if(e.key==="ArrowLeft")stepFocus(-1);
  else if(e.key==="ArrowRight")stepFocus(1);
});

/* The phone locking mid-set, the app being switched away from, the tab closing. A set the
   athlete typed but never confirmed is committed here rather than left in the draft, where
   nothing outside the editor can see it. Guarded — the headless test harness has no event
   target, and neither has any effect if the listener never fires.
   The re-render is not optional even here: switching apps is not the same as leaving, and
   coming back to a card still holding the pre-flush session object would let the next
   keystroke autosave the committed set back out of existence. */
const flushOnHide=()=>{try{if(flushDraft())renderMain();}catch(e){}};
if(window.addEventListener)window.addEventListener("pagehide",flushOnHide);
if(document.addEventListener)document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden")flushOnHide();
});

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
boot();
</script>
