<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Training Tracker</title>
<meta name="theme-color" content="#14213d" id="metaTheme" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tracker" />
<style>
  :root{
    /* 4px spacing scale */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
    /* type scale */
    --t-xs:.6875rem; --t-sm:.8125rem; --t-base:.9375rem; --t-md:1.0625rem;
    --t-lg:1.25rem; --t-hero:1.5rem;
    --r:14px; --r-sm:10px;
  }
  /* ---------- themes ----------
     Two palettes × light/dark, chosen in the settings sheet and resolved onto
     <html data-theme> by applyTheme() (and by the head script, before first paint).
     Every colour below is a variable: no rule elsewhere in this file may hardcode a
     hex or rgba, or it will survive a theme switch and look broken in one of the four.

     Palette A "Amber": #000000 #14213d #fca311 #e5e5e5 #ffffff
     Palette B "Mint":  #c9e4ca #87bba2 #55828b #3b6064 #364958

     Surface levels (bg / panel / panel-hi / well / two line weights) are mixes and
     tints of each palette's own colours — five hexes can't fill six steps. The raw
     palette values carry ink, accent and category rails.
     Readiness Green/Amber/Red can't come from one chroma, so --good/--warn/--bad are
     semantic: in-palette where the palette has that hue, added where it doesn't. */

  /* A · dark — "Navy & Amber". Navy is the page itself, wells are black, and amber is
     used liberally (accent, disclosures, rails). Also the no-JS fallback. */
  html:not([data-theme]),html[data-theme="a-dark"]{
    --bg:#14213d; --panel:#1b2b4d; --panel-hi:#24365e; --well:#0b1428;
    --line:#33477a; --line-soft:#233255;
    --ink:#ffffff; --ink-dim:#e5e5e5; --muted:#9fadc9; --placeholder:#7182a5;
    --accent:#fca311; --on-accent:#000000; --accent-soft:rgba(252,163,17,.16);
    --accent-ink:#fca311;
    --accent2:#fca311; --accent2-soft:rgba(252,163,17,.10);
    --good:#47b48c; --good-soft:rgba(71,180,140,.14); --good-soft-2:rgba(71,180,140,.04);
    --good-line:rgba(71,180,140,.5);
    --warn:#fca311; --bad:#e2604d;
    --ring:0 0 0 3px rgba(252,163,17,.28); --scrim:rgba(0,0,0,.7);
    --footer-bg:rgba(27,43,77,.93); --bg-fade:rgba(20,33,61,0);
    --toast-bg:#000000; --toast-ink:#e5e5e5; --toast-line:#fca311;
    --top-hi-a:rgba(255,255,255,.10); --top-hi-b:rgba(255,255,255,.03);
    --tab-shadow:rgba(0,0,0,.45);
    --cat-warm:#8496b8; --cat-tendon:#fca311; --cat-skill:#e5e5e5;
    --cat-strength:#6d8ecb; --cat-cond:#d0830c; --cat-accessory:#bdb08f;
    --meta-theme:#14213d;
  }
  /* A · light — "Paper & Amber" */
  html[data-theme="a-light"]{
    --bg:#ffffff; --panel:#ffffff; --panel-hi:#e5e5e5; --well:#f4f5f7;
    --line:#c6cbd6; --line-soft:#dfe2e8;
    --ink:#14213d; --ink-dim:#33415f; --muted:#6c7893; --placeholder:#9aa3b5;
    --accent:#fca311; --on-accent:#14213d; --accent-soft:rgba(252,163,17,.18);
    --accent-ink:#b8760c;   /* amber as *text* fails on white — darken it, keep the fill amber */
    --accent2:#14213d; --accent2-soft:rgba(20,33,61,.06);
    --good:#1f7a5c; --good-soft:rgba(31,122,92,.10); --good-soft-2:rgba(31,122,92,.02);
    --good-line:rgba(31,122,92,.40);
    --warn:#b8760c; --bad:#c1402c;
    --ring:0 0 0 3px rgba(252,163,17,.32); --scrim:rgba(20,33,61,.42);
    --footer-bg:rgba(255,255,255,.94); --bg-fade:rgba(255,255,255,0);
    --toast-bg:#14213d; --toast-ink:#ffffff; --toast-line:#fca311;
    --top-hi-a:rgba(20,33,61,.05); --top-hi-b:rgba(20,33,61,.01);
    --tab-shadow:rgba(20,33,61,.16);
    --cat-warm:#8b93a6; --cat-tendon:#c07c14; --cat-skill:#14213d;
    --cat-strength:#41598f; --cat-cond:#a05f0c; --cat-accessory:#6d6250;
    --meta-theme:#ffffff;
  }
  /* B · dark — "Teal & Mint". Mid-dark teal page, pale mint as the accent, so buttons
     read light-on-dark rather than colour-on-dark. */
  html[data-theme="b-dark"]{
    --bg:#3b6064; --panel:#4a747a; --panel-hi:#55828b; --well:#2f4f53;
    --line:#6f9aa0; --line-soft:#557f85;
    --ink:#ffffff; --ink-dim:#c9e4ca; --muted:#aecdc3; --placeholder:#8fb0ab;
    --accent:#c9e4ca; --on-accent:#2f4f53; --accent-soft:rgba(201,228,202,.18);
    --accent-ink:#c9e4ca;
    --accent2:#87bba2; --accent2-soft:rgba(135,187,162,.12);
    --good:#c9e4ca; --good-soft:rgba(201,228,202,.15); --good-soft-2:rgba(201,228,202,.04);
    --good-line:rgba(201,228,202,.55);
    --warn:#e6bb5c; --bad:#e07d6c;
    --ring:0 0 0 3px rgba(201,228,202,.30); --scrim:rgba(31,52,55,.76);
    --footer-bg:rgba(74,116,122,.94); --bg-fade:rgba(59,96,100,0);
    --toast-bg:#364958; --toast-ink:#c9e4ca; --toast-line:#c9e4ca;
    --top-hi-a:rgba(255,255,255,.11); --top-hi-b:rgba(255,255,255,.03);
    --tab-shadow:rgba(0,0,0,.35);
    --cat-warm:#9db8bc; --cat-tendon:#87bba2; --cat-skill:#c9e4ca;
    --cat-strength:#b6dbe0; --cat-cond:#e6bb5c; --cat-accessory:#b7d3b0;
    --meta-theme:#3b6064;
  }
  /* B · light — "Mint Paper" */
  html[data-theme="b-light"]{
    --bg:#c9e4ca; --panel:#e2f1e2; --panel-hi:#cfe7d0; --well:#f4faf4;
    --line:#87bba2; --line-soft:#aed3b5;
    --ink:#364958; --ink-dim:#3b6064; --muted:#55828b; --placeholder:#87a8a3;
    --accent:#55828b; --on-accent:#f4faf4; --accent-soft:rgba(85,130,139,.14);
    --accent-ink:#3f6d76;
    --accent2:#3b6064; --accent2-soft:rgba(59,96,100,.08);
    --good:#3b7a5e; --good-soft:rgba(59,122,94,.12); --good-soft-2:rgba(59,122,94,.03);
    --good-line:rgba(59,122,94,.42);
    --warn:#a8741a; --bad:#a8473a;
    --ring:0 0 0 3px rgba(85,130,139,.30); --scrim:rgba(54,73,88,.44);
    --footer-bg:rgba(226,241,226,.94); --bg-fade:rgba(201,228,202,0);
    --toast-bg:#364958; --toast-ink:#c9e4ca; --toast-line:#55828b;
    --top-hi-a:rgba(255,255,255,.7); --top-hi-b:rgba(255,255,255,.2);
    --tab-shadow:rgba(54,73,88,.18);
    --cat-warm:#7d97a0; --cat-tendon:#3b7a5e; --cat-skill:#364958;
    --cat-strength:#55828b; --cat-cond:#a8741a; --cat-accessory:#6b8f6f;
    --meta-theme:#c9e4ca;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
  body{padding:0 var(--s3) calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
  .tnum{font-variant-numeric:tabular-nums}

  /* ---------- header ----------
     Two rows only. Everything that is decided once a session — week, day, date, the
     check-in — lives in the drawer, because a header the athlete reads past on every
     scroll is the thing that made the old layout feel cluttered. */
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:var(--s4) 0 var(--s2)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;
    background:linear-gradient(var(--bg),var(--bg-fade));pointer-events:none}
  .row{display:flex;gap:var(--s2);align-items:center}
  /* Header actions must never absorb the squeeze — the context line (.ctx) wraps instead. */
  header .row>button:not(.ctx){flex:0 0 auto;white-space:nowrap}
  .grow{flex:1 1 auto;min-width:0}
  .block-name{font-weight:700;font-size:var(--t-md);letter-spacing:-.2px;line-height:1.2}
  .sub{color:var(--muted);font-size:var(--t-sm);margin-top:1px}
  .iconbtn{position:relative;flex:0 0 auto;width:38px;height:38px;padding:0;display:grid;
    place-items:center;background:transparent;border:1px solid var(--line);
    border-radius:var(--r-sm)}
  .iconbtn svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .iconbtn:active svg{stroke:var(--ink)}
  /* A quiet dot on the ≡ while the check-in is still empty. It is the only nag in the
     app, and it clears the moment any check-in field is filled. */
  .iconbtn.alert::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}

  /* The whole context line is the drawer trigger: changing week or day is a tap on the
     thing you are already reading, not a hunt for the ≡. */
  .ctx{flex:1 1 auto;min-width:0;background:transparent;border:0;padding:2px;
    text-align:left;border-radius:var(--r-sm)}
  .ctx-1{display:block;font-weight:700;font-size:var(--t-md);letter-spacing:-.2px;
    line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctx-2{display:block;color:var(--muted);font-size:var(--t-sm);font-weight:400;
    margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* All-exercises / one-at-a-time. Icons, not words: two labels plus the ≡ leave the
     context line about 90px on a 320px screen. */
  .viewseg{flex:0 0 auto;display:flex;gap:2px;padding:3px;background:var(--well);
    border:1px solid var(--line-soft);border-radius:999px}
  .vbtn{width:34px;height:32px;padding:0;display:grid;place-items:center;border:0;
    background:transparent;border-radius:999px}
  .vbtn svg{width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .vbtn[aria-pressed="true"]{background:var(--panel-hi);box-shadow:0 1px 3px var(--tab-shadow)}
  .vbtn[aria-pressed="true"] svg{stroke:var(--accent-ink)}

  /* progress bar — replaces the old footer "n/m done" fraction */
  .prog-wrap{margin-top:var(--s3)}
  .prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);
    font-size:var(--t-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.7px;
    margin-bottom:5px}
  .prog-top .count{color:var(--ink);font-weight:700;letter-spacing:0;text-transform:none;
    font-size:var(--t-sm);flex:0 0 auto}
  /* The date left the header when the selectors moved into the drawer, so it is stated
     here instead — logging a session onto the wrong date is silent and unrecoverable. */
  #progLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #progLabel.off{color:var(--warn)}
  .pbar{height:6px;border-radius:999px;background:var(--well);overflow:hidden;
    box-shadow:inset 0 0 0 1px var(--line-soft)}
  .pbar[hidden]{display:none}
  .pbar i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:width .35s cubic-bezier(.2,.8,.2,1)}

  /* Focus view only: the bar becomes numbered pips, which say the same thing about
     progress and also where you are and what you can jump to. Sticky with the header,
     so a long card never hides the way out of it. */
  .pips{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .pips::-webkit-scrollbar{display:none}
  .pips[hidden]{display:none}
  .pip{flex:0 0 auto;min-width:30px;height:28px;padding:0 7px;border-radius:999px;
    border:1px solid var(--line-soft);background:var(--well);color:var(--muted);
    font-size:var(--t-xs);font-weight:700;font-variant-numeric:tabular-nums}
  .pip[data-done="1"]{color:var(--good);border-color:var(--good-line);background:var(--good-soft)}
  .pip[aria-current="true"]{background:var(--accent);border-color:var(--accent);
    color:var(--on-accent)}

  /* ---------- controls ---------- */
  select,input,textarea,button{font:inherit;color:var(--ink);background:var(--well);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;outline:none;
    max-width:100%;min-width:0;transition:border-color .15s,box-shadow .15s,background .15s}
  input,textarea{font-weight:600}
  input::placeholder,textarea::placeholder{color:var(--placeholder);font-weight:400}
  /* Number spinners are unusable with a chalked thumb and steal ~15px of field width —
     enough that a pain score of "10" was being clipped in the narrow Pain column. */
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;display:none}
  select{-webkit-appearance:none;background-color:var(--panel-hi);font-weight:600;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
      linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;
    background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:var(--ring)}
  button{cursor:pointer;background:var(--panel-hi);font-weight:600}
  button:active{transform:scale(.97)}
  button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);
    font-weight:700}
  button.ghost{background:transparent}
  .mini{font-size:var(--t-sm);padding:7px 11px}
  .selrow{display:flex;gap:var(--s2);margin-top:var(--s2)}
  .selrow>*{min-width:0}
  #weekSel{flex:0 0 auto}
  #dateInp{flex:1 1 auto}
  .btnrow{display:flex;gap:var(--s2);margin-top:var(--s2)}
  .btnrow>button{flex:1 1 0}

  /* day list (drawer) — a full-width row per day, because the drawer has the width the
     old tab strip didn't: the session theme is readable instead of being a truncated tab. */
  .daylist{display:flex;flex-direction:column;gap:var(--s1);margin-top:var(--s2)}
  .dayitem{display:flex;gap:var(--s3);align-items:baseline;width:100%;text-align:left;
    background:var(--well);border:1px solid var(--line-soft);border-radius:var(--r-sm);
    padding:10px var(--s3)}
  .dayitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .dayitem .dnum{flex:0 0 auto;min-width:26px;font-size:var(--t-xs);font-weight:800;
    color:var(--muted);letter-spacing:.5px}
  .dayitem[aria-pressed="true"] .dnum{color:var(--accent-ink)}
  .dayitem .dwrap{flex:1 1 auto;min-width:0}
  .dayitem .dday{display:block;font-size:var(--t-sm);font-weight:700;line-height:1.25}
  .dayitem .dtheme{display:block;font-size:var(--t-xs);font-weight:400;color:var(--muted);
    line-height:1.35;margin-top:1px}

  /* ---------- cards ---------- */
  .card{position:relative;background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--r);padding:var(--s4) var(--s4) var(--s4) calc(var(--s4) + 4px);
    margin:var(--s3) 0;overflow:hidden}
  /* 1px top highlight reads as light falling on the card — depth without a drop shadow.
     In the light themes it's a white highlight instead; both come from the theme block. */
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,var(--top-hi-a),var(--top-hi-b))}
  .rail{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat,var(--line-soft))}
  .card.done .rail{background:var(--good)}
  .ex-head{display:flex;justify-content:space-between;gap:var(--s3);align-items:flex-start}
  .ex-head>.grow{min-width:0}
  .ex-name{font-weight:700;font-size:var(--t-base);letter-spacing:-.1px;line-height:1.3}
  .card.done .ex-name::after{content:" ✓";color:var(--good);font-weight:800}
  .rx{color:var(--ink-dim);font-size:var(--t-sm);margin-top:var(--s1)}
  /* Prescription too wordy for the hero — full width under the name, so it wraps normally. */
  .rx.set{font-weight:600}
  .rx .rpe{color:var(--muted);font-size:var(--t-xs);font-weight:600;letter-spacing:.6px;
    text-transform:uppercase;margin-left:6px;white-space:nowrap}
  .card.done{border-color:var(--good-line);
    background:linear-gradient(180deg,var(--good-soft),var(--good-soft-2)),var(--panel)}

  .tag{display:inline-block;font-size:var(--t-xs);font-weight:800;letter-spacing:.7px;
    text-transform:uppercase;color:var(--cat);
    background:rgba(128,128,128,.14);                              /* fallback */
    background:color-mix(in srgb,var(--cat) 14%,transparent);
    border-radius:5px;padding:2px 7px;margin-bottom:5px}

  /* The hero must never win the fight for width against the exercise name — capped at
     45% whatever it contains, not only when the sets×reps string is long. */
  .hero{flex:0 0 auto;max-width:45%;text-align:right;font-weight:800;font-size:var(--t-hero);
    letter-spacing:-.5px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
  .hero.long{font-size:var(--t-md);letter-spacing:0;white-space:normal}
  /* The RPE line is prose as often as it is a number — "RPE 7 (use RPE-1 to set load)".
     It inherits the hero's nowrap, and a 29-character unbreakable line takes the whole
     row and wraps the exercise name one word per line. It wraps; the number doesn't. */
  .hero small{display:block;font-size:var(--t-xs);font-weight:600;color:var(--muted);
    letter-spacing:.6px;text-transform:uppercase;margin-top:2px;
    white-space:normal;overflow-wrap:anywhere}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s2)}
  .chip{background:var(--panel-hi);border:1px solid var(--line-soft);border-radius:999px;
    padding:3px 9px;font-size:var(--t-xs);color:var(--ink-dim);font-weight:600}
  /* Load is free text and can run to a sentence, so it wraps; tempo/rest are always short. */
  .chip.k{color:var(--muted);font-weight:400;white-space:nowrap}

  details{margin-top:var(--s3);border-top:1px solid var(--line-soft);padding-top:var(--s3)}
  details+details{margin-top:var(--s2)}
  summary{cursor:pointer;color:var(--accent2);font-size:var(--t-sm);font-weight:700;
    list-style:none;display:flex;align-items:center;gap:6px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"";width:0;height:0;border:4px solid transparent;
    border-left-color:var(--accent2);transition:transform .15s;flex:0 0 auto}
  details[open] summary::before{transform:rotate(90deg) translateX(-1px)}
  details .body{color:var(--ink-dim);font-size:var(--t-sm);margin-top:var(--s2);
    white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}

  /* ---------- log grid ---------- */
  /* minmax(0,1fr) not 1fr: an input's intrinsic width exceeds a phone column and plain
     1fr refuses to shrink below it. */
  .log{margin-top:var(--s4);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
  .log>div{min-width:0}
  .log input,.log select,.log textarea{width:100%}
  .log .full{grid-column:1 / -1}
  /* Four across only once the text fields have room; below 360px fall back to 2×2. */
  @media (min-width:360px){
    .log.tight{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 56px 74px}
    .log.tight.nopain{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 56px}}
  .lbl{display:block;font-size:var(--t-xs);color:var(--muted);margin:0 0 var(--s1) 2px;font-weight:600}
  .fld{position:relative}
  .fld .unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    color:var(--placeholder);font-size:var(--t-xs);font-weight:600;pointer-events:none}
  /* Keep this tight: the suffix eats width from a 56–74px numeric column, and more
     padding clips the value itself on a 360px screen. */
  .fld.has-unit input{padding-right:31px}
  .hint{font-size:var(--t-sm);color:var(--accent2);grid-column:1/-1;
    background:var(--accent2-soft);border-left:2px solid var(--accent2);
    border-radius:0 var(--r-sm) var(--r-sm) 0;padding:var(--s2) var(--s3);margin-top:var(--s1)}
  textarea{width:100%;min-height:56px;resize:vertical;font-weight:400;line-height:1.5}
  /* The check-in lives in the drawer now, which is 400px at its widest whatever the
     screen is — so its grid stays two columns and the old viewport media query for a
     third column is gone. */

  /* Per-set rows. Opt-in, so vertical space is affordable — width is the hard part.
     Below 360px four inputs across leaves ~25px of text room, which clips a 3-digit
     load and every placeholder, so the row wraps to two lines instead. Same idea as
     .log.tight's 360px gate; explicit areas because auto-placement would strand the
     set number and the delete button on the wrong line. */
  /* It is a child of the .log grid, so without this it lands in one ~90px column and
     "Log each set (4 prescribed)" wraps to five lines. */
  .sets{grid-column:1 / -1;margin-top:var(--s2)}
  .setrow{display:grid;gap:var(--s1);align-items:center;margin-top:var(--s2);

  .setrow:not(.pain){grid-template-areas:"n load reps del" "n rpe rpe del"}

  .setrow>.del{grid-area:del}

  .setrow>.c-reps{grid-area:reps}
  .setrow>.c-rpe{grid-area:rpe}
  .setrow>.c-pain{grid-area:pain}
  @media (min-width:360px){
    .setrow{grid-template-columns:16px repeat(4,minmax(0,1fr)) 26px;
      grid-template-areas:"n load reps rpe pain del"}
    .setrow:not(.pain){grid-template-columns:16px repeat(3,minmax(0,1fr)) 26px;

  .setrow>.n{font-size:var(--t-xs);color:var(--muted);font-weight:700;text-align:right}
  .setrow input{width:100%;text-align:center}
  /* The header only makes sense while the row is a single line. */
  .setrow.head{display:none;margin-top:0}
  @media (min-width:360px){.setrow.head{display:grid}}
  .setrow.head span{font-size:var(--t-xs);color:var(--muted);font-weight:600;
    text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .setrow>.del{background:none;border:0;color:var(--muted);font-size:var(--t-md);
    line-height:1;padding:4px 0;min-height:26px}
  .setnote input{width:100%;margin-top:var(--s1)}
  .setbtn{display:block;width:100%;margin-top:var(--s2);padding:9px 10px;
    border-radius:var(--r-sm);background:var(--panel-hi);
    border:1px solid var(--line-soft);color:var(--ink-dim);
    font-size:var(--t-xs);font-weight:700;letter-spacing:.3px}
  /* Clearing every set is the one destructive action on this screen. It is quiet,
     separated from "+ Add set", and needs a second tap to confirm — a chalked thumb
     that misses must not wipe the sets that were just logged. */
  .setbtn.danger{background:none;border-color:transparent;color:var(--muted);
    font-weight:600;margin-top:var(--s1)}
  .setbtn.danger.armed{border-color:var(--bad);color:var(--bad);font-weight:700}

  .donebtn{width:100%;margin-top:var(--s3);padding:12px;border-radius:var(--r-sm);
    background:var(--panel-hi);border:1px solid var(--line);color:var(--ink-dim);
    font-weight:700;font-size:var(--t-sm);letter-spacing:.3px}
  .donebtn[aria-pressed="true"]{background:var(--good-soft);
    border-color:var(--good-line);color:var(--good)}
  .summary-line{margin-top:var(--s3);font-size:var(--t-sm);color:var(--ink-dim);
    background:var(--well);border:1px solid var(--line-soft);border-radius:var(--r-sm);
    padding:var(--s2) var(--s3);cursor:pointer;display:flex;justify-content:space-between;gap:var(--s2)}
  .summary-line .edit{color:var(--accent2);font-weight:700;flex:0 0 auto}
  .summary-line .vals{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* readiness tints the check-in card */
  .sessioncard[data-readiness="Green"]{--cat:var(--good)}
  .sessioncard[data-readiness="Amber"]{--cat:var(--warn)}
  .sessioncard[data-readiness="Red"]{--cat:var(--bad)}
  .sessioncard[data-readiness="Green"],.sessioncard[data-readiness="Amber"],
  .sessioncard[data-readiness="Red"]{border-color:color-mix(in srgb,var(--cat) 45%,transparent)}

  /* ---------- drawer ----------
     Session setup (week / day / date), the check-in, import-export and settings. All of
     it is entered once and read rarely, which is exactly what earns a place off-screen.
     Visibility rather than [hidden] so the slide-in animates both ways with no timers:
     the delayed visibility transition keeps the panel present until it has left. */
  .drawer-wrap{position:fixed;inset:0;z-index:60;visibility:hidden;
    transition:visibility 0s linear .24s}
  .drawer-wrap.in{visibility:visible;transition-delay:0s}
  .drawer-bg{position:absolute;inset:0;background:var(--scrim);opacity:0;
    transition:opacity .22s}
  .drawer-wrap.in .drawer-bg{opacity:1}
  .drawer{position:absolute;left:0;top:0;bottom:0;width:min(92vw,400px);
    display:flex;flex-direction:column;background:var(--panel);
    border-right:1px solid var(--line);transform:translateX(-101%);
    transition:transform .24s cubic-bezier(.2,.8,.2,1);
    padding-left:env(safe-area-inset-left)}
  .drawer-wrap.in .drawer{transform:none}
  .drawer-head{flex:0 0 auto;display:flex;align-items:flex-start;gap:var(--s3);
    padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) var(--s3);
    border-bottom:1px solid var(--line-soft)}
  /* Without this the button shrinks to one character per line next to the block name. */
  .drawer-head button{flex:0 0 auto;white-space:nowrap}
  .drawer-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
    padding:0 var(--s4) calc(var(--s5) + env(safe-area-inset-bottom))}
  .dnote{color:var(--muted);font-size:var(--t-sm);margin:var(--s1) 0 0;line-height:1.5}
  body.noscroll{overflow:hidden}

  /* Accordion sections. `details.acc` deliberately outguns the generic `details` rules
     used for coach notes — same element, different job. */
  details.acc{margin:var(--s3) 0 0;padding:0;background:var(--well);
    border:1px solid var(--line-soft);border-radius:var(--r-sm);overflow:hidden}
  details.acc+details.acc{margin-top:var(--s2)}
  details.acc>summary{padding:var(--s3);color:var(--ink);font-size:var(--t-sm);font-weight:700}
  details.acc>summary::before{border-left-color:var(--muted)}
  details.acc>summary .accstat{flex:0 0 auto;max-width:52%;color:var(--muted);font-weight:600;
    font-size:var(--t-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .accbody{padding:0 var(--s3) var(--s3)}
  .accbody>.card{margin:0}
  .togrow{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;
    border-top:1px solid var(--line-soft)}
  .togrow .tl{flex:1 1 auto;min-width:0}
  .togrow .tn{font-size:var(--t-base);font-weight:600}
  .togrow .td{font-size:var(--t-sm);color:var(--muted);line-height:1.4;margin-top:1px}
  .sw{flex:0 0 auto;appearance:none;-webkit-appearance:none;width:50px;height:30px;
    border-radius:999px;background:var(--well);border:1px solid var(--line);position:relative;
    padding:0;transition:background .18s,border-color .18s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
    border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
  .sw[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
  .sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent)}
  .sw:focus-visible{box-shadow:var(--ring)}

  /* ---------- appearance controls (top of the sheet) ---------- */
  .sec{font-size:var(--t-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.8px;
    font-weight:700;margin:var(--s5) 0 var(--s2)}
  .sec:first-child{margin-top:var(--s3)}
  .pals{display:flex;gap:var(--s2)}
  /* Buttons, not radios: a 26px+ target with the palette visible on it beats a radio
     label you have to read. */
  .pal{flex:1 1 0;display:block;text-align:left;background:var(--well);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}
  .pal[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--ring)}
  .pal .dots{display:flex;gap:3px;margin-bottom:7px}
  .pal .dots i{width:100%;height:14px;border-radius:3px;display:block;
    box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
  .pal .pn{font-size:var(--t-sm);font-weight:700;color:var(--ink)}
  .pal .pd{font-size:var(--t-xs);color:var(--muted);font-weight:400;line-height:1.35;
    margin-top:1px}
  .seg{display:flex;gap:var(--s1);padding:3px;background:var(--well);
    border:1px solid var(--line-soft);border-radius:999px;margin-top:var(--s2)}
  .seg button{flex:1 1 0;border:0;background:transparent;color:var(--muted);
    border-radius:999px;padding:9px 6px;font-size:var(--t-sm);font-weight:700}
  .seg button[aria-pressed="true"]{background:var(--panel-hi);color:var(--ink);
    box-shadow:0 1px 3px var(--tab-shadow)}
  .seg-note{font-size:var(--t-xs);color:var(--muted);margin:var(--s2) 0 0;line-height:1.4}

  /* ---------- footer / misc ----------
     One bar, two contents: the export actions in the all-exercises view, and prev/next
     in the focus view, where the thumb needs them far more than it needs Export. Export
     is always in the drawer as well, so swapping never strands it. */
  .footer-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--footer-bg);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom));
    display:flex;gap:var(--s2);align-items:center;max-width:720px;margin:0 auto}
  .footer-bar button{flex:0 0 auto;white-space:nowrap}
  .footer-bar #exportBtn{flex:1 1 auto}
  .fgroup{flex:1 1 auto;min-width:0;display:flex;gap:var(--s2);align-items:center}
  .fgroup[hidden]{display:none}
  /* Beats .footer-bar button{flex:0 0 auto} above, which would otherwise size Prev and
     Next to their labels and leave the pair lopsided. */
  .footer-bar .navbtn{flex:1 1 0;min-width:0;padding:12px 8px;font-weight:700;
    font-size:var(--t-sm);background:var(--panel-hi);border:1px solid var(--line)}
  .navbtn:disabled{opacity:.35}
  button:disabled{cursor:default}
  button:disabled:active{transform:none}
  .navcount{flex:0 0 auto;min-width:62px;text-align:center;color:var(--muted);
    font-size:var(--t-sm);font-weight:700}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(6px);
    background:var(--toast-bg);color:var(--toast-ink);border:1px solid var(--toast-line);
    padding:10px 15px;
    border-radius:var(--r-sm);font-size:var(--t-sm);opacity:0;
    transition:opacity .2s,transform .2s;z-index:70;pointer-events:none;max-width:92%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .muted{color:var(--muted)}
  .banner{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
    border-radius:var(--r-sm);padding:var(--s3);font-size:var(--t-sm);color:var(--ink-dim);
    margin:var(--s3) 0;line-height:1.5}
  .banner button{margin-top:var(--s2)}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
    button:active{transform:none}
    /* The drawer's close animation is held open by a visibility *delay*, not a duration.
       Leave it in place here and a scrim nobody can see keeps eating taps for 240ms. */
    .drawer-wrap{transition-delay:0s !important}
  }
</style>
<script>
/* Resolve the saved theme BEFORE first paint. The main script runs at the end of <body>,
   which is late enough that a light-theme user would see a black flash on every cold
   start. Kept deliberately tiny and duplicated — it must mirror themeId() below. */
(function(){try{
  var s=JSON.parse(localStorage.getItem("tp_settings_v1")||"{}");
  var p=s.palette==="b"?"b":"a", m=s.mode||"auto";
  var dark=m==="auto"?!matchMedia("(prefers-color-scheme: light)").matches:m!=="light";
  document.documentElement.dataset.theme=p+(dark?"-dark":"-light");
}catch(e){document.documentElement.dataset.theme="a-dark";}})();
</script>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,props={},kids=[])=>{const n=document.createElement(t);
  const {attrs,...rest}=props; Object.assign(n,rest);
  for(const[k,v]of Object.entries(attrs||{}))n.setAttribute(k,v);
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c)));
  return n;};

const LS = { prog:"tp_program_v1", set:"tp_settings_v1", sess:(d,day)=>`tp_sess_v1::${d}::${day}` };
/* `focus` is the index of the exercise shown in the focus view. It is view state, not
   logged data, so it is deliberately not persisted: on a cold start it is derived from
   what is already ticked off, which lands you on the first exercise you haven't done. */
let PROGRAM=null, STATE={week:1,day:null,date:todayISO(),focus:0};

function todayISO(){const d=new Date();const z=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1900);}
function slug(s){return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,40);}

/* ---------- settings ----------
   Which optional inputs are shown. Defaults are all-on, so an existing install (and the
   coaching loop that depends on the pain fields) behaves exactly as before; a user
   without knee issues turns them off once. Per-device, like everything else here. */
const FIELD_DEFS=[
  {key:"painPerExercise",name:"Pain per exercise",
   desc:"A 0–10 pain box on every exercise. Knee load varies hugely between movements, so this is what identifies which movement to regress."},
  {key:"painOnWaking",name:"Pain on waking",
   desc:"Session-level 0–10, filled at check-in. It reads how the tissue woke up today, which is the response to the LAST session — not this one."},
  {key:"readiness",name:"Readiness",desc:"Green / Amber / Red — governs whether load progresses, holds or regresses."},
  {key:"sleep",name:"Sleep score",desc:"Subjective 1–5."},
  {key:"bodyweight",name:"Bodyweight",desc:"Logged in kg at check-in."},
  {key:"hrvNote",name:"HRV / notes",desc:"Free text for HRV and anything else about recovery."},
  {key:"perSetLogging",name:"Per-set logging",
   desc:"Adds a “Log each set” option to every exercise, for when the sets weren't all the same. The single load/reps/RPE row stays either way."}
];
/* palette+mode+view live in the same per-device settings object as the tracked fields.
   They are cosmetic, so they are deliberately NOT part of the session export — the
   `tracking` block is built from FIELD_DEFS alone, so nothing here can leak into a log. */
const SET_DEFAULTS={painLabel:"Knee",palette:"a",mode:"auto",view:"list"};
FIELD_DEFS.forEach(f=>SET_DEFAULTS[f.key]=true);
let SETTINGS={...SET_DEFAULTS};

function loadSettings(){
  try{const raw=localStorage.getItem(LS.set);
    if(raw)SETTINGS={...SET_DEFAULTS,...JSON.parse(raw)};}catch(e){}
}
function saveSettings(){localStorage.setItem(LS.set,JSON.stringify(SETTINGS));}

/* ---------- theme ----------
   Two palettes × light/dark. "Auto" follows the phone's own light/dark setting, so the
   basement session is dark and a daytime check-in isn't blinding, with no tap needed. */
const PALETTES=[
  {key:"a",name:"Amber",desc:"Black, navy, amber",
   swatch:["#000000","#14213d","#fca311","#e5e5e5","#ffffff"]},
  {key:"b",name:"Mint",desc:"Slate, teal, mint",
   swatch:["#364958","#3b6064","#55828b","#87bba2","#c9e4ca"]}
];
const MODES=[["auto","Auto"],["light","Light"],["dark","Dark"]];
const prefersLight=matchMedia("(prefers-color-scheme: light)");

function themeId(){
  const p=SETTINGS.palette==="b"?"b":"a";
  const dark=SETTINGS.mode==="auto"?!prefersLight.matches:SETTINGS.mode!=="light";
  return p+(dark?"-dark":"-light");
}
function applyTheme(){
  document.documentElement.dataset.theme=themeId();
  /* Keeps the phone's own chrome (status bar / task switcher) in step with the app. */
  const c=getComputedStyle(document.documentElement).getPropertyValue("--meta-theme").trim();
  if(c)$("#metaTheme").setAttribute("content",c);
}
/* Only matters in Auto; harmless otherwise. addEventListener over onchange because
   older iOS Safari only has the deprecated addListener — guarded. */
if(prefersLight.addEventListener)prefersLight.addEventListener("change",()=>{
  if(SETTINGS.mode==="auto")applyTheme();});
else if(prefersLight.addListener)prefersLight.addListener(()=>{
  if(SETTINGS.mode==="auto")applyTheme();});
/* "Knee" -> "Knee pain"; blank -> plain "Pain", so it reads sensibly for anyone. */
function painLbl(suffix){
  const site=(SETTINGS.painLabel||"").trim();
  return (site?site+" pain":"Pain")+(suffix||"");
}

function renderAppearance(host){
  host.innerHTML="";
  const pals=el("div",{className:"pals"});
  PALETTES.forEach(p=>{
    const dots=el("div",{className:"dots"},
      p.swatch.map(c=>el("i",{attrs:{style:"background:"+c}})));
    const b=el("button",{className:"pal",attrs:{"aria-pressed":String(SETTINGS.palette===p.key)}},
      [dots,el("div",{className:"pn"},p.name),el("div",{className:"pd"},p.desc)]);
    b.onclick=()=>{SETTINGS.palette=p.key;saveSettings();applyTheme();renderAppearance(host);};
    pals.append(b);
  });
  host.append(pals);

  const seg=el("div",{className:"seg"});
  MODES.forEach(([k,label])=>{
    const b=el("button",{attrs:{"aria-pressed":String(SETTINGS.mode===k)}},label);
    b.onclick=()=>{SETTINGS.mode=k;saveSettings();applyTheme();renderAppearance(host);};
    seg.append(b);
  });
  host.append(seg);
  host.append(el("p",{className:"seg-note"},SETTINGS.mode==="auto"
    ?`Auto follows this phone's light/dark setting — currently ${prefersLight.matches?"light":"dark"}.`
    :"Fixed, whatever the phone is set to."));
}

function renderFields(host){
  host.innerHTML="";
  host.append(el("p",{className:"dnote"},"Turn off what you don't need. Nothing already logged is deleted — hidden fields just stop appearing, and the export records what you were tracking."));
  FIELD_DEFS.forEach(f=>{
    const sw=el("button",{className:"sw",attrs:{role:"switch","aria-checked":String(!!SETTINGS[f.key]),
      "aria-label":f.name}});
    sw.onclick=()=>{
      SETTINGS[f.key]=!SETTINGS[f.key];
      sw.setAttribute("aria-checked",String(SETTINGS[f.key]));
      /* Both halves of the app render these fields: the exercise cards in main and the
         check-in in the drawer directly above this switch. */
      saveSettings();renderCheckin();renderMain();
    };
    host.append(el("div",{className:"togrow"},[
      el("div",{className:"tl"},[el("div",{className:"tn"},f.name),el("div",{className:"td"},f.desc)]),
      sw]));
  });
  /* Pain wording is body-part specific; keep it editable rather than hardcoding "Knee". */
  const inp=el("input",{type:"text",value:SETTINGS.painLabel||"",
    attrs:{placeholder:"e.g. Knee — leave blank for just “Pain”",maxlength:24}});
  /* Cards repaint per keystroke; the check-in waits for blur. It sits above this input in
     the same scroll container, and rebuilding it mid-word moves the ground under the
     keyboard. onchange fires on commit, which is soon enough for a label. */
  inp.oninput=()=>{SETTINGS.painLabel=inp.value;saveSettings();renderMain();};
  inp.onchange=()=>renderCheckin();
  host.append(el("div",{className:"togrow"},[
    el("div",{className:"tl"},[el("div",{className:"tn"},"Pain label"),
      el("div",{className:"td"},"Names the pain fields."),
      el("div",{style:"margin-top:8px"},inp)])]));
}

/* ---------- drawer ----------
   Week, day, date, the check-in, import/export and the settings. All of it is decided
   once and then read rarely, which is what earns a place off-screen: while the athlete
   is actually training, the screen is the training. */
let DAYBTNS=[];
/* Which accordions are open. In memory, not storage — it is "where I was a moment ago",
   not a preference, and rebuilding the drawer must not collapse a section under the
   athlete's thumb. */
const ACC={checkin:true,appearance:false,fields:false};

function accordion(key,title,build,statId){
  const stat=el("span",{className:"accstat"});
  if(statId)stat.id=statId;
  const body=el("div",{className:"accbody"});
  const d=el("details",{className:"acc"},
    [el("summary",{},[el("span",{className:"grow"},title),stat]),body]);
  if(ACC[key])d.setAttribute("open","");
  d.ontoggle=()=>{ACC[key]=!!d.open;};
  if(build)build(body);
  return d;
}

/* One line of "is the check-in done?", shown on the closed accordion so the answer
   doesn't cost a tap. */
function checkinSummary(s){
  const v=(s&&s.session)||{},b=[];
  if(SETTINGS.readiness&&txt(v.readiness))b.push(txt(v.readiness));
  if(SETTINGS.painOnWaking&&txt(v.amPainOnWaking))b.push(painLbl().toLowerCase()+" "+txt(v.amPainOnWaking)+"/10");
  if(SETTINGS.sleep&&txt(v.sleep))b.push("sleep "+txt(v.sleep)+"/5");
  if(SETTINGS.bodyweight&&txt(v.bodyweightKg))b.push(txt(v.bodyweightKg)+"kg");
  return b.join(" · ")||(checkinFilled(s)?"Filled":"Not filled");
}
/* Any value at all, including ones whose field is currently switched off — this decides
   whether to nag, and nagging about a field the athlete has hidden would be wrong. */
function checkinFilled(s){
  const v=(s&&s.session)||{};
  return Object.keys(BLANK_SESSION).some(k=>txt(v[k])!=="");
}

function renderDayList(host){
  host.innerHTML="";DAYBTNS=[];
  const days=(PROGRAM.meta.days||[]);
  if(!days.length){host.append(el("p",{className:"dnote"},"This program lists no training days."));return;}
  days.forEach(d=>{
    const p=dayParts(d);
    const b=el("button",{className:"dayitem",attrs:{"aria-pressed":String(d===STATE.day)}},[
      el("span",{className:"dnum"},p.num||"·"),
      el("span",{className:"dwrap"},[
        el("span",{className:"dday"},p.short),
        el("span",{className:"dtheme"},dayTheme(d))])]);

    host.append(b);

}
function paintDays(){
  DAYBTNS.forEach(x=>x.node.setAttribute("aria-pressed",String(x.day===STATE.day)));

/* Day and date both switch which stored session is open, so the check-in has to be
   rebuilt from the new one; week does not (the session key is date + day). */
function selectDay(d){
  if(d===STATE.day)return;

}
function selectDate(v){
  STATE.date=v||todayISO();resetFocus();renderCheckin();renderHeader();renderMain();
}
function selectWeek(w){
  STATE.week=Number(w)||1;resetFocus();renderHeader();renderMain();
}

/* Rebuilt on its own rather than with the whole drawer: the sections below it hold
   scroll position and open/closed state that a full rebuild would throw away. */
function renderCheckin(){
  const host=$("#checkinHost");if(!host)return;
  host.innerHTML="";

/* ---------- exercise categories ----------
   Colour + label for an exercise's left rail. Resolution order:
     1. an explicit `category` on the exercise (tp-program-1 optional field)
     2. a keyword guess from the exercise name
     3. nothing — neutral rail, no tag (never assert a category we don't have)
   Colours are CSS variables, not hex: each theme picks rail colours from its own
   palette, so a category keeps its *slot* across themes rather than its exact hue. */
const CATS={
  warmup:  {label:"Warm-up",       color:"var(--cat-warm)"},
  tendon:  {label:"Tendon/prehab", color:"var(--cat-tendon)"},
  skill:   {label:"Skill",         color:"var(--cat-skill)"},
  strength:{label:"Strength",      color:"var(--cat-strength)"},
  cond:    {label:"Conditioning",  color:"var(--cat-cond)"},
  accessory:{label:"Accessory",    color:"var(--cat-accessory)"},
  cooldown:{label:"Cool-down",     color:"var(--cat-warm)"}
};
/* Aliases so a generator can say "conditioning", "metcon", "prehab" etc. */
const CAT_ALIASES={metcon:"cond",conditioning:"cond",aerobic:"cond",cardio:"cond",
  prehab:"tendon",rehab:"tendon",tendon:"tendon",isometric:"tendon",
  warmup:"warmup","warm-up":"warmup",prep:"warmup",
  cooldown:"cooldown","cool-down":"cooldown",mobility:"cooldown",
  skill:"skill",technique:"skill",olympic:"skill",
  strength:"strength",lift:"strength",main:"strength",
  accessory:"accessory",auxiliary:"accessory",core:"accessory"};
/* Ordered — skill lifts must win before the EMOM/interval rule, because
   "Hang power clean (EMOM every 90s)" is skill work, not conditioning. */
const CAT_RULES=[
  [/warm-?up|cool-?down|prep\b|mobility/i,                               "warmup"],
  [/isometric|spanish squat|nordic|copenhagen|tibialis|prehab|neck iso/i, "tendon"],
  [/clean|snatch|jerk|muscle-?up|skill|high pull/i,                       "skill"],
  [/metcon|emom|amrap|for time|interval|erg\b|bike|\bski\b|sled|couplet/i,"cond"],
  [/squat|deadlift|rdl|press|bench|\brow\b|pull-?up|\bchin|\bdip|hinge/i, "strength"]
];
/* Unknown declared categories still get a stable colour rather than falling back to
   grey, so a generator can invent its own vocabulary and the UI keeps working. Drawn
   from the active theme's rail colours so an invented category can't import a hue the
   palette doesn't contain. */
const SPARE_COLORS=["var(--cat-skill)","var(--cat-strength)","var(--cat-cond)",
  "var(--cat-accessory)","var(--cat-tendon)","var(--cat-warm)"];
function spareColor(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return SPARE_COLORS[h%SPARE_COLORS.length];}
function titleCase(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function catOf(ex){
  const declared=(ex.category||"").toString().trim();
  if(declared){
    const k=declared.toLowerCase().replace(/[\s_]+/g,"-");
    const hit=CATS[k]||CATS[CAT_ALIASES[k]]||CATS[CAT_ALIASES[k.replace(/-/g,"")]];
    if(hit)return {...hit,source:"declared"};
    return {label:declared,color:spareColor(k),source:"declared"};
  }
  for(const[re,key]of CAT_RULES)
    if(re.test(ex.name||""))return {...CATS[key],source:"guessed"};
  return null;                                  /* no tag, neutral rail */
}

/* ---------- program loading ----------
   Two programme schemas are live at once, on purpose:
     tp-program-1  Week 1 only; later weeks described in prose in `progression`.
     tp-program-2  every week authored as its own rows.
   A phone can be mid-block on a v1 programme in localStorage, so v1 must keep
   working indefinitely — this is the one place the difference is decided, and
   everything else asks dayExercises(). See docs/data-contracts.md. */
function isV2(){return !!(PROGRAM&&PROGRAM.meta&&PROGRAM.meta.schema==="tp-program-2");}
/* The exercises on screen right now. v2 filters by day AND week; v1 by day only,
   because under v1 every row is week 1 and filtering on week would empty the list. */
function dayExercises(){
  if(!PROGRAM||!Array.isArray(PROGRAM.exercises))return [];
  return PROGRAM.exercises.filter(e=>
    e.day===STATE.day && (!isV2() || Number(e.week)===Number(STATE.week)));
}
/* A v2 row whose `week` isn't a number matches no week at all, so the exercise would
   vanish from the whole block and the athlete would simply never do it. The generator
   rejects that input, but a hand-edited programme can still arrive — count them so the
   UI can say so out loud rather than quietly dropping work. */
function orphanExercises(){
  if(!isV2())return [];
  return PROGRAM.exercises.filter(e=>e.day===STATE.day&&!Number.isFinite(Number(e.week)));
}
/* meta.athleteId names the athlete/<slug>/logs/ folder an export belongs in. v1
   programmes predate it; derive the same slug from the display name so a log file
   is still filed correctly. A label, never a selector — the app has no profiles. */
function athleteId(){
  if(!PROGRAM||!PROGRAM.meta)return "";
  return PROGRAM.meta.athleteId||slug(PROGRAM.meta.athlete)||"";
}
/* Revision of the loaded programme. A week gets revised mid-block after a review, and
   re-importing is a manual step with no prompt — so this is shown next to the block name
   and stamped on every export, to answer "is the phone on the current version?" without
   diffing prescriptions. 0 means the programme predates versioning; the UI stays silent
   rather than claiming "v1", which would be a guess. */
function progVersion(){
  const v=PROGRAM&&PROGRAM.meta?Number(PROGRAM.meta.version):NaN;
  return Number.isFinite(v)&&v>0?Math.floor(v):0;
}

function loadProgram(obj){
  if(!obj||!obj.meta||!Array.isArray(obj.exercises))throw new Error("Not a valid program.json (need meta + exercises).");
  PROGRAM=obj; localStorage.setItem(LS.prog,JSON.stringify(obj));
  STATE.week=1; STATE.day=(obj.meta.days&&obj.meta.days[0])||null; STATE.date=todayISO();
  resetFocus();
  renderAll();
}
async function boot(){
  loadSettings();
  applyTheme();          /* head script already painted it; this keeps meta + state in sync */
  const saved=localStorage.getItem(LS.prog);
  if(saved){try{PROGRAM=JSON.parse(saved);}catch(e){}}
  if(!PROGRAM){try{const r=await fetch("./program.json",{cache:"no-store"});if(r.ok)PROGRAM=await r.json();}catch(e){}}
  if(PROGRAM){STATE.day=(PROGRAM.meta.days&&PROGRAM.meta.days[0])||null;resetFocus();}
  renderAll();
}

/* ---------- session persistence ---------- */
/* `amPainOnWaking` replaced `amPainNextDay` at tp-session-3. The old field asked for
   tomorrow's response to today's session, which meant re-opening a closed session the
   next morning — so in practice it arrived empty, and an empty tendon reading looks
   exactly like a good one. This is the same measurement taken at check-in, when the app
   is already open. It is the response to the PREVIOUS session; see docs/data-contracts.md. */
const BLANK_SESSION={bodyweightKg:"",sleep:"",readiness:"",hrvNote:"",amPainOnWaking:"",overall:""};
function sessionKey(){return LS.sess(STATE.date,STATE.day);}
function getSession(){
  const raw=localStorage.getItem(sessionKey());
  if(raw){
    try{
      const s=JSON.parse(raw);
      /* Normalise on the way in. A session written by an older build can be missing
         `session` or `entries` entirely, and rendering must not die on it — a blank
         app with a full localStorage is the one failure with no way back in the gym. */
      if(s&&typeof s==="object"){
        s.session={...BLANK_SESSION,...(s.session||{})};
        if(!s.entries||typeof s.entries!=="object")s.entries={};
        return s;
      }
    }catch(e){}
  }
  return {block:PROGRAM?PROGRAM.meta.block:"",athlete:PROGRAM?PROGRAM.meta.athlete:"",
    week:STATE.week,day:STATE.day,date:STATE.date,
    session:{...BLANK_SESSION},
    entries:{}};
}
function saveSession(s){s.week=STATE.week;s.day=STATE.day;s.date=STATE.date;
  localStorage.setItem(sessionKey(),JSON.stringify(s));updateProgress();}

/* ---------- rendering ---------- */
function renderAll(){renderHeader();renderDrawer();renderMain();}

/* The header carries only what has to be true while training: which session this is,
   how far through it you are, and which date it is being logged onto. Everything else
   moved into the drawer. */
function renderHeader(){
  const name=$("#blockName"),sub=$("#blockSub");
  if(!PROGRAM){
    name.textContent="Training Tracker";
    sub.textContent="No program loaded — tap Import";
    $("#ctxLine").textContent="Training Tracker";
    $("#ctxSub").textContent="Import a program to begin";
    return;
  }
  name.textContent=PROGRAM.meta.block||"Training block";
  const rev=progVersion();
  sub.textContent=`${PROGRAM.meta.athlete||""} · ${PROGRAM.meta.weeks||"?"}-week block`
    +(rev?` · v${rev}`:"");
  $("#ctxLine").textContent=STATE.day
    ?`Week ${STATE.week} · ${dayParts(STATE.day).short}`:`Week ${STATE.week}`;
  $("#ctxSub").textContent=STATE.day?dayTheme(STATE.day):"No training days in this program";
}
/* "Day 1 (Mon) - Clean Skill + Front Squat" -> {num:"D1", short:"Mon"} */
function dayParts(d){
  const m=/\(([A-Za-z]{3,9})\)/.exec(d||""), n=/Day\s*(\d+)/i.exec(d||"");
  return {num:n?"D"+n[1]:"", short:m?m[1]:((d||"").split(/[\s(-]/)[0]||"Day")};
}
/* …and the part after the dash, which names what the session actually is. Falls back to
   the whole label rather than to nothing — a generator need not use the dash. */
function dayTheme(d){
  const s=(d||"").trim();
  const m=/\s[-–—]\s(.+)$/.exec(s);
  return m?m[1].trim():s;
}
/* A date that isn't today is legitimate — it is how a session gets completed after the
   fact — but it is silent, and logging onto the wrong day can't be undone. Say it. */
function fmtDate(iso){
  try{
    const d=new Date(iso+"T00:00:00");
    if(isNaN(d.getTime()))return iso;
    return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  }catch(e){return iso;}
}

/* ---------- view mode ----------
   "list"  — every exercise for the day; the original screen.
   "focus" — one exercise, with prev/next and one pip per exercise in the header.
   Both draw the SAME exerciseCard: the focus view changes how many are on screen, and
   is never a second rendering path that could drift from the first. */
function viewMode(){return SETTINGS.view==="focus"?"focus":"list";}
function setView(v){
  const next=v==="focus"?"focus":"list";
  if(next===viewMode())return;
  SETTINGS.view=next;saveSettings();renderMain();scrollTop();
}
function syncView(){
  const focus=viewMode()==="focus";
  $("#viewAll").setAttribute("aria-pressed",String(!focus));
  $("#viewOne").setAttribute("aria-pressed",String(focus));
  $("#fExport").hidden=focus;
  $("#fNav").hidden=!focus;
  $("#pbar").hidden=focus;
  $("#pips").hidden=!focus;
}
function scrollTop(){if(window.scrollTo)window.scrollTo(0,0);}
/* Where to land when the session changes: the first thing not yet ticked off. */
function firstUndone(){
  const exs=dayExercises();
  if(!exs.length)return 0;
  const s=getSession();
  const i=exs.findIndex(e=>!(s.entries[e.id]&&s.entries[e.id].done));
  return i<0?exs.length-1:i;
}
function resetFocus(){STATE.focus=firstUndone();}
function clampFocus(){
  const n=dayExercises().length,i=Math.floor(Number(STATE.focus));
  STATE.focus=n?Math.max(0,Math.min(Number.isFinite(i)?i:0,n-1)):0;
}
function goFocus(i){
  const n=dayExercises().length;if(!n)return;
  const next=Math.max(0,Math.min(i,n-1));
  if(next===STATE.focus)return;
  STATE.focus=next;renderMain();scrollTop();
}
function stepFocus(d){goFocus(STATE.focus+d);}

function renderMain(){
  const m=$("#main");m.innerHTML="";
  if(!PROGRAM){
    const b=el("div",{className:"banner"},
      "No program.json loaded. Import the program.json from your Drive folder to begin.");
    const imp=el("button",{className:"primary"},"Import program…");
    imp.onclick=()=>$("#fileInp").click();
    b.append(el("div",{},imp));
    m.append(b);renderNav();updateProgress();return;
  }
  const s=getSession();
  const exs=dayExercises();
  /* v1 only: the rows on screen are the Week-1 template, so past week 1 the athlete
     has to apply the progression rule themselves. v2 authors every week, so the
     prescription shown IS this week's and the banner would be a lie. */
  if(!isV2()){
    const authoredWeeks=PROGRAM.exercises.map(e=>Number(e.week)||1);
    if(authoredWeeks.length&&STATE.week>Math.max(...authoredWeeks))
      m.append(el("div",{className:"banner"},`Week ${STATE.week}: prescriptions below are the Week-1 template — apply each exercise's Progression Rule for this week.`));
  }
  if(!exs.length)m.append(el("div",{className:"banner"},isV2()
    ?`No exercises for week ${STATE.week} of this day in the program.`
    :"No exercises for this day in the program."));
  const orphans=orphanExercises();
  if(orphans.length)m.append(el("div",{className:"banner"},
    `${orphans.length} exercise${orphans.length>1?"s":""} on this day (${orphans.map(o=>o.name).join("; ")}) have no valid week and are not shown in any week. Re-generate program.json.`));
  clampFocus();
  if(viewMode()==="focus"){
    if(exs.length)m.append(exerciseCard(exs[STATE.focus],s,STATE.focus));
  }else{
    exs.forEach((ex,i)=>m.append(exerciseCard(ex,s,i)));
  }
  renderNav();
  updateProgress();
}

/* The pip strip is rebuilt only when the set of exercises on screen changes; paintNav()
   keeps done-state and position current on every keystroke without rebuilding it. */
let PIPS=[];
function renderNav(){
  syncView();
  const host=$("#pips");host.innerHTML="";PIPS=[];
  if(viewMode()!=="focus"||!PROGRAM)return;
  dayExercises().forEach((ex,i)=>{
    const b=el("button",{className:"pip",attrs:{title:ex.name,
      "aria-label":`Exercise ${i+1}: ${ex.name}`}},String(i+1));
    b.onclick=()=>goFocus(i);
    PIPS.push(b);host.append(b);
  });
}
function paintNav(sess){
  const exs=PROGRAM&&STATE.day?dayExercises():[];
  const s=exs.length?(sess||getSession()):null;
  PIPS.forEach((b,i)=>{
    const ex=exs[i],e=ex&&s?s.entries[ex.id]:null;
    b.setAttribute("data-done",e&&e.done?"1":"0");
    b.setAttribute("aria-current",String(i===STATE.focus));
  });
  $("#navCount").textContent=exs.length
    ?`${Math.min(STATE.focus+1,exs.length)} / ${exs.length}`:"—";
  $("#prevBtn").disabled=STATE.focus<=0;
  $("#nextBtn").disabled=STATE.focus>=exs.length-1;
  const cur=PIPS[STATE.focus];
  if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"nearest"});
}

function field(labelText,node,unit){
  const fld=el("div",{className:"fld"+(unit?" has-unit":"")},[node]);
  if(unit)fld.append(el("span",{className:"unit"},unit));
  return el("div",{},[el("label",{className:"lbl"},labelText),fld]);
}

function sessionCard(s){
  const c=el("div",{className:"card sessioncard"});
  c.append(el("span",{className:"rail"}));
  c.dataset.readiness=SETTINGS.readiness?(s.session.readiness||""):"";
  /* No title: the accordion this sits in is already called "Session check-in", and the
     rail keeps carrying the readiness colour. */
  c.append(el("div",{className:"rx"},"Fill this before you start — it's how today began, not how it went."));
  const wrap=el("div",{className:"log"});
  const mk=(k,label,type="text",attrs={},unit)=>{
    const inp=el("input",{type,value:s.session[k]??"",attrs});
    inp.oninput=()=>{s.session[k]=inp.value;saveSession(s);};
    return field(label,inp,unit);
  };
  /* First in the grid on purpose: for a tendon block this is the highest-value number in
     the file, it is only true before training, and it used to be the one that got missed. */
  if(SETTINGS.painOnWaking)
    wrap.append(mk("amPainOnWaking",painLbl(" on waking"),"number",{min:0,max:10},"/10"));
  if(SETTINGS.readiness){
    const rd=el("select",{},["","Green","Amber","Red"].map(o=>
      el("option",{value:o,textContent:o||"Readiness…",selected:s.session.readiness===o})));
    rd.onchange=()=>{s.session.readiness=rd.value;saveSession(s);
      c.dataset.readiness=rd.value;};
    wrap.append(field("Readiness",rd));
  }
  if(SETTINGS.sleep)wrap.append(mk("sleep","Sleep","number",{min:1,max:5},"/5"));
  if(SETTINGS.bodyweight)wrap.append(mk("bodyweightKg","Bodyweight","number",{},"kg"));
  if(SETTINGS.hrvNote){
    const hrv=el("input",{type:"text",value:s.session.hrvNote||"",
      attrs:{placeholder:"e.g. HRV 62, at baseline"}});
    hrv.oninput=()=>{s.session.hrvNote=hrv.value;saveSession(s);};
    const f=field("HRV / notes",hrv);f.className="full";wrap.append(f);
  }
  if(wrap.children.length)c.append(wrap);
  const ov=el("textarea",{value:s.session.overall||"",attrs:{placeholder:"Overall session notes…"}});
  ov.oninput=()=>{s.session.overall=ov.value;saveSession(s);};
  c.append(el("div",{style:"margin-top:12px"},[el("label",{className:"lbl"},"Overall notes"),ov]));
  return c;
}

/* The hero is a right-aligned nowrap column, so it only works for a compact "6 × 2".
   The generator legitimately puts prose in sets/reps ("2 rounds" × "3 clean high pulls +
   3 tall cleans + …"); as a hero that crushes the exercise name to one letter per line.
   Past RX_MAX the prescription becomes a full-width line under the name instead. */
const RX_MAX=16;
const rxText=ex=>`${ex.sets||"?"} × ${ex.reps||"?"}`;
function heroEl(ex){
  const txt=rxText(ex);
  if(txt.length>RX_MAX)return null;
  const h=el("div",{className:"hero"+(txt.length>9?" long":"")},[txt]);
  if(ex.rpe)h.append(el("small",{},ex.rpe));
  return h;
}
function rxEl(ex){
  const r=el("div",{className:"rx set"},[rxText(ex)]);
  if(ex.rpe)r.append(el("span",{className:"rpe"},ex.rpe));
  return r;
}
function chipsEl(ex){
  const w=el("div",{className:"chips"});
  /* "-" is the generator's way of saying "not applicable" — don't render "Rest -". */
  if(ex.load)w.append(el("span",{className:"chip"},ex.load));
  if(ex.tempo&&ex.tempo!=="-")w.append(el("span",{className:"chip k"},"Tempo "+ex.tempo));
  if(ex.rest&&ex.rest!=="-")w.append(el("span",{className:"chip k"},"Rest "+ex.rest));
  return w;
}
const txt=v=>String(v??"").trim();
function summaryText(e){
  const b=[];
  const sets=Array.isArray(e.sets)?e.sets:[];
  const col=k=>sets.map(x=>txt(x[k])).filter(Boolean);
  /* When the sets differed, their shape is the point ("100 → 80 → 80" says the first
     set was wrong), so it beats the flat load, which is only the headline. When they
     agree, or when only the per-set rows were filled in, still say something: a card
     that reads "nothing logged" over data the athlete did enter looks like data loss
     and invites them to type it again. */
  const loads=col("load");
  if(loads.length>1&&new Set(loads).size>1)b.push(loads.join(" → "));
  else if(txt(e.load))b.push(txt(e.load));
  else if(loads.length)b.push(loads[0]+(loads.length>1?` ×${loads.length}`:""));

  if(txt(e.reps))b.push(txt(e.reps));
  else if(col("reps").length)b.push(col("reps").join("/"));

  const rpe=txt(e.rpe)||col("rpe").slice(-1)[0];
  if(rpe)b.push("RPE "+rpe);

  if(SETTINGS.painPerExercise){
    const pain=txt(e.painDuring)||col("painDuring").sort().slice(-1)[0];
    if(pain)b.push(painLbl().toLowerCase()+" "+pain+"/10");
  }
  return b.length?b.join(" · "):"nothing logged";
}

/* ---------- per-set logging (sets[], added at tp-session-2) ----------
   Deliberately opt-in per exercise. Most sets are the same, and rendering N rows of
   inputs on every card would slow down the common case for the sake of the rare one.
   The flat load/reps/RPE row above stays the summary and is never derived from these.

   `sets` is stored on the entry as an array; older stored sessions simply don't have
   the key yet, so every read goes through this. */
function entrySets(e){if(!Array.isArray(e.sets))e.sets=[];return e.sets;}
/* Set numbers are data, not decoration — renumber in the array before saving rather
   than while drawing, or removing set 1 leaves "set: 2, 3" in storage and the numbers
   only look right until the next render. */
function renumber(e){entrySets(e).forEach((r,i)=>{r.set=i+1;});return e.sets;}
/* Prescribed set count, when the generator gave a plain number. "3-4" or "AMRAP" are
   legitimate values there, so anything non-numeric just means "start with one row". */
function prescribedSets(ex){
  const m=/^\s*(\d+)\s*$/.exec(String(ex.sets??""));
  const n=m?parseInt(m[1],10):1;
  return Math.min(Math.max(n,1),12);
}
/* A new row copies the one before it — "same as previous set" is the common case, so
   adding a set is one tap and editing only what changed. The first row seeds from the
   flat fields the athlete has usually already filled in.

   `auto` marks a row the app filled in rather than the athlete. It is local bookkeeping
   only: exportSets() picks its keys explicitly, so it never reaches a log file. */
function newSet(e,i){
  const prev=entrySets(e)[i-1];
  if(prev)return {set:i+1,load:prev.load,reps:prev.reps,rpe:prev.rpe,painDuring:prev.painDuring,note:"",auto:true};
  return {set:i+1,load:txt(e.load),reps:"",rpe:txt(e.rpe),painDuring:txt(e.painDuring),note:"",auto:true};
}
/* Opening "Log each set" on a 7-set prescription materialises 7 rows, and the athlete
   then fills in the first one. Without this, the other six stay blank and the "one tap"
   promise is a lie — so an edit flows down into every row the athlete hasn't touched.
   Touching a row clears its `auto` flag and it stops following, which means propagation
   can never overwrite something that was typed. */
function propagate(e,i,key,value){
  const rows=entrySets(e);
  for(let j=i+1;j<rows.length;j++){
    if(!rows[j].auto)break;
    rows[j][key]=value;
  }
}
function setsEl(ex,e,s,repaint){
  const host=el("div",{className:"sets"});
  const rowCls="setrow"+(SETTINGS.painPerExercise?" pain":"");
  let armed=false;                                 /* "Clear sets" needs a second tap */
  const draw=()=>{
    host.innerHTML="";
    const rows=entrySets(e);
    if(rows.length){
      const head=[el("span",{className:"n"},"#"),
        el("span",{className:"c-load"},"Load"),
        el("span",{className:"c-reps"},"Reps"),
        el("span",{className:"c-rpe"},"RPE")];
      if(SETTINGS.painPerExercise)head.push(el("span",{className:"c-pain"},painLbl()));
      head.push(el("span",{className:"del"},""));
      host.append(el("div",{className:rowCls+" head"},head));
    }
    rows.forEach((r,i)=>{
      const cell=(k,cls,type,attrs={})=>{
        const inp=el("input",{className:cls,type,value:r[k]??"",attrs});
        inp.oninput=()=>{
          r[k]=inp.value;
          r.auto=false;                            /* typed in — stop following set 1 */
          propagate(e,i,k,inp.value);
          saveSession(s);
          /* Redraw so the rows that just followed show their new value. Re-focusing
             would fight the keyboard, so only redraw when something actually changed
             below this row. */
          if(rows.slice(i+1).some(x=>x.auto))draw();
          repaint();
        };
        return inp;
      };
      const kids=[el("span",{className:"n"},String(i+1)),
        cell("load","c-load","text",{placeholder:"kg","aria-label":`Set ${i+1} load`}),
        cell("reps","c-reps","text",{placeholder:"reps","aria-label":`Set ${i+1} reps`}),
        cell("rpe","c-rpe","text",{placeholder:"RPE","aria-label":`Set ${i+1} RPE`})];
      if(SETTINGS.painPerExercise)
        kids.push(cell("painDuring","c-pain","number",{min:0,max:10,placeholder:"0","aria-label":`Set ${i+1} ${painLbl().toLowerCase()}`}));
      const del=el("button",{className:"del",attrs:{"aria-label":`Remove set ${i+1}`}},"×");
      del.onclick=()=>{rows.splice(i,1);renumber(e);saveSession(s);armed=false;draw();repaint();};
      kids.push(del);
      host.append(el("div",{className:rowCls},kids));
      /* Always rendered, not hidden behind another tap: "too heavy" on set 1 is
         precisely the signal the coach needs, and it is worthless if it is awkward
         to reach with a bar racked. */
      const note=el("input",{type:"text",value:r.note||"",
        attrs:{placeholder:`Set ${i+1} note…`,"aria-label":`Set ${i+1} note`}});
      note.oninput=()=>{r.note=note.value;r.auto=false;saveSession(s);};
      host.append(el("div",{className:"setnote"},note));
    });
    const add=el("button",{className:"setbtn"},
      rows.length?"+ Add set":`Log each set (${prescribedSets(ex)} prescribed)`);
    add.onclick=()=>{
      if(rows.length)rows.push(newSet(e,rows.length));
      else for(let i=0;i<prescribedSets(ex);i++)rows.push(newSet(e,i));
      renumber(e);saveSession(s);armed=false;draw();repaint();
    };
    host.append(add);
    if(rows.length){
      const clear=el("button",{className:"setbtn danger"+(armed?" armed":"")},
        armed?"Tap again to clear all sets":"Clear sets");
      clear.onclick=()=>{
        if(!armed){armed=true;draw();setTimeout(()=>{if(armed){armed=false;draw();}},4000);return;}
        e.sets=[];saveSession(s);armed=false;draw();repaint();
      };
      host.append(clear);
    }
  };
  draw();
  return host;
}

function exerciseCard(ex,s,idx){
  const e=s.entries[ex.id]||(s.entries[ex.id]={done:false,load:"",reps:"",rpe:"",painDuring:"",notes:"",sets:[]});
  entrySets(e);                                   /* sessions saved before v2 have no key */
  const cat=catOf(ex);
  const c=el("div",{className:"card"+(e.done?" done":"")});
  if(cat)c.style.setProperty("--cat",cat.color);
  c.append(el("span",{className:"rail"}));

  const left=el("div",{className:"grow"});
  if(cat)left.append(el("div",{},el("span",{className:"tag"},cat.label)));
  left.append(el("div",{className:"ex-name"},ex.name));
  const hero=heroEl(ex);
  if(!hero)left.append(rxEl(ex));
  left.append(chipsEl(ex));
  c.append(el("div",{className:"ex-head"},hero?[left,hero]:[left]));

  if(ex.focus)c.append(collapse("Coach notes",ex.focus));
  if(ex.progression)c.append(collapse("Progression rule",ex.progression));

  const g=el("div",{className:"log tight"+(SETTINGS.painPerExercise?"":" nopain")});
  const mk=(k,label,type="text",attrs={},unit)=>{
    const inp=el("input",{type,value:e[k]??"",attrs});
    inp.oninput=()=>{e[k]=inp.value;saveSession(s);};return field(label,inp,unit);};
  /* Placeholders stay short — a long "e.g. …" clips in a 56px field and reads as a bug. */
  g.append(mk("load","Load","text",{placeholder:"90"},"kg"));
  g.append(mk("reps","Sets × reps","text",{placeholder:"4×6"}));
  g.append(mk("rpe","RPE","text",{placeholder:"7"}));
  if(SETTINGS.painPerExercise)
    g.append(mk("painDuring",painLbl(),"number",{min:0,max:10,placeholder:"0"},"/10"));
  /* Marking done folds the card to one summary line, so a finished session scans as a
     short list instead of a screen of filled-in inputs. Tap the line to re-open it. */
  const summary=el("div",{className:"summary-line"},
    [el("span",{className:"vals"},summaryText(e)),el("span",{className:"edit"},"Edit")]);
  const refreshSummary=()=>{summary.firstChild.textContent=summaryText(e);};

  /* Sits between the flat row and the notes: it elaborates the numbers directly
     above it, and only appears when the athlete asks for it. */
  if(SETTINGS.perSetLogging)g.append(setsEl(ex,e,s,refreshSummary));

  const nt=el("textarea",{value:e.notes||"",attrs:{placeholder:"Notes…"}});
  nt.oninput=()=>{e.notes=nt.value;saveSession(s);};
  g.append(el("div",{className:"full"},[el("label",{className:"lbl"},"Notes"),nt]));
  if(ex.logHint)g.append(el("div",{className:"hint"},"Log: "+ex.logHint));

  const btn=el("button",{className:"donebtn",attrs:{"aria-pressed":String(!!e.done)}},"Mark done");
  const extras=[...c.querySelectorAll("details"),...c.querySelectorAll(".chips")];
  let editing=false;
  const paint=()=>{
    const collapsed=e.done&&!editing;
    g.style.display=collapsed?"none":"";
    extras.forEach(n=>{n.style.display=collapsed?"none":"";});
    summary.style.display=collapsed?"flex":"none";
    summary.firstChild.textContent=summaryText(e);
    btn.textContent=e.done?"✓ Logged":"Mark done";
    btn.setAttribute("aria-pressed",String(!!e.done));
    c.classList.toggle("done",!!e.done);
  };
  summary.onclick=()=>{editing=true;paint();};
  btn.onclick=()=>{
    e.done=!e.done;editing=false;saveSession(s);paint();
    /* In the focus view, marking done means "on to the next one" — that is the whole
       reason to be in it. Only ever forward, only ever on the card being looked at, and
       never on un-marking, so a mis-tap costs one tap of Prev and nothing else. */
    if(e.done&&viewMode()==="focus"&&idx===STATE.focus&&idx<dayExercises().length-1){
      STATE.focus=idx+1;renderMain();scrollTop();toast("Logged: "+ex.name);
    }
  };
  c.append(g,summary,btn);
  paint();
  return c;
}

function collapse(title,body){
  const d=el("details");d.append(el("summary",{},title));d.append(el("div",{className:"body"},body));return d;
}

/* Called after every keystroke via saveSession(), so it repaints state and never
   rebuilds structure. Week and day live in the header context line now; this row
   carries the date and the count. */
function updateProgress(){
  const fill=$("#pbar > i"),cnt=$("#progCount"),lbl=$("#progLabel");
  if(!PROGRAM||!STATE.day){
    cnt.textContent="—";fill.style.width="0";lbl.textContent="Session";lbl.className="";
    $("#menuBtn").classList.remove("alert");
    paintNav();return;
  }
  const s=getSession();
  const exs=dayExercises();
  const done=exs.filter(e=>s.entries[e.id]&&s.entries[e.id].done).length;
  fill.style.width=(exs.length?Math.round(done/exs.length*100):0)+"%";
  const today=STATE.date===todayISO();
  lbl.textContent=fmtDate(STATE.date)+(today?"":" · not today");
  lbl.className=today?"":"off";
  cnt.textContent=`${done}/${exs.length} done`;
  /* The only nag in the app: a dot on the ≡ until the check-in has something in it.
     It lives here because this runs on every save, so it clears as soon as it's wrong. */
  $("#menuBtn").classList.toggle("alert",!checkinFilled(s));
  const stat=$("#checkinStat");
  if(stat)stat.textContent=checkinSummary(s);
  paintNav(s);
}

/* ---------- export ---------- */
const BLANK_ENTRY={done:false,load:"",reps:"",rpe:"",painDuring:"",notes:""};
/* Per-set rows are exported with a fixed key set and no holes, so the coach never has
   to probe for a missing field. Rows that are entirely empty are dropped: an untouched
   row the athlete added and never filled says nothing, and a phantom set in the log
   reads as a set that was actually performed. */
function exportSets(e){
  /* txt() coerces rather than assuming a string: a number that got in here from a
     hand-edited localStorage or a future code path must not throw. An export that
     silently does nothing is the worst failure this app has. */
  return (Array.isArray(e.sets)?e.sets:[])
    .map(r=>({load:txt(r.load),reps:txt(r.reps),rpe:txt(r.rpe),
              painDuring:txt(r.painDuring),note:txt(r.note)}))
    .filter(r=>r.load||r.reps||r.rpe||r.painDuring||r.note)
    .map((r,i)=>({set:i+1,...r}));
}
function buildSessionExport(){
  const s=getSession();
  const exs=dayExercises();
  /* `tracking` is additive metadata: it tells the coach whether an empty pain value means
     "no pain logged" or "this athlete doesn't track pain". Every other key keeps its shape
     so the review step never sees a missing field. See docs/data-contracts.md. */
  const tracking={painLabel:(SETTINGS.painLabel||"").trim()};
  FIELD_DEFS.forEach(f=>tracking[f.key]=!!SETTINGS[f.key]);
  return {
    schema:"tp-session-3",
    block:PROGRAM.meta.block,athlete:PROGRAM.meta.athlete,athleteId:athleteId(),
    /* Which revision of the programme this was actually trained off. Without it the coach
       has to diff the denormalised `prescribed` values against the current program.json to
       spot an athlete who never re-imported. 0 means the programme predates versioning. */
    programVersion:progVersion(),
    week:STATE.week,day:STATE.day,date:STATE.date,
    exportedAt:new Date().toISOString(),
    tracking,
    /* Merged, like entries: a session stored before a check-in field existed must
       still export every key, or the coach has to probe for missing ones. */
    session:{...BLANK_SESSION,...(s.session||{})},
    entries:exs.map(ex=>{
      const e={...BLANK_ENTRY,...(s.entries[ex.id]||{})};
      /* The flat load/reps/RPE are the athlete's own summary and are exported as
         logged — never recomputed from `sets`. When they disagree (flat 80, sets
         100/80/80) that difference is information, not drift. */
      const {sets,...flat}=e;
      return {exercise:ex.name,
        ...(ex.category?{category:ex.category}:{}),
        prescribed:{sets:ex.sets,reps:ex.reps,load:ex.load,rpe:ex.rpe},
        ...flat,
        sets:exportSets(e)};
    })
  };
}
/* Both export paths are wrapped: a throw here would look like the button doing
   nothing, at the one moment the session has to leave the phone. Better to say so —
   the data is still in localStorage and Copy JSON is the fallback. */
function exportSession(){
  if(!PROGRAM){toast("Load a program first");return;}
  try{
    const data=buildSessionExport();
    const name=`session-${STATE.date}-${slug(STATE.day)||"day"}.json`;
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=el("a",{href:url,download:name});document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    const who=athleteId();
    toast("Exported "+name+" — save into athlete/"+(who||"<you>")+"/logs/");
  }catch(err){toast("Export failed: "+err.message+" — try Copy JSON");}
}
async function copyJSON(){
  if(!PROGRAM){toast("Load a program first");return;}
  let json;
  try{json=JSON.stringify(buildSessionExport(),null,2);}
  catch(err){toast("Copy failed: "+err.message);return;}
  try{await navigator.clipboard.writeText(json);toast("Session JSON copied");}
  catch(e){const ta=el("textarea",{value:json});document.body.append(ta);ta.select();
    document.execCommand("copy");ta.remove();toast("Session JSON copied");}
}

/* ---------- events ----------
   The week / date / day controls are built by renderDrawer() and wired there, because
   they only exist while the drawer has been rendered. Everything wired here is markup
   that is present for the whole life of the page. */
$("#exportBtn").onclick=exportSession;
$("#copyBtn").onclick=copyJSON;
$("#menuBtn").onclick=toggleDrawer;
$("#ctxBtn").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#drawerBg").onclick=closeDrawer;
$("#viewAll").onclick=()=>setView("list");
$("#viewOne").onclick=()=>setView("focus");
$("#prevBtn").onclick=()=>stepFocus(-1);
$("#nextBtn").onclick=()=>stepFocus(1);
$("#fileInp").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const txt=await f.text();loadProgram(JSON.parse(txt));closeDrawer();toast("Program loaded");}
  catch(err){toast("Import failed: "+err.message);}
  e.target.value="";
};
/* Escape closes the drawer; arrow keys step through the focus view. Both are desktop
   conveniences — guarded, because the headless test harness has no event target. */
if(document.addEventListener)document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&drawerOpen()){closeDrawer();return;}
  if(drawerOpen()||viewMode()!=="focus")return;
  const t=e.target&&e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  if(e.key==="ArrowLeft")stepFocus(-1);
  else if(e.key==="ArrowRight")stepFocus(1);
});

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
boot();
</script>
