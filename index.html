<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Training Tracker</title>
<meta name="theme-color" content="#14213d" id="metaTheme" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tracker" />
<style>
  :root{
    /* 4px spacing scale */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
    /* type scale */
    --t-xs:.6875rem; --t-sm:.8125rem; --t-base:.9375rem; --t-md:1.0625rem;
    --t-lg:1.25rem; --t-hero:1.5rem;
    --r:14px; --r-sm:10px;
    /* Control heights. One scale, so a row of controls lines up and the primary action is
       never *shorter* than the fields above it, which reads as unfinished. */
    --h-field:48px; --h-tap:44px; --h-primary:52px;
  }
  /* ---------- themes ----------
     Two palettes × light/dark, chosen in the settings sheet and resolved onto
     <html data-theme> by applyTheme() (and by the head script, before first paint).
     Every colour below is a variable: no rule elsewhere in this file may hardcode a
     hex or rgba, or it will survive a theme switch and look broken in one of the four.

     Palette A "Amber": #000000 #14213d #fca311 #e5e5e5 #ffffff
     Palette B "Mint":  #c9e4ca #87bba2 #55828b #3b6064 #364958

     Surface levels (bg / panel / panel-hi / well / two line weights) are mixes and
     tints of each palette's own colours — five hexes can't fill six steps. The raw
     palette values carry ink, accent and category rails.
     Readiness Green/Amber/Red can't come from one chroma, so --good/--warn/--bad are
     semantic: in-palette where the palette has that hue, added where it doesn't. */

  /* A · dark — "Navy & Amber". Navy is the page itself, wells are black, and amber is
     used liberally (accent, disclosures, rails). Also the no-JS fallback. */
  html:not([data-theme]),html[data-theme="a-dark"]{
    --bg:#14213d; --panel:#1b2b4d; --panel-hi:#24365e; --well:#0b1428;
    --line:#33477a; --line-soft:#233255;
    --ink:#ffffff; --ink-dim:#e5e5e5; --muted:#9fadc9; --placeholder:#7182a5;
    --accent:#fca311; --on-accent:#000000; --accent-soft:rgba(252,163,17,.16);
    --accent-ink:#fca311;
    --accent2:#fca311; --accent2-soft:rgba(252,163,17,.10);
    --good:#47b48c; --good-soft:rgba(71,180,140,.14); --good-soft-2:rgba(71,180,140,.04);
    --good-line:rgba(71,180,140,.5);
    --warn:#fca311; --bad:#e2604d;
    --ring:0 0 0 3px rgba(252,163,17,.28); --scrim:rgba(0,0,0,.7);
    --footer-bg:rgba(27,43,77,.93); --bg-fade:rgba(20,33,61,0);
    --toast-bg:#000000; --toast-ink:#e5e5e5; --toast-line:#fca311;
    --top-hi-a:rgba(255,255,255,.10); --top-hi-b:rgba(255,255,255,.03);
    --tab-shadow:rgba(0,0,0,.45);
    --cat-warm:#8496b8; --cat-tendon:#fca311; --cat-skill:#e5e5e5;
    --cat-strength:#6d8ecb; --cat-cond:#d0830c; --cat-accessory:#bdb08f;
    --meta-theme:#14213d;
  }
  /* A · light — "Paper & Amber" */
  html[data-theme="a-light"]{
    --bg:#ffffff; --panel:#ffffff; --panel-hi:#e5e5e5; --well:#f4f5f7;
    --line:#c6cbd6; --line-soft:#dfe2e8;
    --ink:#14213d; --ink-dim:#33415f; --muted:#6c7893; --placeholder:#9aa3b5;
    --accent:#fca311; --on-accent:#14213d; --accent-soft:rgba(252,163,17,.18);
    --accent-ink:#b8760c;   /* amber as *text* fails on white — darken it, keep the fill amber */
    --accent2:#14213d; --accent2-soft:rgba(20,33,61,.06);
    --good:#1f7a5c; --good-soft:rgba(31,122,92,.10); --good-soft-2:rgba(31,122,92,.02);
    --good-line:rgba(31,122,92,.40);
    --warn:#b8760c; --bad:#c1402c;
    --ring:0 0 0 3px rgba(252,163,17,.32); --scrim:rgba(20,33,61,.42);
    --footer-bg:rgba(255,255,255,.94); --bg-fade:rgba(255,255,255,0);
    --toast-bg:#14213d; --toast-ink:#ffffff; --toast-line:#fca311;
    --top-hi-a:rgba(20,33,61,.05); --top-hi-b:rgba(20,33,61,.01);
    --tab-shadow:rgba(20,33,61,.16);
    --cat-warm:#8b93a6; --cat-tendon:#c07c14; --cat-skill:#14213d;
    --cat-strength:#41598f; --cat-cond:#a05f0c; --cat-accessory:#6d6250;
    --meta-theme:#ffffff;
  }
  /* B · dark — "Teal & Mint". Mid-dark teal page, pale mint as the accent, so buttons
     read light-on-dark rather than colour-on-dark. */
  html[data-theme="b-dark"]{
    --bg:#3b6064; --panel:#4a747a; --panel-hi:#55828b; --well:#2f4f53;
    --line:#6f9aa0; --line-soft:#557f85;
    --ink:#ffffff; --ink-dim:#c9e4ca; --muted:#aecdc3; --placeholder:#8fb0ab;
    --accent:#c9e4ca; --on-accent:#2f4f53; --accent-soft:rgba(201,228,202,.18);
    --accent-ink:#c9e4ca;
    --accent2:#87bba2; --accent2-soft:rgba(135,187,162,.12);
    --good:#c9e4ca; --good-soft:rgba(201,228,202,.15); --good-soft-2:rgba(201,228,202,.04);
    --good-line:rgba(201,228,202,.55);
    --warn:#e6bb5c; --bad:#e07d6c;
    --ring:0 0 0 3px rgba(201,228,202,.30); --scrim:rgba(31,52,55,.76);
    --footer-bg:rgba(74,116,122,.94); --bg-fade:rgba(59,96,100,0);
    --toast-bg:#364958; --toast-ink:#c9e4ca; --toast-line:#c9e4ca;
    --top-hi-a:rgba(255,255,255,.11); --top-hi-b:rgba(255,255,255,.03);
    --tab-shadow:rgba(0,0,0,.35);
    --cat-warm:#9db8bc; --cat-tendon:#87bba2; --cat-skill:#c9e4ca;
    --cat-strength:#b6dbe0; --cat-cond:#e6bb5c; --cat-accessory:#b7d3b0;
    --meta-theme:#3b6064;
  }
  /* B · light — "Mint Paper" */
  html[data-theme="b-light"]{
    --bg:#c9e4ca; --panel:#e2f1e2; --panel-hi:#cfe7d0; --well:#f4faf4;
    --line:#87bba2; --line-soft:#aed3b5;
    --ink:#364958; --ink-dim:#3b6064; --muted:#55828b; --placeholder:#87a8a3;
    --accent:#55828b; --on-accent:#f4faf4; --accent-soft:rgba(85,130,139,.14);
    --accent-ink:#3f6d76;
    --accent2:#3b6064; --accent2-soft:rgba(59,96,100,.08);
    --good:#3b7a5e; --good-soft:rgba(59,122,94,.12); --good-soft-2:rgba(59,122,94,.03);
    --good-line:rgba(59,122,94,.42);
    --warn:#a8741a; --bad:#a8473a;
    --ring:0 0 0 3px rgba(85,130,139,.30); --scrim:rgba(54,73,88,.44);
    --footer-bg:rgba(226,241,226,.94); --bg-fade:rgba(201,228,202,0);
    --toast-bg:#364958; --toast-ink:#c9e4ca; --toast-line:#55828b;
    --top-hi-a:rgba(255,255,255,.7); --top-hi-b:rgba(255,255,255,.2);
    --tab-shadow:rgba(54,73,88,.18);
    --cat-warm:#7d97a0; --cat-tendon:#3b7a5e; --cat-skill:#364958;
    --cat-strength:#55828b; --cat-cond:#a8741a; --cat-accessory:#6b8f6f;
    --meta-theme:#c9e4ca;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
  body{padding:0 var(--s3) calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
  body.profile-active{padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
  .tnum{font-variant-numeric:tabular-nums}

  /* ---------- the entry gate ----------
     Sign-in, the sample, and the honest blocked states. A known owner never sees this:
     the app routes straight to the hub. Programme calls stay behind program-store.js. */
  .profile-view{min-height:100vh;padding:calc(var(--s5) + env(safe-area-inset-top)) 0 var(--s5)}
  .profile-hero{padding:var(--s3) var(--s1) var(--s5)}
  .profile-kicker{font-size:var(--t-xs);font-weight:800;letter-spacing:.11em;
    text-transform:uppercase;color:var(--accent-ink)}
  .profile-title{font-size:clamp(1.75rem,8vw,2.5rem);line-height:1.05;margin:var(--s2) 0 0;
    letter-spacing:-.035em}
  .profile-lead{color:var(--muted);font-size:var(--t-md);line-height:1.5;margin:var(--s3) 0 0;
    max-width:36rem}
  .profile-body{display:grid;gap:var(--s3)}
  .profile-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:var(--s4)}
  .profile-card-title{font-size:var(--t-md);line-height:1.25;margin:0}
  .profile-copy{color:var(--muted);font-size:var(--t-sm);line-height:1.5;margin:var(--s2) 0 0}
  .profile-status{display:inline-flex;margin:var(--s3) 0 0;padding:5px 9px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent-ink);font-size:var(--t-xs);font-weight:800}
  .profile-actions{display:flex;gap:var(--s2);align-items:stretch;margin-top:var(--s3);flex-wrap:wrap}
  .profile-actions>button{flex:1 1 150px}
  .profile-wide{width:100%;margin-top:var(--s3)}
  .profile-programme{margin-top:var(--s3);padding:var(--s3);border-radius:var(--r-sm);
    border:1px solid var(--line-soft);background:var(--well)}
  .profile-programme-title{font-size:var(--t-base);font-weight:800;line-height:1.35}
  .profile-programme-meta{font-size:var(--t-xs);color:var(--muted);margin-top:3px}
  .profile-loading{border-style:dashed}
  .profile-error{border-left:3px solid var(--bad)}
  .profile-history-group{margin-top:var(--s4)}
  .profile-history-group:first-of-type{margin-top:var(--s3)}
  .profile-history-group-title{font-size:var(--t-base);margin:0 0 var(--s2)}
  .profile-history-item{margin-top:var(--s2);border:1px solid var(--line-soft);
    border-radius:var(--r-sm);background:var(--well);overflow:hidden}
  .profile-history-item>summary{display:grid;grid-template-columns:auto 1fr auto;gap:2px var(--s2);
    padding:var(--s3);cursor:pointer;list-style:none}
  .profile-history-item>summary::-webkit-details-marker{display:none}
  .profile-history-item>summary::after{content:"›";grid-column:3;grid-row:1/3;align-self:center;
    color:var(--muted);font-size:var(--t-lg);transition:transform .16s}
  .profile-history-item[open]>summary::after{transform:rotate(90deg)}
  .profile-history-date{font-size:var(--t-sm);font-weight:800}
  .profile-history-day{font-size:var(--t-sm);font-weight:700;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .profile-history-state{grid-column:1/-1;font-size:var(--t-xs);color:var(--muted)}
  .profile-history-state.conflict{color:var(--warn);font-weight:800}
  .profile-history-state.queued{color:var(--accent);font-weight:700}
  .profile-history-detail{padding:0 var(--s3) var(--s2);border-top:1px solid var(--line-soft)}
  .profile-history-checkin{font-size:var(--t-xs);line-height:1.5;color:var(--ink-dim)}
  .profile-history-exercise{padding:var(--s2) 0;border-top:1px solid var(--line-soft)}
  .profile-history-exercise-title{font-size:var(--t-sm);font-weight:750}
  .profile-history-exercise-copy{font-size:var(--t-xs);line-height:1.45;color:var(--muted);
    margin-top:2px}
  .profile-history-item>.profile-actions{padding:0 var(--s3) var(--s3);margin-top:var(--s2)}
  .demo-banner{display:flex;align-items:center;gap:var(--s2);padding:7px var(--s3);
    margin:calc(var(--s4) * -1) 0 var(--s2);border-radius:0 0 var(--r-sm) var(--r-sm);
    background:var(--accent-soft);color:var(--accent-ink);font-size:var(--t-xs);font-weight:800}
  .demo-banner[hidden]{display:none}
  .profile-sync{margin:var(--s2) 0 0;font-size:var(--t-xs);color:var(--muted);line-height:1.5}

  /* ---------- the hub ----------
     Today first and largest, the last few sessions inline, then one row each to
     everything else. Typographic hierarchy and hairlines carry it, not nested cards. */
  .home-view{min-height:100vh;padding:calc(var(--s5) + env(safe-area-inset-top)) 0 var(--s5)}
  .home-kicker{font-size:var(--t-xs);font-weight:800;letter-spacing:.11em;
    text-transform:uppercase;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hometoday{padding:var(--s3) 0 var(--s5);border-bottom:1px solid var(--line)}
  .ht-top{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
  /* The one genuinely large thing in the app. */
  .ht-date{font-size:clamp(1.6rem,7vw,2.25rem);font-weight:800;letter-spacing:-.03em;
    line-height:1.05;font-variant-numeric:tabular-nums}
  /* Amber is reserved for *now*, so it is spent here and on the calendar's today ring. */
  .ht-rel{font-size:var(--t-xs);font-weight:700;text-transform:uppercase;
    letter-spacing:.12em;color:var(--accent-ink)}
  .hometoday[data-state="rest"] .ht-rel,
  .hometoday[data-state="review"] .ht-rel,
  .hometoday[data-state="noprogram"] .ht-rel{color:var(--muted)}
  .ht-what{margin-top:var(--s2);color:var(--muted);font-size:var(--t-base)}
  .ht-what strong{color:var(--ink);font-weight:700}
  .ht-note{margin:var(--s2) 0 0;color:var(--muted);font-size:var(--t-sm)}
  .hometoday[data-state="resume"] .ht-note{color:var(--accent-ink);font-weight:600}
  .hometoday[data-state="review"] .ht-note{color:var(--good);font-weight:700}
  .ht-action{margin-top:var(--s4)}
  .ht-action button{width:100%;min-height:var(--h-primary)}
  .ht-quiet{margin-top:var(--s3)}

  .homesection{margin-top:var(--s5)}
  .hs-title{font-size:var(--t-xs);font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:var(--s1)}
  /* A row, not a card: the whole line is the target and a hairline between rows is all
     the structure it needs. */
  .homerow{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
    background:transparent;border:0;border-bottom:1px solid var(--line-soft);
    border-radius:0;padding:var(--s3) 2px;min-height:var(--h-field)}
  .homerow:active{background:var(--accent2-soft);transform:none}
  .homerow:focus-visible{box-shadow:var(--ring)}
  .hr-main{flex:1 1 auto;min-width:0}
  .hr-title{display:block;font-weight:700;font-size:var(--t-base);line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hr-sub{display:block;font-size:var(--t-xs);font-weight:400;color:var(--muted);
    line-height:1.35;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hr-chev{flex:0 0 auto;color:var(--muted);font-size:var(--t-md);font-weight:700}
  .hr-mark{flex:0 0 auto;width:20px;text-align:center;font-size:var(--t-md);
    font-weight:700;color:var(--muted)}
  .hr-mark[data-state="part"]{color:var(--accent-ink)}
  .hr-mark[data-state="done"]{color:var(--good)}

  /* ---------- one chrome for Calendar / Programme / Account ----------
     Three screens sharing a back arrow, a title and a body — none gets its own. */
  .page-view{min-height:100vh;padding:0 0 var(--s5)}
  .pagebar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;
    align-items:center;gap:var(--s3);
    padding:calc(var(--s3) + env(safe-area-inset-top)) 0 var(--s3)}
  .pagetitle{flex:1 1 auto;min-width:0;font-weight:700;font-size:var(--t-md);
    letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .page-body{display:grid;gap:var(--s4)}
  .page-copy{margin:var(--s2) 0 0;color:var(--muted);font-size:var(--t-sm);line-height:1.5}
  .panel{padding-bottom:var(--s4);border-bottom:1px solid var(--line)}
  .panel-title{font-size:var(--t-xs);font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .panel-value{margin-top:var(--s1);font-size:var(--t-lg);font-weight:800;
    letter-spacing:-.02em}
  .panel-days{margin-top:var(--s3);display:flex;gap:var(--s2);flex-wrap:wrap}
  .pd-item{font-size:var(--t-xs);font-weight:700;color:var(--ink-dim);
    background:var(--well);border:1px solid var(--line-soft);border-radius:var(--r-sm);
    padding:4px 8px}
  .panel-body{margin-top:var(--s2)}
  .panel-edit{margin-top:var(--s3)}
  .panel-edit input,.panel-edit button{width:100%;min-height:var(--h-tap)}

  /* ---------- the calendar ----------
     Eight columns: a week label and seven days, in one continuous scroll with no
     month/block mode switch — it reads as a timeline, which suits a block that does not
     care about month boundaries. A cell is about 37px at 320 and 47px at 390, which is
     exactly why it holds a date number and one state mark and nothing else. */
  .cal{display:grid;grid-template-columns:20px repeat(7,minmax(0,1fr));gap:2px}
  .cal-corner{min-height:16px}
  .cal-dow{font-size:var(--t-xs);font-weight:700;color:var(--muted);text-align:center;
    padding-bottom:2px}
  .cal-week{display:grid;place-items:center;font-size:var(--t-xs);font-weight:800;
    color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .cal-week.out{color:var(--placeholder);font-weight:600}
  .cal-cell{position:relative;aspect-ratio:1/1;min-height:34px;padding:0;display:grid;
    place-content:center;justify-items:center;background:transparent;
    border:1px solid transparent;border-radius:var(--r-sm);color:var(--muted)}
  .cc-num{font-size:var(--t-sm);font-weight:600;line-height:1.1}
  .cc-mark{font-size:9px;font-weight:800;line-height:1;min-height:9px}
  .cal-cell[data-state="scheduled"],.cal-cell[data-state="claimed"]{
    border-color:var(--line);color:var(--ink-dim)}
  .cal-cell[data-state="part"]{border-color:var(--accent);color:var(--accent-ink);
    background:var(--accent-soft)}
  .cal-cell[data-state="sealed"]{border-color:var(--good-line);color:var(--good);
    background:var(--good-soft)}
  .cal-cell[data-state="part"] .cc-num,.cal-cell[data-state="sealed"] .cc-num{font-weight:800}
  .cal-cell[data-today="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
  .cal-cell:focus-visible{box-shadow:var(--ring)}
  .cal-cell:active{transform:scale(.94)}
  /* A hairline, not a number: on the calendar the trend is the point, not the reading. */
  .cc-pain{position:absolute;left:34%;right:34%;bottom:4px;height:2px;border-radius:2px;
    background:var(--warn);opacity:.75}
  .cc-pain[data-level="high"]{background:var(--bad)}
  .cal-legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin-top:var(--s4)}
  .cl-item{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);
    color:var(--muted)}
  .cl-mark{display:inline-grid;place-items:center;width:16px;height:16px;flex:0 0 auto;
    border:1px solid var(--line);border-radius:4px;font-size:8px;font-weight:800}
  .cl-mark[data-state="part"]{border-color:var(--accent);color:var(--accent-ink)}
  .cl-mark[data-state="sealed"]{border-color:var(--good-line);color:var(--good)}
  .cl-pain{display:inline-block;width:16px;height:2px;flex:0 0 auto;border-radius:2px;
    background:var(--warn)}

  /* ---------- header ----------
     The date view's own two rows: a way back to the hub and a context line on row 1, the
     Overview/Log toggle and the done count on row 2. Nothing is decided here — week and
     day are a claim made in one picker, the date is the calendar, the check-in is at the
     top of the date view, and settings live on the Account screen. */
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:var(--s4) 0 var(--s2)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;
    background:linear-gradient(var(--bg),var(--bg-fade));pointer-events:none}
  .row{display:flex;gap:var(--s2);align-items:center}
  .grow{flex:1 1 auto;min-width:0}
  .iconbtn{position:relative;flex:0 0 auto;width:38px;height:38px;padding:0;display:grid;
    place-items:center;background:transparent;border:1px solid var(--line);
    border-radius:var(--r-sm)}
  .iconbtn svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .iconbtn:active svg{stroke:var(--ink)}

  /* The whole context line is the claim trigger: training a different week or day is a
     tap on the thing you are already reading. */
  .ctx{flex:1 1 auto;min-width:0;background:transparent;border:0;padding:2px;
    text-align:left;border-radius:var(--r-sm)}
  .ctx-1{display:block;font-weight:700;font-size:var(--t-md);letter-spacing:-.2px;
    line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Logging onto a date other than today is legitimate, but silent and unrecoverable if
     it was a mistake — so say so, in the warn colour. */
  .ctx-1.off{color:var(--warn)}
  .ctx-2{display:block;color:var(--muted);font-size:var(--t-sm);font-weight:400;
    margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* progress row: the view toggle (worded, not iconic) and the done count */
  .prog-wrap{margin-top:var(--s3)}
  .prog-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);
    margin-bottom:7px}
  .prog-top .count{color:var(--ink);font-weight:700;font-size:var(--t-sm);flex:0 0 auto}
  .viewseg{flex:0 0 auto;display:flex;gap:2px;padding:3px;background:var(--well);
    border:1px solid var(--line-soft);border-radius:999px}
  .viewseg button{border:0;background:transparent;color:var(--muted);border-radius:999px;
    padding:8px 15px;font-size:var(--t-sm);font-weight:700}
  .viewseg button[aria-pressed="true"]{background:var(--panel-hi);color:var(--ink);
    box-shadow:0 1px 3px var(--tab-shadow)}
  .pbar{position:relative;height:6px;border-radius:999px;background:var(--well);
    overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-soft)}
  .pbar[hidden]{display:none}
  /* Two layers, one bar: how much is finished, and — dimmer, behind it — how much is
     started. Without the second, four half-logged exercises read as 0% through. */
  .pbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;
    background:var(--accent);transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .pbar i.part{background:var(--accent-soft)}

  /* Log view only: the bar becomes numbered pips, which say the same thing about
     progress and also where you are and what you can jump to. Sticky with the header,
     so a long card never hides the way out of it. */
  .pips{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .pips::-webkit-scrollbar{display:none}
  .pips[hidden]{display:none}
  .pip{flex:0 0 auto;min-width:30px;height:28px;padding:0 7px;border-radius:999px;
    border:1px solid var(--line-soft);background:var(--well);color:var(--muted);
    font-size:var(--t-xs);font-weight:700;font-variant-numeric:tabular-nums}
  /* Started-but-not-finished needs its own look, or a half-logged exercise is
     indistinguishable from one nobody has touched. */
  .pip[data-part="1"]{color:var(--accent-ink);border-color:var(--accent);
    background:var(--accent-soft)}
  .pip[data-done="1"]{color:var(--good);border-color:var(--good-line);background:var(--good-soft)}
  .pip[aria-current="true"]{background:var(--accent);border-color:var(--accent);
    color:var(--on-accent)}

  /* ---------- controls ---------- */
  select,input,textarea,button{font:inherit;color:var(--ink);background:var(--well);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;outline:none;
    max-width:100%;min-width:0;transition:border-color .15s,box-shadow .15s,background .15s}
  /* Tabular figures everywhere a number is typed: proportional digits make a load or an
     RPE jump sideways as it is typed, which reads as the field fighting you. */
  input,textarea{font-weight:600}
  input{font-variant-numeric:tabular-nums}
  input::placeholder,textarea::placeholder{color:var(--placeholder);font-weight:400}
  /* Number spinners are unusable with a chalked thumb and steal ~15px of field width —
     enough that a pain score of "10" was being clipped in the narrow Pain column. */
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;display:none}
  select{-webkit-appearance:none;background-color:var(--panel-hi);font-weight:600;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
      linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;
    background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:var(--ring)}
  button{cursor:pointer;background:var(--panel-hi);font-weight:600}
  button:active{transform:scale(.97)}
  /* The same 1px light-from-above the cards use, so the primary reads as a raised object
     rather than a coloured rectangle — and a press that dims as well as shrinks. */
  button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);
    font-weight:700;box-shadow:inset 0 1px 0 var(--top-hi-a)}
  button.primary:active{transform:scale(.985);filter:brightness(.94)}
  button.ghost{background:transparent}
  button.ghost.danger{color:var(--muted)}
  button.ghost.danger.armed{border-color:var(--bad);color:var(--bad);font-weight:700}
  .mini{font-size:var(--t-sm);padding:7px 11px}

  /* Week stepper (claim picker) — bigger targets than a bare <select>, and stepping a
     week is the most-used move in the picker. */
  .stepper{display:flex;align-items:center;gap:var(--s2)}
  .stepbtn{width:var(--h-tap);height:var(--h-tap);padding:0;font-size:var(--t-lg);
    font-weight:700;flex:0 0 auto}
  .stepval{flex:1 1 auto;text-align:center;text-align-last:center;font-weight:700;
    font-size:var(--t-base);height:var(--h-tap)}

  /* Day list (claim picker) — a full-width row per day, so the session theme is readable
     instead of being a truncated tab. */
  .daylist{display:flex;flex-direction:column;gap:var(--s1);margin-top:var(--s3)}
  .dayitem{display:flex;gap:var(--s3);align-items:baseline;width:100%;text-align:left;
    background:var(--well);border:1px solid var(--line-soft);border-radius:var(--r-sm);
    padding:10px var(--s3)}
  .dayitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .dayitem .dnum{flex:0 0 auto;min-width:26px;font-size:var(--t-xs);font-weight:800;
    color:var(--muted);letter-spacing:.5px}
  .dayitem[aria-pressed="true"] .dnum{color:var(--accent-ink)}
  .dayitem .dwrap{flex:1 1 auto;min-width:0}
  .dayitem .dday{display:block;font-size:var(--t-sm);font-weight:700;line-height:1.25}
  .dayitem .dtheme{display:block;font-size:var(--t-xs);font-weight:400;color:var(--muted);
    line-height:1.35;margin-top:1px}

  /* ---------- cards ---------- */
  .card{position:relative;background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--r);padding:var(--s4) var(--s4) var(--s4) calc(var(--s4) + 4px);
    margin:var(--s3) 0;overflow:hidden}
  /* 1px top highlight reads as light falling on the card — depth without a drop shadow.
     In the light themes it's a white highlight instead; both come from the theme block. */
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,var(--top-hi-a),var(--top-hi-b))}
  .rail{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat,var(--line-soft))}
  .card.done .rail{background:var(--good)}
  .ex-name{font-weight:700;font-size:var(--t-base);letter-spacing:-.1px;line-height:1.3}
  /* No tick on the name: the .ov-badge glyph says done once, in the column where the eye
     is already scanning for it. Three ticks on one card was two too many. */
  /* The prescription line, and — when the generator gave tempo/rest — a second, muted
     one under it. One line, not a hero number plus a row of pill chips: it reads faster
     than four separate widgets carrying the same three facts. */
  .rx{color:var(--muted);font-size:var(--t-sm);margin-top:var(--s1)}
  /* The two numbers the athlete is actually aiming at, lifted out of the prose beside
     them — everything else on the line is context. */
  .rx .rx-x{color:var(--ink-dim);font-weight:700}
  .rx.meta{color:var(--muted);font-size:var(--t-xs);margin-top:2px}
  .card.done{border-color:var(--good-line);
    background:linear-gradient(180deg,var(--good-soft),var(--good-soft-2)),var(--panel)}

  details{margin-top:var(--s3);border-top:1px solid var(--line-soft);padding-top:var(--s3)}
  details+details{margin-top:var(--s2)}
  /* Reference material, not an action: the disclosure carries no accent either. */
  summary{cursor:pointer;color:var(--ink-dim);font-size:var(--t-sm);font-weight:700;
    list-style:none;display:flex;align-items:center;gap:6px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"";width:0;height:0;border:4px solid transparent;
    border-left-color:var(--muted);transition:transform .15s;flex:0 0 auto}
  details[open] summary::before{transform:rotate(90deg) translateX(-1px)}
  details .body{color:var(--ink-dim);font-size:var(--t-sm);margin-top:var(--s2);
    white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}

  /* ---------- overview card (read-only) ---------- */
  /* The whole card is a button to the Log view at this exercise. No inputs live here —
     that is the entire point of splitting the two surfaces. */
  .card.ov{cursor:pointer;text-align:left;width:100%}
  .card.ov:active{transform:scale(.99)}
  .card.ov:focus-visible{box-shadow:var(--ring)}
  .ov-row{display:flex;gap:var(--s3);align-items:flex-start}
  /* One glyph per card, right-aligned down the column, so the state of a whole session
     reads in one vertical scan instead of six sentences. */
  .ov-badge{flex:0 0 auto;width:20px;text-align:center;font-size:var(--t-md);
    font-weight:700;line-height:1.3;color:var(--muted)}
  .ov-badge[data-state="part"]{color:var(--accent-ink)}
  .ov-badge[data-state="done"]{color:var(--good)}
  /* There is always a status line. An absent one would mean "untouched", which cannot be
     told apart from "it didn't render", and would leave a typed-but-unlogged set
     invisible everywhere outside the editor. */
  .ov-status{margin-top:var(--s3);font-size:var(--t-sm);color:var(--muted)}
  .ov-status[data-state="done"]{color:var(--good);font-weight:700}
  .ov-status[data-state="part"]{color:var(--accent-ink);font-weight:600}

  /* ---------- summary & notes (collapsed flat fields, inside Log view) ---------- */
  /* minmax(0,1fr) not 1fr: an input's intrinsic width exceeds a phone column and plain
     1fr refuses to shrink below it. */
  .log{margin-top:var(--s3);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
  .log>div{min-width:0}
  .log input,.log select,.log textarea{width:100%}
  .log .full{grid-column:1 / -1}
  @media (min-width:360px){
    .log.tight{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 56px 74px}
    .log.tight.nopain{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 56px}}
  /* nowrap: a label that wraps to two lines pushes its own input below the others in the
     same grid row, which reads as a broken layout rather than a long word. */
  .lbl{display:block;font-size:var(--t-xs);color:var(--muted);margin:0 0 var(--s1) 2px;
    font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* This exercise's own prescription asks for this reading — see painAsked(). Accented,
     never the difference between the field existing and not: an empty pain value has to
     stay readable as "no pain", which is what tracking.painPerExercise promises. */
  .lbl.asked{color:var(--accent-ink)}
  .lbl.asked::after{content:" •";color:var(--accent)}
  .fld{position:relative}
  .fld .unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    color:var(--placeholder);font-size:var(--t-xs);font-weight:600;pointer-events:none}
  /* Keep this tight: the suffix eats width from a 56–74px numeric column, and more
     padding clips the value itself on a 360px screen. */
  .fld.has-unit input{padding-right:31px}
  /* ---------- what the programme says to capture ----------
     The programme's own list of what matters for this movement: one chip per instruction,
     not one line of prose behind a "Log:" prefix that the eye slides straight off.
     Pain-relevant chips take the accent — the same cue that accents the pain field. */
  .hintchips{display:flex;flex-wrap:wrap;gap:var(--s1);align-items:center;margin-top:var(--s3)}
  .hintchips .hl{font-size:var(--t-xs);font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
  /* The programme's own list of what matters here. Quiet — only the pain-relevant ones
     are marked, which is the same cue that accents the pain field. */
  .hchip{padding:4px 9px;border-radius:999px;background:var(--well);
    color:var(--ink-dim);border:1px solid var(--line-soft);font-size:var(--t-xs);
    font-weight:600;line-height:1.35}
  .hchip.pain{background:var(--accent-soft);color:var(--accent-ink);
    border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
  textarea{width:100%;min-height:56px;resize:vertical;font-weight:400;line-height:1.5}

  /* ---------- the focus logger's instruments ----------
     The rest clock and "last time", side by side on one rule above the fields. Big
     tabular numerals with a tiny letterspaced label under them — an instrument reading,
     not a form field. */
  .instrument{display:flex;align-items:flex-end;gap:var(--s4);margin-top:var(--s4);
    padding-bottom:var(--s2);border-bottom:1px solid var(--line-soft);min-height:34px}
  .instrument:empty{display:none}
  .restclock{flex:0 0 auto;display:flex;flex-direction:column;line-height:1.05}
  .restclock[hidden]{display:none}
  .rc-value{font-size:var(--t-lg);font-weight:800;letter-spacing:-.03em;color:var(--muted)}
  /* Amber while you are still inside the prescribed rest, quiet once you may go. The
     mark is permission, not an alarm — nothing here sounds, buzzes or notifies. */
  .restclock[data-ready="false"] .rc-value{color:var(--accent-ink)}
  .rc-label{margin-top:2px;font-size:var(--t-xs);font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  /* Right-aligned, so the clock and the past reading do not fight for the same edge. */
  .lasttime{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
    align-items:flex-end;text-align:right;line-height:1.15}
  .lt-label{font-size:var(--t-xs);font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  /* Not green, and not accented: a fact about the past, never a prescription. */
  .lt-value{font-size:var(--t-base);font-weight:800;color:var(--ink-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .lt-ago{font-size:var(--t-xs);color:var(--muted)}

  /* ---------- set editor (Log view, one set at a time) ----------
     Chips show every set already logged plus the one in progress; the fields below are
     always exactly one set's worth, which is what keeps this usable one-handed and
     keeps a keystroke from ever having to rebuild the row it is happening in. */
  .setblock{margin-top:var(--s4)}
  /* What has actually been recorded, in words; see buildSetEditor(). Scrolls rather than
     wraps, so a long run of sets cannot push the fields down. */
  .setrecap{display:flex;gap:var(--s2);align-items:baseline;margin-bottom:var(--s2);
    font-size:var(--t-sm);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
  .setrecap::-webkit-scrollbar{display:none}
  .setrecap .rl{flex:0 0 auto;color:var(--muted);font-size:var(--t-xs);font-weight:700;
    text-transform:uppercase;letter-spacing:.6px}
  .setrecap .rv{color:var(--good);font-weight:700}
  .setchips{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;
    padding-bottom:2px;margin-bottom:var(--s3)}
  .setchips::-webkit-scrollbar{display:none}
  /* grid + place-items, not the button default: half of these are <span> placeholders now
     and a span would otherwise leave its digit in the top-left corner. */
  .setchip{flex:0 0 auto;min-width:32px;height:30px;padding:0 8px;border-radius:999px;
    display:grid;place-items:center;
    border:1px solid var(--line-soft);background:var(--well);color:var(--muted);
    font-size:var(--t-xs);font-weight:700;font-variant-numeric:tabular-nums}
  .setchip[data-state="done"]{color:var(--good);border-color:var(--good-line);background:var(--good-soft)}
  .setchip[data-state="current"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  /* Dashed and quiet, because an upcoming set is a plan rather than a destination. It is
     a <span>, never a control — see buildSetEditor(). */
  .setchip[data-state="todo"]{opacity:.55;border-style:dashed;color:var(--placeholder);
    background:transparent}
  /* The set that just landed. The one bit of motion in the app, and it earns its place:
     it is the acknowledgement that a tap did something. */
  @keyframes chippop{
    0%{transform:scale(.8)}
    55%{transform:scale(1.14)}
    100%{transform:scale(1)}
  }
  .setchip.just{animation:chippop .42s cubic-bezier(.2,.8,.2,1)}
  .setlabelrow{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
  .setlabel{flex:1 1 auto;min-width:0;font-size:var(--t-sm);color:var(--muted);font-weight:700}
  .setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
  @media (min-width:360px){
    .setgrid{grid-template-columns:repeat(3,minmax(0,1fr)) 70px}
    .setgrid.nopain{grid-template-columns:repeat(3,minmax(0,1fr))}}
  /* width:100% matters below 360px, where the grid drops to two columns wider than an
     input's intrinsic width: without it the input sat narrow inside its cell and the /10
     suffix — positioned against the cell — floated outside the box it belongs to. */
  .setgrid input{width:100%;text-align:center;min-height:var(--h-field);font-size:var(--t-md)}
  /* The instrument treatment: a rule under a big tabular numeral, and a tiny
     letterspaced label over it, instead of four boxed form fields. The tap target is
     still the full --h-field, which is what a chalked thumb needs. */
  .setgrid .lbl{text-align:center;text-transform:uppercase;letter-spacing:.06em;
    font-weight:800}
  .setgrid input,.setgrid .pickerbtn{background:transparent;border:0;border-radius:0;
    border-bottom:2px solid var(--line);padding:6px 2px}
  /* No ring: the rule going amber and the field lighting up is the focus indicator, and
     a 3px ring around a borderless field reads as a box coming back. */
  .setgrid input:focus,.setgrid .pickerbtn:focus,.setgrid .pickerbtn:focus-visible{
    border-bottom-color:var(--accent);box-shadow:none;background:var(--accent-soft)}
  /* Load and whatever the exercise measures — the two numbers being aimed at. */
  .setgrid .big input{font-size:1.375rem;font-weight:800;letter-spacing:-.02em}
  .setgrid .big .unit{font-size:var(--t-xs)}
  .setnoteinp{margin-top:var(--s2)}
  .setnoteinp input{width:100%;min-height:var(--h-tap)}
  /* Two non-wrapping rows; both carry .setactions so apptest's actionBtn() finds every
     button one level deep. See buildSetEditor() for why they are split. */
  .setactions{display:flex;gap:var(--s2);margin-top:var(--s3)}
  .setactions>button{flex:1 1 0;min-width:0}
  .setactions.mainrow>button{min-height:var(--h-primary);font-size:var(--t-base)}
  .setactions.subrow{margin-top:var(--s2)}
  .setactions.subrow>button{min-height:var(--h-tap);font-size:var(--t-sm)}
  .setactions.subrow:empty{display:none}

  /* ---------- mobile action sheet ----------
     RPE, set-count changes and circuit logging choices are finite decisions. Keeping
     them in one reusable bottom sheet avoids opening a keyboard and keeps secondary
     controls out of the set-by-set path. */
  .sheet-wrap{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end}
  .sheet-wrap.in{display:flex}
  .sheet-bg{position:absolute;inset:0;background:var(--scrim)}
  .sheet{position:relative;width:100%;max-width:720px;margin:0 auto;background:var(--panel);
    border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
    padding:var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));
    max-height:min(82vh,680px);overflow-y:auto;overscroll-behavior:contain}
  .sheet-handle{width:38px;height:4px;border-radius:999px;background:var(--line);
    margin:0 auto var(--s3)}
  .sheet-head{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s3)}
  .sheet-title{font-size:var(--t-md);font-weight:800;line-height:1.25}
  .sheet-copy{font-size:var(--t-sm);color:var(--muted);line-height:1.45;margin-top:2px}
  .sheet-close{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:50%}
  .sheet-actions{display:flex;gap:var(--s2);margin-top:var(--s4)}
  .sheet-actions>button{flex:1 1 0;min-height:var(--h-tap)}
  .rpe-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
  .rpe-grid button{min-height:48px;padding:8px 4px;font-variant-numeric:tabular-nums}
  .rpe-grid button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);
    border-color:var(--accent)}
  .pickerbtn{width:100%;min-height:var(--h-field);text-align:center;font-size:var(--t-md);
    font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
  .pickerbtn.empty{color:var(--placeholder);font-weight:500}
  /* Amber means *now* — the primary action, the rest clock while you are still resting,
     the current pip, today on the calendar. A secondary action that borrowed it was
     competing with the one tap that matters, so quiet actions are muted and underlined
     instead. */
  .quietaction,.addnote{border:0;background:transparent;color:var(--muted);padding:6px 2px;
    font-size:var(--t-sm);font-weight:700;text-decoration:underline;
    text-underline-offset:3px}
  .setsecondary{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;
    margin-top:var(--s2)}
  .setsecondary button:last-child{text-align:right}
  .adjustbox{display:flex;align-items:center;justify-content:center;gap:var(--s3);
    background:var(--well);border:1px solid var(--line-soft);border-radius:var(--r-sm);
    padding:var(--s3)}
  .adjustbox button{width:48px;height:48px;padding:0;font-size:var(--t-lg);border-radius:50%}
  .adjustvalue{min-width:120px;text-align:center}
  .adjustvalue strong{display:block;font-size:var(--t-lg);font-variant-numeric:tabular-nums}

   start. Kept deliberately tiny and duplicated — it must mirror themeId() below. */
(function(){try{

  var dark=m==="auto"?!matchMedia("(prefers-color-scheme: light)").matches:m!=="light";
  document.documentElement.dataset.theme=p+(dark?"-dark":"-light");

const $ = (s,r=document)=>r.querySelector(s);

  return n;};

const LS = { prog:"tp_program_v1", set:"tp_settings_v1",
  /* The block anchor — one stored date per programme. See the schedule section. */
  sched:"tp_schedule_v1", demoSched:"tp_demo_schedule_v1",
  /* The account half of the settings — see the settings section for the scope split. */
  acct:"tp_account_settings_v1",
  sessPrefix:"tp_sess_v1::", demoSessPrefix:"tp_demo_sess_v1::",
  sess:(d,day)=>`tp_sess_v1::${d}::${day}`,
  demoSess:(d,day)=>`tp_demo_sess_v1::${d}::${day}` };
/* `date` is the primary axis and always starts at TODAY — the app never opens "the next
   thing", because a screen that silently shows another day gets you doing the wrong
   session. `week` and `day` are DERIVED from it: read off the claim when a session is
   stored on that date, else the schedule's suggestion. Nothing about the position is
   stored separately: a stored position can disagree with the claim, and when it does it
   shows the wrong week's prescriptions. `focus` is the index of the exercise
   shown in the Log view, derived on a cold start from what is already ticked off, which
   lands you on the first exercise you haven't done. `setEdit` is the index of a
   committed set being re-edited from its chip, or null while typing the next new one —
   always in-memory, reset by every navigation function below. The Overview scroll
   position is runtime-only too: it survives a trip into Log, but resets when the
   programme, week, day or date changes. */
/* Retired keys, removed when a programme is cleared so a stale copy can never be picked
   up by a reader that has no business reading it. */

let PROGRAM=null, STATE={week:1,day:null,date:todayISO(),focus:0,setEdit:null};
/* Cold starts always land on the entry gate. `route` is which of the five surfaces is
   showing; `source` changes the local session namespace while a workout is open. Both
   are runtime-only and neither reaches an export.
     entry      the sign-in / sample gate, owned by profile-ui
     home       the hub — today first, the last few sessions, rows to everything else
     calendar   a continuous scroll of weeks
     date       the date view and the focus logger
     programme  the private library, the block anchor, import
     account    the account, sync state, and the device/account settings split

   always to the hub — one level, because there is nothing deeper to remember. */
const APP={surface:"profile",route:"entry",source:null,from:"home"};
let SAMPLE_PROGRAM=null;
let OVERVIEW_SCROLL=0;

/* ---------- local calendar days ----------

   parses a bare "2026-01-01" as midnight UTC, which lands on 31 Dec west of Greenwich
   and would shift a whole block by a day; `parseISO` builds from the local parts

function isoOf(d){const z=n=>String(n).padStart(2,"0");

function parseISO(iso){

  /* Rejects "2026-02-31", which JS would roll forward into March without complaint. */
  if(isNaN(d.getTime())||d.getMonth()!==Number(m[2])-1||d.getDate()!==Number(m[3]))return null;
  return d;

  d.setDate(d.getDate()+(Math.round(Number(n))||0));

/* 1 = Monday … 7 = Sunday. getDay() is 0 = Sunday, and every schedule number in this
   app is Monday-first, so the conversion happens once, here. */
function weekdayOf(iso){const d=parseISO(iso);if(!d)return 0;return d.getDay()===0?7:d.getDay();}
function mondayOf(iso){const w=weekdayOf(iso);return w?addDays(iso,1-w):"";}
/* Whole days from a to b. Both are local midnights, so a DST boundary makes the raw
   difference 23 or 25 hours — rounding is what keeps that from reading as 0 or 1.04 days. */
function daysBetween(a,b){
  const x=parseISO(a),y=parseISO(b);
  if(!x||!y)return null;
  return Math.round((y.getTime()-x.getTime())/86400000);
}
function toast(msg,action){const t=$("#toast");t.innerHTML="";t.classList.toggle("action",!!action);

  t._t=setTimeout(()=>hideToast(),action?4200:1900);}
function hideToast(){const t=$("#toast");t.classList.remove("show","action");t.innerHTML="";}
function slug(s){return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,40);}

function parseNum(s){const n=parseFloat(s);return Number.isFinite(n)?n:null;}

/* One place decides which surface is visible, and it is the only place that touches the
   `hidden` flags — five screens toggled from five different handlers is how the old
   layout ended up with no flow. */
const PAGE_TITLES={calendar:"Calendar",programme:"Programme",account:"Account"};
function showRoute(route){

/* ---------- settings ----------
   Which optional inputs are shown. Defaults are all-on, so the coaching loop that
   depends on the pain fields behaves as expected out of the box; an athlete without knee
   issues turns them off once.

   TWO SCOPES, one read model: tracked fields and their labels follow the ACCOUNT, while
   appearance and the opening view stay on the DEVICE. ACCOUNT_KEYS/DEVICE_KEYS below is
   the only place that split is decided. See docs/design-rationale.md for why it falls
   there. */
const FIELD_DEFS=[
  {key:"painPerExercise",name:"Pain per exercise",
   desc:"A 0–10 pain box on every set. Knee load varies hugely between movements, so this is what identifies which movement to regress."},
  {key:"painOnWaking",name:"Pain on waking",
   desc:"Session-level 0–10, filled at check-in. It reads how the tissue woke up today, which is the response to the LAST session — not this one."},
  {key:"readiness",name:"Readiness",desc:"Green / Amber / Red — governs whether load progresses, holds or regresses."},
  {key:"sleep",name:"Sleep score",desc:"Subjective 1–5."},
  {key:"bodyweight",name:"Bodyweight",desc:"Logged in kg at check-in."},
  {key:"hrvNote",name:"HRV / notes",desc:"Free text for HRV and anything else about recovery."}
];
/* palette + mode + view are cosmetic and deliberately NOT part of the session export —
   the `tracking` block is built from FIELD_DEFS and painLabel alone, so nothing here can
   leak into a log. `sv` is a one-shot settings-migration marker — see loadSettings(). */
const SET_DEFAULTS={painLabel:"Knee",palette:"a",mode:"auto",view:"focus",sv:1};
FIELD_DEFS.forEach(f=>SET_DEFAULTS[f.key]=true);
let SETTINGS={...SET_DEFAULTS};
/* Which store owns a key is decided HERE and nowhere else, so a new setting cannot end
   up in the wrong scope by accident. */
const ACCOUNT_KEYS=["painLabel"].concat(FIELD_DEFS.map(f=>f.key));
const DEVICE_KEYS=["palette","mode","view","sv"];
function accountScoped(key){return ACCOUNT_KEYS.indexOf(key)>=0;}
/* The account half, as {values, at}: the value plus one ISO stamp per field, which is
   what makes the conflict rule last-write-wins PER FIELD. */
let ACCOUNT_SETTINGS={values:{},at:{}};

function loadSettings(){
  let stored=null;
  try{
    const raw=localStorage.getItem(LS.set);
    if(raw)stored=JSON.parse(raw);
  }catch(e){}
  SETTINGS={...SET_DEFAULTS,...(stored||{})};
  /* An install predating Log-as-default has no `sv` and a stored `view` of "list", which
     would open straight onto the read-only Overview and look like logging had vanished.
     One-shot fix-up. */
  const needsView=!stored||!stored.sv;
  if(needsView){SETTINGS.view="focus";SETTINGS.sv=1;}
  ACCOUNT_SETTINGS=readAccountSettings();
  /* An install that predates the account scope has its tracked fields in the DEVICE
     record. Move them across with the athlete's real values and stamp them now: a
     migration IS a write, and last-write-wins then resolves two devices migrating
     differently — which the athlete can see and re-set in one tap. */
  let migrated=false;
  if(stored)ACCOUNT_KEYS.forEach(key=>{
    if(!(key in stored))return;
    if(Object.prototype.hasOwnProperty.call(ACCOUNT_SETTINGS.values,key))return;
    ACCOUNT_SETTINGS.values[key]=stored[key];
    ACCOUNT_SETTINGS.at[key]=new Date().toISOString();
    migrated=true;
  });
  applyAccountSettings();
  if(needsView)saveSettings();
  if(migrated)writeAccountSettings(true);
}
/* The device half only. The account keys are stripped so a stale copy of them cannot sit
   in the device record and confuse a later reader. */
function saveSettings(){
  const device={};
  DEVICE_KEYS.forEach(k=>{device[k]=SETTINGS[k];});
  try{localStorage.setItem(LS.set,JSON.stringify(device));}catch(e){}
}
function readAccountSettings(){
  if(window.TPAccountSettings&&TPAccountSettings.read)return TPAccountSettings.read();
  try{
    const raw=JSON.parse(localStorage.getItem(LS.acct)||"null");
    return {values:(raw&&raw.values)||{},at:(raw&&raw.at)||{}};
  }catch(e){return {values:{},at:{}};}
}
/* Fold the account record over the defaults into the one read model everything renders
   from, so no caller has to know which scope a key came from. */
function applyAccountSettings(){
  ACCOUNT_KEYS.forEach(key=>{
    SETTINGS[key]=Object.prototype.hasOwnProperty.call(ACCOUNT_SETTINGS.values,key)
      ?ACCOUNT_SETTINGS.values[key]:SET_DEFAULTS[key];
  });
}
/* Device-first: the local record is written synchronously and is authoritative for
   rendering; the store schedules the remote half and a keystroke never waits for it. */
function writeAccountSettings(){
  if(window.TPAccountSettings&&TPAccountSettings.stage){
    TPAccountSettings.stage(ACCOUNT_SETTINGS);return;
  }
  try{localStorage.setItem(LS.acct,JSON.stringify(ACCOUNT_SETTINGS));}catch(e){}
}
/* The one way to change a setting. Nothing else may assign into SETTINGS. */
function setSetting(key,value){
  SETTINGS[key]=value;
  if(!accountScoped(key)){saveSettings();return;}
  ACCOUNT_SETTINGS.values[key]=value;
  ACCOUNT_SETTINGS.at[key]=new Date().toISOString();
  writeAccountSettings();
}
/* A merged record arriving from another device. Adopted into the read model and
   repainted — the athlete may be looking at the very switch that changed. */
function adoptAccountSettings(record){
  ACCOUNT_SETTINGS={values:(record&&record.values)||{},at:(record&&record.at)||{}};
  applyAccountSettings();
  if(APP.route==="account")renderAccountPage();
  else if(APP.route==="date"){renderCheckin();renderMain();}
  else if(APP.route==="calendar")renderCalendar();
}

/* ---------- theme ----------
   Two palettes × light/dark. "Auto" follows the phone's own light/dark setting, so the
   basement session is dark and a daytime check-in isn't blinding, with no tap needed. */
const PALETTES=[
  {key:"a",name:"Amber",desc:"Black, navy, amber",
   swatch:["#000000","#14213d","#fca311","#e5e5e5","#ffffff"]},
  {key:"b",name:"Mint",desc:"Slate, teal, mint",
   swatch:["#364958","#3b6064","#55828b","#87bba2","#c9e4ca"]}
];
const MODES=[["auto","Auto"],["light","Light"],["dark","Dark"]];
const prefersLight=matchMedia("(prefers-color-scheme: light)");

function themeId(){
  const p=SETTINGS.palette==="b"?"b":"a";
  const dark=SETTINGS.mode==="auto"?!prefersLight.matches:SETTINGS.mode!=="light";
  return p+(dark?"-dark":"-light");
}
function applyTheme(){
  document.documentElement.dataset.theme=themeId();
  /* Keeps the phone's own chrome (status bar / task switcher) in step with the app. */
  const c=getComputedStyle(document.documentElement).getPropertyValue("--meta-theme").trim();
  if(c)$("#metaTheme").setAttribute("content",c);
}
/* Only matters in Auto; harmless otherwise. addEventListener over onchange because
   older iOS Safari only has the deprecated addListener — guarded. */
if(prefersLight.addEventListener)prefersLight.addEventListener("change",()=>{
  if(SETTINGS.mode==="auto")applyTheme();});
else if(prefersLight.addListener)prefersLight.addListener(()=>{
  if(SETTINGS.mode==="auto")applyTheme();});
/* "Knee" -> "Knee pain"; blank -> plain "Pain", so it reads sensibly for anyone. */
function painLbl(suffix){
  const site=(SETTINGS.painLabel||"").trim();
  return (site?site+" pain":"Pain")+(suffix||"");
}
/* For the ~70px column in the set editor, where the instrument label is uppercase and
   letterspaced: the site on its own, with the /10 unit beside it carrying the rest. */
function painLblShort(){return (SETTINGS.painLabel||"").trim()||"Pain";}

function renderAppearance(host){

function renderFields(host){
  host.innerHTML="";
  host.append(el("p",{className:"dnote"},"Turn off what you don't need — nothing already logged is deleted."));
  FIELD_DEFS.forEach(f=>{
    const sw=el("button",{className:"sw",attrs:{role:"switch","aria-checked":String(!!SETTINGS[f.key]),
      "aria-label":f.name}});

  /* The imported programme already says which site it monitors, in its own logHints —

/* ---------- what a session says about itself ----------
   The check-in's own one-line status, shown beside it on the date view so the answer
   never costs a tap. */
function checkinSummary(s){
  const v=(s&&s.session)||{},b=[];
  if(SETTINGS.readiness&&txt(v.readiness))b.push(txt(v.readiness));
  if(SETTINGS.painOnWaking&&txt(v.amPainOnWaking))b.push(painLbl().toLowerCase()+" "+txt(v.amPainOnWaking)+"/10");
  if(SETTINGS.sleep&&txt(v.sleep))b.push("sleep "+txt(v.sleep)+"/5");
  if(SETTINGS.bodyweight&&txt(v.bodyweightKg))b.push(txt(v.bodyweightKg)+"kg");
  return b.join(" · ")||(checkinFilled(s)?"Filled":"Not filled");
}
/* Any value at all, including ones whose field is currently switched off. */
function checkinFilled(s){
  const v=(s&&s.session)||{};
  return Object.keys(BLANK_SESSION).some(k=>txt(v[k])!=="");
}

/* ---------- moving around the block ----------
   Week and day are a CLAIM on the open date, made in one picker; the date itself is the
   calendar. Both functions below are what that picker calls, and each is either a write
   (a claim) or a re-resolve (a date) — never an independent axis that can drift out of
   step with reality. */
function selectDay(d){
  if(d===STATE.day)return;
  /* A session already stored for this day on this date carries its own week — that is
     the claim, and it wins over whichever week happens to be on screen. */
  const stored=sessionsOn(STATE.date).find(r=>r.day===d);
  applyClaim(stored?stored.week:STATE.week,d);
}
function selectDate(v){openDate(v||todayISO());}
function selectWeek(w){applyClaim(w,STATE.day);}
